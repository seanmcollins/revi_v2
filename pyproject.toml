[project]
name = "revi-workspace"
version = "0.1.0"
description = "Revi — conversational investigation platform for RCM analytics (workspace root)"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/*",
    "warehouse/generator",
    "apps/api",
    "apps/scheduler",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "httpx>=0.27",
    "ruff>=0.9",
    "mypy>=1.13",
    "import-linter>=2.1",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "warehouse", "apps"]
markers = [
    "reference: reference-dataset regression tests (assert answer-key numbers against the generated warehouse)",
    "live_llm: tests that call the real Claude Agent SDK (budget-capped; need ANTHROPIC_API_KEY)",
    "postgres: tests that need the docker-compose Postgres instance",
]
addopts = "-m 'not live_llm and not postgres' --import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["packages/*/src", "warehouse/generator/src", "apps/*/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "TID"]
ignore = ["SIM108"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = [
    "packages/kernel/src",
    "packages/investigation-contracts/src",
    "packages/investigation/src",
    "packages/catalog-contracts/src",
    "packages/catalog/src",
    "packages/calculation-contracts/src",
    "packages/calculation/src",
    "packages/statistics-contracts/src",
    "packages/statistics/src",
    "packages/pack-contracts/src",
    "packages/pack/src",
    "packages/pack-learning/src",
    "packages/presentation/src",
    "packages/connector-duckdb/src",
    "packages/store-postgres/src",
    "packages/adapter-claude/src",
    "packages/testing/src",
    "warehouse/generator/src",
    "apps/api/src",
    "apps/scheduler/src",
]

[[tool.mypy.overrides]]
module = ["duckdb.*", "claude_agent_sdk.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = [
    "revi_kernel",
    "revi_investigation_contracts",
    "revi_investigation",
    "revi_catalog_contracts",
    "revi_catalog",
    "revi_calculation_contracts",
    "revi_calculation",
    "revi_statistics_contracts",
    "revi_statistics",
    "revi_pack_contracts",
    "revi_pack",
    "revi_pack_learning",
    "revi_presentation",
    "revi_connector_duckdb",
    "revi_store_postgres",
    "revi_adapter_claude",
    "revi_testing",
    "revi_warehouse",
    "revi_api",
    "revi_scheduler",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Kernel is standalone (imports no other Revi package and no vendor SDKs)"
type = "forbidden"
source_modules = ["revi_kernel"]
forbidden_modules = [
    "revi_investigation", "revi_investigation_contracts",
    "revi_catalog", "revi_catalog_contracts",
    "revi_calculation", "revi_calculation_contracts",
    "revi_statistics", "revi_statistics_contracts",
    "revi_pack", "revi_pack_contracts", "revi_pack_learning",
    "revi_presentation", "revi_connector_duckdb", "revi_store_postgres",
    "revi_adapter_claude", "revi_testing", "revi_warehouse", "revi_api", "revi_scheduler",
    "pydantic", "duckdb", "sqlalchemy", "fastapi", "claude_agent_sdk", "yaml", "numpy",
]

[[tool.importlinter.contracts]]
name = "Capability implementations are independent (interact only via contracts + kernel)"
type = "independence"
modules = [
    "revi_investigation",
    "revi_catalog",
    "revi_calculation",
    "revi_statistics",
    "revi_pack",
    "revi_pack_learning",
    "revi_presentation",
]

[[tool.importlinter.contracts]]
name = "duckdb only in the DuckDB connector and warehouse generator"
type = "forbidden"
source_modules = [
    "revi_kernel", "revi_investigation", "revi_investigation_contracts",
    "revi_catalog", "revi_catalog_contracts", "revi_calculation", "revi_calculation_contracts",
    "revi_statistics", "revi_statistics_contracts",
    "revi_pack", "revi_pack_contracts", "revi_pack_learning", "revi_presentation",
    "revi_store_postgres", "revi_adapter_claude", "revi_api", "revi_scheduler",
]
forbidden_modules = ["duckdb"]
# Composition roots wire the DuckDB CONNECTOR (never duckdb directly);
# these edges are the sanctioned wiring points.
ignore_imports = [
    "revi_api.wiring -> revi_connector_duckdb",
    "revi_scheduler.sweep -> revi_connector_duckdb",
]

[[tool.importlinter.contracts]]
name = "claude_agent_sdk only in the Claude adapter"
type = "forbidden"
source_modules = [
    "revi_kernel", "revi_investigation", "revi_investigation_contracts",
    "revi_catalog", "revi_catalog_contracts", "revi_calculation", "revi_calculation_contracts",
    "revi_statistics", "revi_statistics_contracts",
    "revi_pack", "revi_pack_contracts", "revi_pack_learning", "revi_presentation",
    "revi_connector_duckdb", "revi_store_postgres", "revi_testing", "revi_warehouse",
    "revi_api", "revi_scheduler",
]
forbidden_modules = ["claude_agent_sdk"]
# The API composition root wires the Claude ADAPTER (never the SDK
# directly); this one edge is the sanctioned wiring point.
ignore_imports = ["revi_api.wiring -> revi_adapter_claude.config"]

[[tool.importlinter.contracts]]
name = "SQL/storage drivers only in the Postgres store"
type = "forbidden"
source_modules = [
    "revi_kernel", "revi_investigation", "revi_investigation_contracts",
    "revi_catalog", "revi_catalog_contracts", "revi_calculation", "revi_calculation_contracts",
    "revi_statistics", "revi_statistics_contracts",
    "revi_pack", "revi_pack_contracts", "revi_pack_learning", "revi_presentation",
    "revi_connector_duckdb", "revi_adapter_claude", "revi_warehouse",
]
forbidden_modules = ["sqlalchemy", "psycopg", "alembic"]

[[tool.importlinter.contracts]]
name = "FastAPI only in the API app"
type = "forbidden"
source_modules = [
    "revi_kernel", "revi_investigation", "revi_investigation_contracts",
    "revi_catalog", "revi_catalog_contracts", "revi_calculation", "revi_calculation_contracts",
    "revi_statistics", "revi_statistics_contracts",
    "revi_pack", "revi_pack_contracts", "revi_pack_learning", "revi_presentation",
    "revi_connector_duckdb", "revi_store_postgres", "revi_adapter_claude", "revi_warehouse",
    "revi_scheduler",
]
forbidden_modules = ["fastapi", "starlette", "uvicorn"]

# The statistics capability is a pure estimation kernel: typed rows in,
# estimates out. Two contracts keep it that way.
#
# It may see the shared kernel and its own contracts, and nothing else. In
# particular no numeric vendor: every estimator here is stdlib `math`, and
# that is a deliberate choice rather than an accident waiting to be
# "fixed" by someone reaching for scipy to get one quantile function. A
# statistics package that grows a numeric stack also grows that stack's
# version-dependent numerics, and this one's output has to be identical
# across runs and machines.
[[tool.importlinter.contracts]]
name = "Statistics sees only the kernel and its own contracts (and no numeric vendor)"
type = "forbidden"
source_modules = ["revi_statistics", "revi_statistics_contracts"]
forbidden_modules = [
    "revi_investigation", "revi_investigation_contracts",
    "revi_catalog", "revi_catalog_contracts",
    "revi_calculation", "revi_calculation_contracts",
    "revi_pack", "revi_pack_contracts", "revi_pack_learning",
    "revi_presentation", "revi_connector_duckdb", "revi_store_postgres",
    "revi_adapter_claude", "revi_testing", "revi_warehouse", "revi_api", "revi_scheduler",
    "numpy", "scipy", "pandas", "statsmodels", "sklearn", "pydantic", "yaml",
]

# Nothing consumes statistics yet. Deep research (phase 3) is the intended
# and only caller; until it exists, an accidental import from the engine or
# the API would create a dependency nobody designed. Deleting this contract
# is the deliberate act that admits the first consumer.
[[tool.importlinter.contracts]]
name = "Nothing imports statistics yet (phase 3 is its only intended consumer)"
type = "forbidden"
source_modules = [
    "revi_kernel", "revi_investigation", "revi_investigation_contracts",
    "revi_catalog", "revi_catalog_contracts", "revi_calculation", "revi_calculation_contracts",
    "revi_pack", "revi_pack_contracts", "revi_pack_learning", "revi_presentation",
    "revi_connector_duckdb", "revi_store_postgres", "revi_adapter_claude",
    "revi_testing", "revi_warehouse", "revi_api", "revi_scheduler",
]
forbidden_modules = ["revi_statistics", "revi_statistics_contracts"]
