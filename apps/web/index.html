<!doctype html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- The document title and description Next generated from `metadata`.
         The layout route re-asserts the title on every navigation so a deep
         link into a route that changes it still reads correctly in history;
         this is the value the tab shows before React attaches. -->
    <title>Revi — RCM Investigations</title>
    <meta
      name="description"
      content="Conversational revenue-cycle analytics: typed investigations, governed metrics, auditable evidence."
    />
  </head>
  <!-- `h-full antialiased` on <html> and `h-full overflow-hidden` on <body>
       were set by the Next root layout; the app is a fixed-height three-column
       desktop tool and the page itself must never scroll. Light is the only
       theme, so there is nothing to reconcile before React attaches. -->
  <body class="h-full overflow-hidden">
    <div id="root" class="contents"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
