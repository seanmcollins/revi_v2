[project]
name = "revi-api"
version = "0.1.0"
description = "FastAPI application: composition root, /v1 routes, SSE streaming."
requires-python = ">=3.12"
dependencies = [
    "revi-investigation",
    "revi-investigation-contracts",
    "revi-catalog",
    "revi-calculation",
    "revi-pack",
    "revi-presentation",
    "revi-connector-duckdb",
    "revi-store-postgres",
    "revi-adapter-claude",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "orjson>=3.10",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revi_api"]

[tool.uv.sources]
revi-investigation = { workspace = true }
revi-investigation-contracts = { workspace = true }
revi-catalog = { workspace = true }
revi-calculation = { workspace = true }
revi-pack = { workspace = true }
revi-presentation = { workspace = true }
revi-connector-duckdb = { workspace = true }
revi-store-postgres = { workspace = true }
revi-adapter-claude = { workspace = true }
