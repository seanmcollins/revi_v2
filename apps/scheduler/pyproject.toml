[project]
name = "revi-scheduler"
version = "0.1.0"
description = "Portfolio pre-materialization runner and cohort TTL sweep (CLI, cron-able)."
requires-python = ">=3.12"
dependencies = [
    "revi-investigation",
    "revi-pack",
    "revi-connector-duckdb",
    "revi-store-postgres",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revi_scheduler"]

[tool.uv.sources]
revi-investigation = { workspace = true }
revi-pack = { workspace = true }
revi-connector-duckdb = { workspace = true }
revi-store-postgres = { workspace = true }
