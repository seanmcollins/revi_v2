# Semantic catalog: certified dimensions (+ two deliberately uncertified ones
# that exercise the discovery-grade downgrade path, design doc section 2.3).
# Synonyms are seeded with Epic-Clarity / Athena / eCW-style analyst vocabulary.
# phi: none | indirect | direct.
version: 1
dimensions:
  payer:
    label: Payer
    certified: true
    entities:
      claim: payer_name
      claim_line: payer_name
      transaction: payer_name
      remit: payer_name
      denial: payer_name
    synonyms: [payor, insurance, carrier, ins, plan payer, rmt payer, remit payer, insurance company]
    cardinality_estimate: 12
    phi: none
  payer_type:
    label: Payer type
    certified: true
    entities:
      claim: payer_type
      claim_line: payer_type
      transaction: payer_type
      remit: payer_type
      denial: payer_type
    synonyms: [payer category, payor type, payer class, coverage type, insurance type, payer group]
    cardinality_estimate: 7
    value_domain: [COMMERCIAL, MEDICARE, MEDICARE_ADVANTAGE, MEDICAID, MEDICAID_MCO, BCBS, OTHER]
    phi: none
  financial_class:
    label: Financial class
    certified: true
    entities:
      claim: financial_class
      claim_line: financial_class
      transaction: financial_class
      remit: financial_class
      denial: financial_class
    synonyms: [fin class, fc, financial category, fin cls]
    cardinality_estimate: 6
    phi: none
  plan:
    label: Plan
    certified: true
    entities:
      claim: plan_name
      claim_line: plan_name
      transaction: plan_name
      denial: plan_name
    synonyms: [benefit plan, insurance plan, coverage, product, epm plan]
    cardinality_estimate: 30
    phi: none
  product_type:
    label: Product type
    certified: true
    entities:
      claim: product_type
      claim_line: product_type
      transaction: product_type
      denial: product_type
    synonyms: [product, line of business, lob, plan type]
    cardinality_estimate: 6
    value_domain: [PPO, HMO, POS, MA, FFS, MCO]
    phi: none
  provider:
    label: Provider
    certified: true
    entities:
      claim: provider_name
    synonyms: [rendering provider, physician, doctor, doc, billing provider, rendering]
    cardinality_estimate: 150
    phi: indirect # a real provider roster narrows re-identification; synthetic here
  provider_specialty:
    label: Provider specialty
    certified: true
    entities:
      claim: provider_specialty
    synonyms: [specialty, spec, provider type, dept specialty]
    cardinality_estimate: 10
    phi: none
  facility:
    label: Facility
    certified: true
    entities:
      claim: facility_name
      claim_line: facility_name
      transaction: facility_name
      remit: facility_name
      denial: facility_name
    synonyms: [location, site, hospital, campus, service area, loc, place of service]
    cardinality_estimate: 6
    phi: none
  region:
    label: Region
    certified: true
    entities:
      claim: region
      claim_line: region
      transaction: region
      remit: region
      denial: region
    synonyms: [market, geography, area, division]
    cardinality_estimate: 5
    phi: none
  service_line:
    label: Service line
    certified: true
    entities:
      claim: service_line_name
      claim_line: service_line_name
      transaction: service_line_name
      remit: service_line_name
      denial: service_line_name
    synonyms: [svc line, department, dept, clinical service, product line, service area]
    cardinality_estimate: 10
    phi: none
  claim_type:
    label: Claim type
    certified: true
    entities:
      claim: claim_type
      claim_line: claim_type
      transaction: claim_type
      denial: claim_type
    synonyms: [claim form, form type, prof vs facility, ub vs hcfa, 1500 vs ub04, institutional flag]
    cardinality_estimate: 2
    value_domain: [PROFESSIONAL, INSTITUTIONAL]
    phi: none
  payer_sequence:
    label: Payer sequence
    certified: true
    entities:
      claim: payer_sequence
      claim_line: payer_sequence
    synonyms: [cob order, primary secondary tertiary, coverage order, filing order, payer order]
    cardinality_estimate: 3
    value_domain: [P, S, T]
    phi: none
  carc:
    label: CARC (adjustment reason code)
    certified: true
    entities:
      denial: carc_code
    synonyms: [reason code, denial code, adjustment reason, carc code, remark reason, rc]
    cardinality_estimate: 20
    # A CARC is half an identity: CO-50 is a contractual write-off and PI-50
    # is a disputable payer-initiated reduction (codes.yaml: "denial
    # analytics key on the group code + CARC pair"). Pack playbooks already
    # conjoin the pair; declaring it here makes a FREE-FORM "by CARC" cut do
    # the same instead of merging two different liabilities into one row.
    companion_dimensions: [group_code]
    phi: none
  group_code:
    label: Adjustment group code
    certified: true
    entities:
      denial: group_code
    synonyms: [group, adjustment group, co pr oa, denial group]
    cardinality_estimate: 4
    value_domain: [CO, PR, OA, PI]
    phi: none
  denial_category:
    label: Denial category
    certified: true
    entities:
      denial: denial_category
    synonyms: [denial reason category, denial bucket, denial type, root cause category]
    cardinality_estimate: 10
    value_domain:
      [AUTH, ELIGIBILITY, COB, TIMELY_FILING, CODING, CONTRACTUAL, DUPLICATE, MEDICAL_NECESSITY, PATIENT_RESP, OTHER]
    phi: none
  proc_group:
    label: Procedure group
    certified: true
    entities:
      claim_line: proc_group
    synonyms: [procedure category, proc category, cpt group, service group, procedure family]
    cardinality_estimate: 13
    phi: none
  primary_proc_group:
    label: Primary procedure group
    certified: true
    description: >
      The claim's DOMINANT procedure group: among that claim's own lines, the
      proc_group carrying the largest share of billed charges, ties broken by
      proc_group name ascending so the value is a deterministic function of the
      data rather than of aggregate ordering. Materialized in v_claim
      (writer.py) so the compiler reads a column and never invents a rollup.
      Why it exists: procedures bind at claim_line, so claim-grain contracts
      (gross_collection_rate, underpayment_variance, and every other claim-grain
      money metric) had NO legal procedure cut at all — the drill-scope gap the
      base pack's NOTES.md records. This dimension gives them one, by a stated
      rule instead of by fanning a claim out across its lines.
      READ IT AS AN ATTRIBUTION, NOT A DECOMPOSITION. Each claim lands in
      exactly one bucket, so a claim-grain measure cut by this dimension
      reconciles to its ungrouped total to the cent. It is NOT the same number
      as the line-grain `proc_group` cut: the non-dominant lines of a
      multi-procedure claim are attributed to the dominant group along with
      everything else on that claim. Ask "which procedures cost us" of a
      line-grain metric cut by `proc_group`; ask "which claims" of a claim-grain
      metric cut by this one.
      Bound at the claim AND transaction grains, because the claim-grain
      cross-entity ratios (gross_collection_rate, net_collection_rate) put cash
      at the transaction grain against charges at the claim grain, and a
      cross-entity probe needs its group keys bound at both. A transaction's
      attribution is its parent claim's — the same rollup, materialized twice.
      NULL for a claim that carries no lines. In this warehouse that is 201
      claims at snap_003, every one of them zero-billed and carrying no
      transactions, so no money metric moves; verify.py pins both halves of
      that (the value is the dominant group, and NULL happens exactly when the
      claim has no lines).
    entities:
      claim: primary_proc_group
      transaction: primary_proc_group
    synonyms: [primary procedure group, dominant procedure group,
               claim procedure group, primary proc group, dominant proc group,
               claim level procedure group]
    cardinality_estimate: 13
    phi: none
  ar_age_bucket:
    label: AR age bucket
    certified: true
    kind: derived_bucket
    description: >
      Derived at probe time from the snapshot's newest_data_date minus the
      aging-basis date (SERVICE or SUBMISSION). Not a stored column.
    buckets: ["0-30", "31-60", "61-90", "91-120", "120+"]
    entities:
      claim: service_date # default aging basis; SUBMISSION also legal
    synonyms: [aging bucket, ar bucket, age bucket, aging category, days out bucket]
    cardinality_estimate: 5
    phi: none
  filing_runway_bucket:
    label: Filing runway bucket
    certified: true
    kind: derived_bucket
    description: >
      How much timely-filing runway a claim has left at the snapshot's as-of
      date, bucketed. Derived at probe time from the claim -> plan -> filing
      rule join, not stored: the deadline is the claim's SERVICE date plus the
      filing limit its plan configures (dim_plan.timely_filing_days, pre-joined
      into v_claim and declared on the claim entity), and the runway is that
      deadline minus the as-of date. `days_to_filing_deadline` is the same
      arithmetic as a summable measure.
      Buckets. `filed` is a claim that has already been submitted: its initial
      filing clock is closed, and no runway statement about it would mean
      anything. `expired` is an unsubmitted claim whose deadline has already
      passed — those dollars are not at risk, they are lost, and they must not
      be read as the same thing as a claim with a week left. The numeric
      buckets are days of runway remaining, inclusive upper bound.
      WHY THE ANCHOR IS SERVICE DATE, stated because it is a modelling choice.
      All seven governed rules in the base pack's filing_rules.yaml declare
      `date_basis: service`, and the shipped TIMELY_FILING anomaly detector
      computes `service_date + timely_filing_days` (anomalies.py). dim_plan also
      carries a per-plan `timely_filing_basis`, and 10 of the 30 plans set it to
      SUBMISSION — which cannot start a filing clock, because the submission is
      the event the clock bounds. It changes nothing here either way: this
      dimension only distinguishes runway on UNSUBMITTED claims, and an
      unsubmitted claim has no submission date to anchor on.
      CONFIRMATION REQUIREMENT. The limit comes from the plan record, which is
      the pack's `plan_configuration` tier — the system of record, and the most
      specific rule available (the pack's own precedence is "most specific
      first, first match wins"). The pack's filing_rules ladder carries a
      no-confirmation rule for only 7 of the 30 plans (Federal Medicare, the
      Medicaid MCO plans, State Medicaid HMO); the other 23 fall through to a
      payer-pattern default marked `requires_confirmation: true`, so a runway
      computed for those plans is a planning default to confirm against the
      payer contract before acting on it. `timely_filing_at_risk_dollars`
      carries that sentence as a mandatory population caveat on every answer.
    buckets: ["expired", "0-30", "31-60", "61-90", "90+", "filed"]
    entities:
      claim: service_date # the filing-clock anchor; the limit is the plan's
    synonyms: [filing runway, days to filing deadline bucket, timely filing bucket,
               filing deadline bucket, runway bucket, filing window bucket]
    cardinality_estimate: 6
    phi: none
  appeal_status:
    label: Appeal status
    certified: true
    entities:
      denial: appeal_status
    synonyms: [appeal state, appeal outcome, appeal disposition]
    cardinality_estimate: 4
    value_domain: [NONE, APPEALED, OVERTURNED, UPHELD]
    phi: none
  clean_claim:
    label: Clean claim flag
    certified: true
    description: >
      True when the claim was paid with no denial on its first remittance AND
      the payment has posted. Outcome-derived, so it carries the OPEN trap in
      the `status` note below: a claim awaiting cash reads false for want of
      posting, not because the payer touched it. Rate contracts whose
      numerator reads this flag exclude OPEN (clean_claim_rate does).
    entities:
      claim: clean_claim
    synonyms: [clean, first pass clean, no-touch claim]
    cardinality_estimate: 2
    phi: none
  first_pass_paid:
    label: First-pass paid flag
    certified: true
    description: >
      True when the claim's FIRST remittance paid it with no denial — measured
      at the payer's adjudication outcome, before any cash has to post. It is
      therefore NOT the complement of a denial on OPEN claims, and it does not
      move with `clean_claim`: at wm_003, 593 of the 11,319 OPEN claims carry
      first_pass_paid = true (adjudicated clean, payment not yet posted) while
      clean_claim is false on every one of them. The OPEN trap documented on
      `status` still applies in the other direction: an un-adjudicated claim
      reads false for want of a remittance, so first_pass_yield's denominator
      carries claims nobody has decided yet and reads low on fresh cohorts —
      the contract says so. Boolean, never null.
    entities:
      claim: first_pass_paid
    synonyms: [first pass paid, first pass yield flag, paid first pass,
               clean adjudication, paid on first submission]
    cardinality_estimate: 2
    phi: none
  billed_flag:
    label: Billed flag
    certified: true
    description: >
      True when the claim has left the door — submission_date is not null as of
      the snapshot. Structural, not outcome-derived: false means unbilled
      inventory (DNFB, charge holds, timely-filing risk), never "no evidence
      yet", so it does not carry the OPEN trap. This is the certified way to
      express "unsubmitted" as a filter; `submission_date` remains a date basis
      (a window rides on it) and is not itself a dimension.
    entities:
      claim: billed_flag
    synonyms: [billed, submitted, claim submitted, dropped, unbilled flag,
               submission flag]
    cardinality_estimate: 2
    phi: none
  discharged_flag:
    label: Discharged flag
    certified: true
    description: >
      True when the claim carries a discharge date as of the snapshot. Read it
      with claim_type: professional claims have no discharge date by
      construction, so false means "not an institutional discharge OR a stay
      still open", and a DNFB population is discharged_flag = true AND
      billed_flag = false, scoped to INSTITUTIONAL. Structural, not
      outcome-derived. `discharge_date` remains a date basis, not a dimension.
      AS-OF AWARE (fixed 2026-08-09). The stored view column restates the
      CURRENT discharge date, but the snapshot compiler projects the flag at the
      probe's as-of — `discharge_date IS NOT NULL AND discharge_date <= as_of` —
      the same treatment `resolved_date` already got, so a back-dated snapshot
      no longer counts claims discharged after the as-of. The previously
      documented divergence is what closed: on snap_003 at as_of 2026-06-01,
      5 claims worth 3,028,611 cents read discharged with a discharge date past
      that as-of, moving dnfb_dollars from 654,723,734 (flag as stored) to
      651,695,123 (as-of correct, the value the compiler now returns). At the
      watermark itself no claim carries a discharge date beyond the cutoff in
      any snapshot, so every shipped probe returns exactly what it did before.
    entities:
      claim: discharged_flag
    synonyms: [discharged, has discharge, discharge flag, stay closed]
    cardinality_estimate: 2
    phi: none
  status:
    label: Claim status
    certified: true
    description: >
      Adjudication standing of the claim at the snapshot watermark. OPEN
      means NO MONEY HAS POSTED and no denial is visible — not that no
      remittance has arrived. The generator derives status from payment
      posting and denial visibility (project.py), so a claim adjudicated
      clean sits OPEN through the remit-to-post lag: at wm_003, 593 of the
      11,319 OPEN claims carry a remit, line allowed amounts, patient
      responsibility and first_pass_paid = true, and 0 carry a transaction
      (605 at wm_001, 622 at wm_002 — the same population, re-measured).
      That is a real partial-adjudication state, not a defect, and
      `verify.py` guards all four halves of it.
      Consequences for rate contracts, stated exactly: (a) OPEN claims carry
      ZERO denial records in every snapshot, so a numerator reading a denial
      flag must exclude OPEN or it reports "not yet adjudicated" as
      "denied" — counting them moved the published denial rate from 5.2% to
      49.9%; (b) `clean_claim` needs posted cash, so it reads false on every
      OPEN claim, including those 593 — hence clean_claim_rate's OPEN
      exclusion; (c) `first_pass_paid` needs only the remit, so it reads
      TRUE on those 593 and they belong in first_pass_yield's numerator.
      PAID and CLOSED are resolved; DENIED is standing-denied inventory.
      NOT AS-OF AWARE, unlike `resolved_date` and `discharged_flag`. Status is
      derived at snapshot build time from everything visible at the WATERMARK,
      so a back-dated snapshot (as_of earlier than the newest data date) reads
      each claim's status as of the watermark, not as of the probe. Measured on
      snap_003 at as_of 2026-06-01: the as-of open-inventory population holds
      9,907 claims, of which 3,827 read PAID, 472 CLOSED and 214 DENIED because
      that is what they became later. Contracts whose population filters on
      status (timely_filing_at_risk_dollars, denied_ar_dollars) are therefore
      exact at the watermark — the as-of every shipped probe uses — and
      approximate when back-dated. Stated here rather than left to be found.
    entities:
      claim: status
    synonyms: [claim status, adjudication status, claim state, acct status, status code]
    cardinality_estimate: 4
    value_domain: [PAID, OPEN, CLOSED, DENIED]
    phi: none
  cob_mismatch_flag:
    label: COB mismatch flag
    certified: true
    description: >
      True when the claim was billed as primary while other insurance exists
      on the account — coordination-of-benefits billing out of order. This is
      the DIRECT binding for the `cob` concept (see the base pack's
      bindings.yaml); CARC concentration is only a proxy for it.
    entities:
      claim: cob_mismatch_flag
    synonyms: [cob mismatch, coordination of benefits mismatch, out of order billing,
               cob flag, other insurance mismatch, billed primary in error]
    cardinality_estimate: 2
    phi: none
  # --- Deliberately uncertified (exercise discovery-grade downgrade) ---------
  rarc_synthetic:
    label: RARC (synthetic remark code)
    certified: false
    uncertified_reason: >
      Synthetic remark codes with no governed mapping; populated on ~40% of
      denials only. Answers cut by this dimension carry discovery grade.
    entities:
      denial: rarc_synthetic
    synonyms: [remark code, rarc, remittance remark]
    cardinality_estimate: 20
    phi: none
  revenue_code:
    label: Revenue code
    certified: false
    uncertified_reason: >
      Populated from a fixed proc-group mapping rather than billed UB revenue
      codes; not certified for institutional revenue analysis.
    entities:
      claim_line: revenue_code
    synonyms: [rev code, ub revenue code, revenue center]
    cardinality_estimate: 13
    phi: none
