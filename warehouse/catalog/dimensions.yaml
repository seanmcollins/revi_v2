# Semantic catalog: certified dimensions (+ two deliberately uncertified ones
# that exercise the discovery-grade downgrade path, design doc section 2.3).
# Synonyms are seeded with Epic-Clarity / Athena / eCW-style analyst vocabulary.
# phi: none | indirect | direct.
version: 1
dimensions:
  payer:
    label: Payer
    certified: true
    entities:
      claim: payer_name
      claim_line: payer_name
      transaction: payer_name
      remit: payer_name
      denial: payer_name
    synonyms: [payor, insurance, carrier, ins, plan payer, rmt payer, remit payer, insurance company]
    cardinality_estimate: 12
    phi: none
  payer_type:
    label: Payer type
    certified: true
    entities:
      claim: payer_type
      claim_line: payer_type
      transaction: payer_type
      remit: payer_type
      denial: payer_type
    synonyms: [payer category, payor type, payer class, coverage type, insurance type, payer group]
    cardinality_estimate: 7
    value_domain: [COMMERCIAL, MEDICARE, MEDICARE_ADVANTAGE, MEDICAID, MEDICAID_MCO, BCBS, OTHER]
    phi: none
  financial_class:
    label: Financial class
    certified: true
    entities:
      claim: financial_class
      claim_line: financial_class
      transaction: financial_class
      remit: financial_class
      denial: financial_class
    synonyms: [fin class, fc, financial category, fin cls]
    cardinality_estimate: 6
    phi: none
  plan:
    label: Plan
    certified: true
    entities:
      claim: plan_name
      claim_line: plan_name
      transaction: plan_name
      denial: plan_name
    synonyms: [benefit plan, insurance plan, coverage, product, epm plan]
    cardinality_estimate: 30
    phi: none
  product_type:
    label: Product type
    certified: true
    entities:
      claim: product_type
      claim_line: product_type
      transaction: product_type
      denial: product_type
    synonyms: [product, line of business, lob, plan type]
    cardinality_estimate: 6
    value_domain: [PPO, HMO, POS, MA, FFS, MCO]
    phi: none
  provider:
    label: Provider
    certified: true
    entities:
      claim: provider_name
    synonyms: [rendering provider, physician, doctor, doc, billing provider, rendering]
    cardinality_estimate: 150
    phi: indirect # a real provider roster narrows re-identification; synthetic here
  provider_specialty:
    label: Provider specialty
    certified: true
    entities:
      claim: provider_specialty
    synonyms: [specialty, spec, provider type, dept specialty]
    cardinality_estimate: 10
    phi: none
  facility:
    label: Facility
    certified: true
    entities:
      claim: facility_name
      claim_line: facility_name
      transaction: facility_name
      remit: facility_name
      denial: facility_name
    synonyms: [location, site, hospital, campus, service area, loc, place of service]
    cardinality_estimate: 6
    phi: none
  region:
    label: Region
    certified: true
    entities:
      claim: region
      claim_line: region
      transaction: region
      remit: region
      denial: region
    synonyms: [market, geography, area, division]
    cardinality_estimate: 5
    phi: none
  service_line:
    label: Service line
    certified: true
    entities:
      claim: service_line_name
      claim_line: service_line_name
      transaction: service_line_name
      remit: service_line_name
      denial: service_line_name
    synonyms: [svc line, department, dept, clinical service, product line, service area]
    cardinality_estimate: 10
    phi: none
  claim_type:
    label: Claim type
    certified: true
    entities:
      claim: claim_type
      claim_line: claim_type
      transaction: claim_type
      denial: claim_type
    synonyms: [claim form, form type, prof vs facility, ub vs hcfa, 1500 vs ub04, institutional flag]
    cardinality_estimate: 2
    value_domain: [PROFESSIONAL, INSTITUTIONAL]
    phi: none
  payer_sequence:
    label: Payer sequence
    certified: true
    entities:
      claim: payer_sequence
      claim_line: payer_sequence
    synonyms: [cob order, primary secondary tertiary, coverage order, filing order, payer order]
    cardinality_estimate: 3
    value_domain: [P, S, T]
    phi: none
  carc:
    label: CARC (adjustment reason code)
    certified: true
    entities:
      denial: carc_code
    synonyms: [reason code, denial code, adjustment reason, carc code, remark reason, rc]
    cardinality_estimate: 20
    phi: none
  group_code:
    label: Adjustment group code
    certified: true
    entities:
      denial: group_code
    synonyms: [group, adjustment group, co pr oa, denial group]
    cardinality_estimate: 4
    value_domain: [CO, PR, OA, PI]
    phi: none
  denial_category:
    label: Denial category
    certified: true
    entities:
      denial: denial_category
    synonyms: [denial reason category, denial bucket, denial type, root cause category]
    cardinality_estimate: 10
    value_domain:
      [AUTH, ELIGIBILITY, COB, TIMELY_FILING, CODING, CONTRACTUAL, DUPLICATE, MEDICAL_NECESSITY, PATIENT_RESP, OTHER]
    phi: none
  proc_group:
    label: Procedure group
    certified: true
    entities:
      claim_line: proc_group
    synonyms: [procedure category, proc category, cpt group, service group, procedure family]
    cardinality_estimate: 13
    phi: none
  ar_age_bucket:
    label: AR age bucket
    certified: true
    kind: derived_bucket
    description: >
      Derived at probe time from the snapshot's newest_data_date minus the
      aging-basis date (SERVICE or SUBMISSION). Not a stored column.
    buckets: ["0-30", "31-60", "61-90", "91-120", "120+"]
    entities:
      claim: service_date # default aging basis; SUBMISSION also legal
    synonyms: [aging bucket, ar bucket, age bucket, aging category, days out bucket]
    cardinality_estimate: 5
    phi: none
  appeal_status:
    label: Appeal status
    certified: true
    entities:
      denial: appeal_status
    synonyms: [appeal state, appeal outcome, appeal disposition]
    cardinality_estimate: 4
    value_domain: [NONE, APPEALED, OVERTURNED, UPHELD]
    phi: none
  clean_claim:
    label: Clean claim flag
    certified: true
    description: >
      True when the claim was paid with no denial on its first remittance AND
      the payment has posted. Outcome-derived, so it carries the OPEN trap in
      the `status` note below: a claim awaiting cash reads false for want of
      posting, not because the payer touched it. Rate contracts whose
      numerator reads this flag exclude OPEN (clean_claim_rate does).
    entities:
      claim: clean_claim
    synonyms: [clean, first pass clean, no-touch claim]
    cardinality_estimate: 2
    phi: none
  first_pass_paid:
    label: First-pass paid flag
    certified: true
    description: >
      True when the claim's FIRST remittance paid it with no denial — measured
      at the payer's adjudication outcome, before any cash has to post. It is
      therefore NOT the complement of a denial on OPEN claims, and it does not
      move with `clean_claim`: at wm_003, 593 of the 11,319 OPEN claims carry
      first_pass_paid = true (adjudicated clean, payment not yet posted) while
      clean_claim is false on every one of them. The OPEN trap documented on
      `status` still applies in the other direction: an un-adjudicated claim
      reads false for want of a remittance, so first_pass_yield's denominator
      carries claims nobody has decided yet and reads low on fresh cohorts —
      the contract says so. Boolean, never null.
    entities:
      claim: first_pass_paid
    synonyms: [first pass paid, first pass yield flag, paid first pass,
               clean adjudication, paid on first submission]
    cardinality_estimate: 2
    phi: none
  billed_flag:
    label: Billed flag
    certified: true
    description: >
      True when the claim has left the door — submission_date is not null as of
      the snapshot. Structural, not outcome-derived: false means unbilled
      inventory (DNFB, charge holds, timely-filing risk), never "no evidence
      yet", so it does not carry the OPEN trap. This is the certified way to
      express "unsubmitted" as a filter; `submission_date` remains a date basis
      (a window rides on it) and is not itself a dimension.
    entities:
      claim: billed_flag
    synonyms: [billed, submitted, claim submitted, dropped, unbilled flag,
               submission flag]
    cardinality_estimate: 2
    phi: none
  discharged_flag:
    label: Discharged flag
    certified: true
    description: >
      True when the claim carries a discharge date as of the snapshot. Read it
      with claim_type: professional claims have no discharge date by
      construction, so false means "not an institutional discharge OR a stay
      still open", and a DNFB population is discharged_flag = true AND
      billed_flag = false, scoped to INSTITUTIONAL. Structural, not
      outcome-derived. `discharge_date` remains a date basis, not a dimension.
      KNOWN LIMITATION — the flag is NOT as-of aware. It is materialized from
      the CURRENT discharge_date at snapshot build time, so a back-dated
      snapshot query (as_of earlier than the watermark) reads it as true for
      claims discharged AFTER that as_of, where `discharge_date <= as_of`
      would read false. Measured on snap_003 at as_of 2026-06-01: 5 claims
      worth 3,028,611 cents fall inside the as-of open-inventory population
      with discharged_flag true and a discharge date past 2026-06-01, which
      moves dnfb_dollars there from 651,695,123 to 654,723,734. At the
      watermark itself (as_of = newest data date) the two readings are
      identical, which is the case every shipped probe takes. A back-dated
      DNFB reading is therefore slightly high; state it rather than trust it.
    entities:
      claim: discharged_flag
    synonyms: [discharged, has discharge, discharge flag, stay closed]
    cardinality_estimate: 2
    phi: none
  status:
    label: Claim status
    certified: true
    description: >
      Adjudication standing of the claim at the snapshot watermark. OPEN
      means NO MONEY HAS POSTED and no denial is visible — not that no
      remittance has arrived. The generator derives status from payment
      posting and denial visibility (project.py), so a claim adjudicated
      clean sits OPEN through the remit-to-post lag: at wm_003, 593 of the
      11,319 OPEN claims carry a remit, line allowed amounts, patient
      responsibility and first_pass_paid = true, and 0 carry a transaction
      (605 at wm_001, 622 at wm_002 — the same population, re-measured).
      That is a real partial-adjudication state, not a defect, and
      `verify.py` guards all four halves of it.
      Consequences for rate contracts, stated exactly: (a) OPEN claims carry
      ZERO denial records in every snapshot, so a numerator reading a denial
      flag must exclude OPEN or it reports "not yet adjudicated" as
      "denied" — counting them moved the published denial rate from 5.2% to
      49.9%; (b) `clean_claim` needs posted cash, so it reads false on every
      OPEN claim, including those 593 — hence clean_claim_rate's OPEN
      exclusion; (c) `first_pass_paid` needs only the remit, so it reads
      TRUE on those 593 and they belong in first_pass_yield's numerator.
      PAID and CLOSED are resolved; DENIED is standing-denied inventory.
    entities:
      claim: status
    synonyms: [claim status, adjudication status, claim state, acct status, status code]
    cardinality_estimate: 4
    value_domain: [PAID, OPEN, CLOSED, DENIED]
    phi: none
  cob_mismatch_flag:
    label: COB mismatch flag
    certified: true
    description: >
      True when the claim was billed as primary while other insurance exists
      on the account — coordination-of-benefits billing out of order. This is
      the DIRECT binding for the `cob` concept (see the base pack's
      bindings.yaml); CARC concentration is only a proxy for it.
    entities:
      claim: cob_mismatch_flag
    synonyms: [cob mismatch, coordination of benefits mismatch, out of order billing,
               cob flag, other insurance mismatch, billed primary in error]
    cardinality_estimate: 2
    phi: none
  # --- Deliberately uncertified (exercise discovery-grade downgrade) ---------
  rarc_synthetic:
    label: RARC (synthetic remark code)
    certified: false
    uncertified_reason: >
      Synthetic remark codes with no governed mapping; populated on ~40% of
      denials only. Answers cut by this dimension carry discovery grade.
    entities:
      denial: rarc_synthetic
    synonyms: [remark code, rarc, remittance remark]
    cardinality_estimate: 20
    phi: none
  revenue_code:
    label: Revenue code
    certified: false
    uncertified_reason: >
      Populated from a fixed proc-group mapping rather than billed UB revenue
      codes; not certified for institutional revenue analysis.
    entities:
      claim_line: revenue_code
    synonyms: [rev code, ub revenue code, revenue center]
    cardinality_estimate: 13
    phi: none
