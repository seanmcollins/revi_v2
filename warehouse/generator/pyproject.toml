[project]
name = "revi-warehouse"
version = "0.1.0"
description = "Deterministic mock-warehouse generator: multi-entity RCM star schema, planted scenarios, answer key."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revi_warehouse"]
