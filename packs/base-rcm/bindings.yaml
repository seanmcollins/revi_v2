# Candidate bindings (design section 5.5): concept -> catalog dimension or
# measure, with declared evidence strength. The grade law propagates these
# strengths — proxy bindings can never launder into certified conclusions.
bindings:
  - concept_id: cob
    dimension_or_measure_id: cob_mismatch_flag
    state: certified
    strength: direct
    rationale: >-
      The warehouse stamps an explicit coordination-of-benefits mismatch flag
      on claims billed primary while other insurance exists — the field
      directly represents the concept.
  - concept_id: cob
    dimension_or_measure_id: payer_sequence
    state: validated
    strength: derived
    rationale: >-
      Billing order (P/S/T) combined with the other-insurance flag
      deterministically identifies out-of-sequence billing.
  - concept_id: cob
    dimension_or_measure_id: carc
    state: certified
    strength: proxy
    rationale: >-
      Concentration of COB-typed reason codes (22, 23, 109) suggests a COB
      problem but does not prove one — codes are payer assertions, not
      coverage facts.
  - concept_id: denial
    dimension_or_measure_id: carc
    state: certified
    strength: direct
    rationale: >-
      A denial record keyed by group code + CARC on the remit is the direct
      representation of an adjudicated denial.
  - concept_id: denial
    dimension_or_measure_id: denied_amount_cents
    state: certified
    strength: direct
    rationale: Denied dollars are carried on the denial record itself.
  - concept_id: denial_category
    dimension_or_measure_id: denial_category
    state: certified
    strength: direct
    rationale: Certified root-cause rollup dimension over group code + CARC pairs.
  - concept_id: appeal_overturn
    dimension_or_measure_id: appeal_status
    state: certified
    strength: direct
    rationale: Appeal disposition is stored per denial as visible at the watermark.
  - concept_id: patient_responsibility
    dimension_or_measure_id: patient_responsibility_cents
    state: certified
    strength: direct
    rationale: PR-group amounts are accumulated onto the claim at adjudication.
  - concept_id: clean_claim
    dimension_or_measure_id: clean_claim
    state: certified
    strength: derived
    rationale: >-
      The warehouse flag is outcome-derived (resolved with zero denials), a
      deterministic calculation rather than a scrubber event — derived, not
      direct, evidence of the industry clean-claim concept.
  - concept_id: underpayment
    dimension_or_measure_id: expected_amount_cents
    state: certified
    strength: derived
    rationale: >-
      Variance is deterministically computed from contract-expected versus
      allowed amounts; each claim floored at zero (never netted).
  - concept_id: underpayment
    dimension_or_measure_id: allowed_amount_cents
    state: certified
    strength: derived
    rationale: Line allowed amounts are the actual side of the variance computation.
  - concept_id: dnfb
    dimension_or_measure_id: billed_amount_cents
    state: validated
    strength: derived
    rationale: >-
      DNFB inventory is deterministically identified (discharge date present,
      submission date null) and valued at billed charges.
  - concept_id: timely_filing
    dimension_or_measure_id: carc
    state: certified
    strength: proxy
    rationale: >-
      CARC 29 denials evidence limits already breached; they do not measure
      the at-risk inventory, which comes from filing rules applied to
      unsubmitted claims.
  - concept_id: ar_aging
    dimension_or_measure_id: ar_age_bucket
    state: certified
    strength: derived
    rationale: >-
      Age buckets derive at probe time from the snapshot's newest data date
      minus the aging-basis date; not a stored column.
  - concept_id: payer_mix
    dimension_or_measure_id: payer
    state: certified
    strength: direct
    rationale: Mix views are share-of-total transforms over metrics cut by payer.
  - concept_id: pos_collections
    dimension_or_measure_id: patient_payment_cents
    state: observed
    strength: unavailable
    rationale: >-
      Patient cash exists, but this warehouse's patient payments post only
      after adjudication — point-of-service timing cannot be distinguished,
      so no adequate measurement of POS collections exists here (see NOTES).
  - concept_id: rarc
    dimension_or_measure_id: rarc_synthetic
    state: observed
    strength: discovery
    rationale: >-
      Synthetic remark codes are uncertified placeholders populated on a
      minority of denials; any cut by them downgrades to discovery grade.

  # --- coverage wave 2 (2026-08-08): named cohorts ------------------------
  # Each cohort concept binds to the CERTIFIED dimension whose declared
  # value domain expresses it. The binding is what makes "government
  # payers" a checkable predicate rather than a phrase Revi has to guess
  # its way through; the concept's definition names the exact values.
  - concept_id: government_payers
    dimension_or_measure_id: payer_type
    state: certified
    strength: direct
    rationale: >-
      payer_type is a certified dimension with a declared value domain, and
      the four public-program values (MEDICARE, MEDICARE_ADVANTAGE,
      MEDICAID, MEDICAID_MCO) are the concept exactly — no inference from
      payer names is involved.
  - concept_id: commercial_payers
    dimension_or_measure_id: payer_type
    state: certified
    strength: direct
    rationale: >-
      COMMERCIAL plus BCBS on the certified payer_type domain. Direct rather
      than derived because the values ARE the concept; the only judgment is
      whether Blue plans are included, which the concept states.
  - concept_id: managed_care
    dimension_or_measure_id: product_type
    state: certified
    strength: derived
    rationale: >-
      Product type (HMO, POS, MA, MCO) identifies network-managed products
      deterministically, but "managed care" is a behavior family rather than
      a stored attribute — the mapping is a governed rule over certified
      values, not a stamped flag.
  - concept_id: managed_care
    dimension_or_measure_id: payer_type
    state: certified
    strength: derived
    rationale: >-
      The program-side reading: MEDICARE_ADVANTAGE and MEDICAID_MCO are the
      privately administered public programs. Deliberately a second binding
      rather than a merge — it selects a different population from the
      product-type reading and an answer must say which it used.
  - concept_id: medicare_advantage
    dimension_or_measure_id: payer_type
    state: certified
    strength: direct
    rationale: MEDICARE_ADVANTAGE is a declared value of the certified payer_type domain.
  - concept_id: medicare_advantage
    dimension_or_measure_id: product_type
    state: certified
    strength: derived
    rationale: >-
      product_type MA coincides with payer_type MEDICARE_ADVANTAGE in this
      warehouse; derived rather than direct because that coincidence is a
      property of the generated data, not a guaranteed identity.
  - concept_id: traditional_medicare
    dimension_or_measure_id: payer_type
    state: certified
    strength: direct
    rationale: >-
      MEDICARE on the certified payer_type domain — fee-for-service
      Medicare, held apart from MEDICARE_ADVANTAGE by the domain itself.
  - concept_id: medicaid_coverage
    dimension_or_measure_id: payer_type
    state: certified
    strength: direct
    rationale: >-
      MEDICAID plus MEDICAID_MCO on the certified payer_type domain: the
      state program and the managed-care organizations that run it.
  - concept_id: surgical_services
    dimension_or_measure_id: service_line
    state: validated
    strength: derived
    rationale: >-
      The operative service lines are named values of the certified
      service_line dimension. Validated rather than certified because the
      membership list is a clinical judgment about which lines count as
      surgical, and a tenant overlay may hold a different one.
  - concept_id: high_dollar_claims
    dimension_or_measure_id: billed_amount_cents
    state: observed
    strength: unavailable
    rationale: >-
      Claim value exists only as a MEASURE, never as a certified dimension,
      so there is no legal predicate for a dollar-threshold cohort and none
      will be invented. Ranking and share-of-total over a money metric are
      the available substitute and answer a related but different question.
  - concept_id: utilization_review
    dimension_or_measure_id: denial_category
    state: certified
    strength: proxy
    rationale: >-
      MEDICAL_NECESSITY and AUTH category denials are the visible OUTPUT of
      utilization review, not a measurement of it — the review itself, its
      timing and its level-of-care determinations leave no record here.
  - concept_id: bad_debt
    dimension_or_measure_id: other_adj_cents
    state: observed
    strength: unavailable
    rationale: >-
      Non-contractual write-offs exist as a single undifferentiated family;
      no bad-debt, charity or small-balance reason code is stored, so the
      bad-debt share of them is not measurable and must not be estimated
      from the total.
  - concept_id: charity_care
    dimension_or_measure_id: other_adj_cents
    state: observed
    strength: unavailable
    rationale: >-
      Same undifferentiated write-off family as bad debt, and the same
      answer: financial-assistance classification is absent, so charity care
      cannot be separated out.
  - concept_id: patient_statements
    dimension_or_measure_id: patient_payment_cents
    state: observed
    strength: unavailable
    rationale: >-
      Patient cash records the outcome of the statement cycle; no statement,
      reminder or placement event exists, so cycle effectiveness is not
      measurable and only the two endpoints are.
  - concept_id: prompt_pay
    dimension_or_measure_id: ar_age_bucket
    state: observed
    strength: proxy
    rationale: >-
      Receivable aging is a symptom of slow payment, not a measurement of
      statutory prompt-pay compliance: the clock starts at the payer's
      receipt of a clean claim, which this warehouse does not record, and
      the deadlines themselves are state law rather than pack content.
