id: payer_scorecard
description: >-
  Payer scorecard — the payer-specific alternative to the generic
  scorecard: pick this one when the question names payers, that one for any
  other breakdown. Fixing the breakdown to payer is what buys the
  payer-only evidence the generic shape has no room for — denial code
  profile, appeal outcomes, write-off pressure — and it rates payers on the
  four things a contracting conversation actually rests on: what they pay
  (realization and contracted richness), how fast they pay (receivable
  pressure), how much they deny and how those denials end, and what it
  costs to work them. Comparison caution carried throughout: payers differ
  in service mix, so cross-payer levels are only meaningful on a shared mix
  — the service-line cut is required evidence, not decoration.
triggers:
  - payer scorecard
  - which payer is worst
  - what is my top performing payer
  - which payer performs best
  - who is my best payer
  - which payer is worst to work with
  - compare our payers
  - rank payers
  - how do payers compare
  - payer performance review
  - which payer should we renegotiate
params:
  - payer
  - service_line
probes:
  - id: payer_flow
    metric_ids: [charges, expected_reimbursement, net_to_gross_rate, claim_volume]
    dimensions: [payer]
    window: {quantity: 3, unit: month, mode: full_periods}
    top_n: 12
    scope_note: >-
      Volume, gross charges, contract-expected reimbursement and the
      net-to-gross ratio per payer, on the service date. Net-to-gross is
      contract richness, NOT a collection result — it moves with
      chargemaster changes too, so it is read as context for the receivable columns.
  - id: payer_cash
    metric_ids: [cash_posted, avg_days_to_pay, denial_write_off_dollars, write_off_rate]
    dimensions: [payer]
    window: {quantity: 3, unit: month, mode: full_periods}
    top_n: 12
    scope_note: >-
      Posted payer cash, how long each payer takes to pay, non-contractual
      write-offs and write-offs per dollar collected, on the posting date.
      These sit at transaction level, so they are read separately from the
      claim-level row above and the two are never divided into each other
      cell by cell.
  - id: payer_receivable
    metric_ids: [ar_balance, ar_over_90_pct, ar_over_120_pct, denied_ar_dollars]
    dimensions: [payer]
    top_n: 12
    scope_note: >-
      Snapshot receivable pressure per payer: total open A/R, both aging
      shares (the bands are not interchangeable) and the standing-denied
      slice that a combined A/R view hides.
  - id: payer_denial_profile
    metric_ids: [initial_denial_rate, clean_claim_rate, claim_resolution_rate]
    dimensions: [payer]
    window: {quantity: 3, unit: month, mode: full_periods}
    top_n: 12
    scope_note: >-
      First-pass behavior per payer on the submission date. The three
      populations are NOT the same and the row has to be read that way:
      only the clean claim rate is adjudicated-only (it leaves out claims
      still open). The initial denial rate and the claim resolution rate
      both divide by every claim in the window, so both read low on recent
      populations purely because adjudication has not caught up — nothing
      about the payer. Over May 1 – Aug 2, 2026 the denominators are 15,068
      (clean claim rate), 18,410 (initial denial rate) and 19,672 (claim
      resolution rate, on the service date) against 18,410 claims
      submitted. Two consequences: clean rate and initial denial rate do
      not sum to one (they sum to 98.38% here, the gap being the
      un-adjudicated tail), and any column sensitive to how young the
      population is compares payer against payer only at equal age, never
      as a standalone level.
  - id: payer_denial_dollars
    metric_ids: [denied_dollars, denials_unworked_pct, appeal_overturn_rate]
    dimensions: [payer]
    window: {quantity: 3, unit: month, mode: full_periods}
    top_n: 12
    scope_note: >-
      Denial level: denied dollars, the never-worked share and the decided
      overturn rate per payer. A payer with a high overturn rate AND a high
      unworked share is the clearest renegotiation-or-staffing case in the
      scorecard.
  - id: payer_mix_control
    metric_ids: [charges, claim_volume]
    dimensions: [payer, service_line]
    window: {quantity: 3, unit: month, mode: full_periods}
    top_n: 20
    scope_note: >-
      The mix control. Payer levels above are only comparable where the
      service mix is comparable; this cut is what lets a conclusion say
      "worse on like business" instead of "worse".
transforms:
  - operator: panel
    args: {rows: payer, columns: metric}
verdict:
  # RATE AND SPEED ONLY. A verdict taken over dollar columns crowns the
  # biggest payer: the payer who sends the most business posts the most
  # cash AND denies the most dollars, and neither fact is about how good
  # they are to work with. The dollar columns stay in the panel — they are
  # what a contracting conversation needs beside the rates — they just do
  # not vote.
  measures:
    - avg_days_to_pay
    - write_off_rate
    - initial_denial_rate
    - clean_claim_rate
    - denials_unworked_pct
    - appeal_overturn_rate
    - ar_over_90_pct
  # Four of the seven. A payer ahead on four of these is ahead on how fast
  # they pay, how much they deny, or how their denials end — a majority a
  # contracting team can act on. Three of seven is a payer who happens to
  # lead a plurality, and calling that "best" would be this scorecard
  # inventing a winner.
  leader_min_measures: 4
conclusion_policies: [payer_scorecard_claim]
ranking_policy: impact_first
