id: timely_filing_watch
description: >-
  Pre-denial timely-filing early warning: values the unsubmitted open
  inventory, splits it by how much filing runway each claim has left
  against the limit its own plan configures, and confirms whether limits
  are already being breached (CARC 29 denials). The runway split is the
  point — on this load it says 47% of the inventory is already EXPIRED and
  4.6% is inside 30 days, where the ungrouped total said only "this is
  large". Deadlines come from each claim's own plan and the filing rule that
  plan matches; only 7 of 30 plans match a rule needing no confirmation, so
  for the rest the limit is a planning default to confirm against the payer
  contract, and answers say which.
triggers:
  - timely filing risk
  - claims about to miss filing
  - is anything about to miss a filing deadline
  - what is aging out of timely filing
  - filing deadline exposure
  - tfl watch
params:
  - plan
  - facility
probes:
  # FIRST on purpose. The findings layer publishes the first ranked frame
  # that carries a dimension and a measure, so probe order decides what
  # "is anything about to miss a filing deadline?" is ANSWERED with. Led by
  # at_risk_by_plan, the answer was a plan/facility league table of the
  # whole unbilled population, ending in its own instruction to the reader
  # to go and cut it by filing_runway_bucket themselves — a correct number
  # that answers a different question, reachable only by typing an internal
  # identifier. The runway cut is the answer to a deadline question; the
  # population is context for it. That is what this file's own scope notes
  # said before anything read them in this order.
  - id: filing_runway_profile
    metric_ids: [timely_filing_at_risk_dollars]
    dimensions: [filing_runway_bucket, plan]
    top_n: 10
    scope_note: >-
      Unsubmitted OPEN dollars cut by how much filing runway each claim has
      left: `expired` (the deadline has passed and the dollars are gone),
      `0-30`, `31-60`, `61-90`, `90+`. The limit comes from the claim's own
      plan, matched against the filing rules in your definitions library.
      This is the cut a deadline question is asking for — how urgent, not
      where it sits — so
      it leads. Two things any answer over it must carry: `expired` is not
      workable inventory, it is loss already taken; and a plan whose matched
      rule requires confirmation is on a PLANNING DEFAULT, not a known
      deadline — 23 of the 30 plans here are, so most rows want that label.
  - id: at_risk_by_plan
    metric_ids: [timely_filing_at_risk_dollars]
    dimensions: [plan, facility]
    top_n: 10
    scope_note: >-
      The same unsubmitted OPEN dollars by plan and facility — WHERE the
      inventory sits, not how urgent it is. Read it with the runway profile
      above, which is these dollars aged against each plan's own limit: the
      totals here are a population, and a conclusion of filing risk drawn
      from them alone is the upper-bound claim the runway cut exists to
      replace. In your data they cluster on July services under a 90-day
      Medicaid HMO plan at one facility, where the limit runs from the
      service date.
  - id: unbilled_aging_profile
    metric_ids: [ar_balance]
    dimensions: [ar_age_bucket]
    scope_note: >-
      Aging profile of the unbilled population — claims with no submission
      date. A/R age is not filing runway: these buckets age on the A/R
      clock, not from each plan's own filing start date and limit. So this
      indicates where to look, and cannot yet say how much runway remains.
  - id: breach_confirmation
    metric_ids: [denied_dollars]
    dimensions: [group_code, carc, plan]
    window: {quantity: 3, unit: month, mode: full_periods}
    basis_override: remit
    scope_note: >-
      CO-29 denied dollars confirm limits already breached — the lagging
      indicator the at-risk view exists to prevent. Cut by the group code +
      CARC pair, never the CARC alone: 14 of the 20 CARCs in your data
      appear under more than one group, and a merged row is a different
      number from either of the rows it merged.
transforms:
  - operator: rank
    args: {by: timely_filing_at_risk_dollars, descending: true}
conclusion_policies: [timely_filing_risk_claim]
ranking_policy: urgency_first
