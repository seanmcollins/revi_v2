id: timely_filing_watch
description: >-
  Unbilled-inventory watch, on the road to a pre-denial timely-filing early
  warning. Today it values the unsubmitted open inventory, profiles its
  aging, and confirms whether limits are already being breached (CARC 29
  denials). What it does NOT yet do is apply the governed filing rules:
  timely_filing_at_risk_dollars carries no deadline predicate, so the
  at-risk probe below is an upper bound on exposure and every answer says
  so. The deadline join is the named next milestone (see ../NOTES.md); the
  differentiator arrives with it, and this description will say so when it
  is true.
triggers:
  - timely filing risk
  - claims about to miss filing
  - filing deadline exposure
  - tfl watch
params:
  - plan
  - facility
probes:
  - id: at_risk_by_plan
    metric_ids: [timely_filing_at_risk_dollars]
    dimensions: [plan, facility]
    top_n: 10
    scope_note: >-
      Snapshot of unsubmitted OPEN dollars by plan and facility. NOT aged
      against each plan's filing rule: the limit days, basis, authority and
      confirmation state in filing_rules.yaml are governed content the
      contract does not yet join at probe time, so a claim with a year of
      runway is counted identically to one a week from its limit. Read this
      as the population a filing watch would age. The planted scenario
      clusters July services on a 90-day service-basis Medicaid HMO plan at
      one facility, and identifying that cluster still requires the join.
  - id: unbilled_aging_profile
    metric_ids: [ar_balance]
    dimensions: [ar_age_bucket]
    scope_note: >-
      Aging profile of the unbilled population (scope: submission date null).
      A/R age is not filing runway — the buckets age from the A/R clock, not
      from each plan's filing basis and limit — so this indicates where to
      look, and cannot yet say how much runway remains.
  - id: breach_confirmation
    metric_ids: [denied_dollars]
    dimensions: [group_code, carc, plan]
    window: {quantity: 3, unit: month, mode: full_periods}
    basis_override: remit
    scope_note: >-
      CO-29 denied dollars confirm limits already breached — the lagging
      indicator the at-risk view exists to prevent. Cut by the group code +
      CARC pair, never the CARC alone: 14 of the 20 CARCs in this warehouse
      appear under more than one group, and a merged row is a different
      number from either of the rows it merged.
transforms:
  - operator: rank
    args: {by: timely_filing_at_risk_dollars, descending: true}
conclusion_policies: [timely_filing_risk_claim]
ranking_policy: impact_first
