id: timely_filing_watch
description: >-
  Pre-denial timely-filing early warning: values the unsubmitted open
  inventory, splits it by how much filing runway each claim has left
  against the limit its own plan configures, and confirms whether limits
  are already being breached (CARC 29 denials). The runway split is the
  point — at wm_003 it says 47% of the inventory is already EXPIRED and
  4.6% is inside 30 days, where the ungrouped total said only "this is
  large". Deadlines come from the claim -> plan -> filing-rule join
  (delivered 2026-08-09, see ../NOTES.md); only 7 of 30 plans match a rule
  needing no confirmation, so for the rest the limit is a planning default
  to confirm against the payer contract, and answers say which.
triggers:
  - timely filing risk
  - claims about to miss filing
  - filing deadline exposure
  - tfl watch
params:
  - plan
  - facility
probes:
  - id: at_risk_by_plan
    metric_ids: [timely_filing_at_risk_dollars]
    dimensions: [plan, facility]
    top_n: 10
    scope_note: >-
      Snapshot of unsubmitted OPEN dollars by plan and facility — WHERE the
      inventory sits, not how urgent it is. Read with filing_runway_profile
      below, which is the same dollars aged against each plan's own limit:
      this probe's totals are a population, and a conclusion of filing risk
      drawn from them alone is the upper-bound claim the runway cut exists
      to replace. The planted scenario clusters July services on a 90-day
      service-basis Medicaid HMO plan at one facility.
  - id: filing_runway_profile
    metric_ids: [timely_filing_at_risk_dollars]
    dimensions: [filing_runway_bucket, plan]
    top_n: 10
    scope_note: >-
      The same unsubmitted OPEN dollars, cut by how much filing runway each
      claim has left: `expired` (the deadline has passed and the dollars are
      gone), `0-30`, `31-60`, `61-90`, `90+`. The limit comes from the
      claim's own plan record via the pack's filing-rule ladder. Two things
      any answer over this must carry: `expired` is not workable inventory,
      it is loss already taken; and a plan whose matched rule requires
      confirmation is on a PLANNING DEFAULT, not a known deadline — 23 of
      the 30 plans here are, so most rows want that label.
  - id: unbilled_aging_profile
    metric_ids: [ar_balance]
    dimensions: [ar_age_bucket]
    scope_note: >-
      Aging profile of the unbilled population (scope: submission date null).
      A/R age is not filing runway — the buckets age from the A/R clock, not
      from each plan's filing basis and limit — so this indicates where to
      look, and cannot yet say how much runway remains.
  - id: breach_confirmation
    metric_ids: [denied_dollars]
    dimensions: [group_code, carc, plan]
    window: {quantity: 3, unit: month, mode: full_periods}
    basis_override: remit
    scope_note: >-
      CO-29 denied dollars confirm limits already breached — the lagging
      indicator the at-risk view exists to prevent. Cut by the group code +
      CARC pair, never the CARC alone: 14 of the 20 CARCs in this warehouse
      appear under more than one group, and a merged row is a different
      number from either of the rows it merged.
transforms:
  - operator: rank
    args: {by: timely_filing_at_risk_dollars, descending: true}
conclusion_policies: [timely_filing_risk_claim]
ranking_policy: impact_first
