id: cob_investigation
description: >-
  Answer "do I have a COB problem?" with graded evidence. One path measures
  it directly: your data carries a standard COB mismatch flag marking claims
  billed primary while other insurance exists, and claim volume over that
  flag is a measured value. The other path estimates it from COB-typed code
  concentration (OA/CARC 22, 23, 109) on denied dollars, which suggests a
  COB problem without proving one. The two are kept apart on purpose: the
  estimate alone can support only qualified language, and confirming a COB
  problem takes the direct measurement.
triggers:
  - do i have a cob problem
  - cob issue
  - coordination of benefits problem
  - other insurance denials
params:
  - payer
probes:
  - id: cob_mismatch_by_payer
    metric_ids: [cob_mismatch_claims, cob_mismatch_rate, claim_volume]
    dimensions: [payer]
    window: {quantity: 4, unit: month, mode: full_periods}
    scope_note: >-
      MEASURED DIRECTLY: your data's standard COB mismatch flag, carried
      inside the COB mismatch count and rate so the population comes from a
      shared definition rather than a filter typed for one question. The
      count, the rate and the claim-volume denominator travel together —
      this measures out-of-order billing itself, not a payer's opinion
      about it.
  - id: cob_code_proxy
    metric_ids: [denied_dollars]
    dimensions: [carc, group_code]
    window: {quantity: 4, unit: month, mode: full_periods}
    top_n: 10
    basis_override: remit
    scope_note: >-
      ESTIMATED: concentration of COB-typed pairs (OA-22, OA-23, OA-109)
      in denied dollars. Codes are payer assertions — suggestive, not
      probative; a conclusion drawn from this alone stays qualified.
  - id: cob_rebill_timing
    metric_ids: [avg_days_to_pay]
    dimensions: [payer]
    window: {quantity: 4, unit: month, mode: full_periods}
    scope_note: >-
      Corroboration: COB denials that later pay via rebill stretch effective
      days-to-pay for the affected payer — in your data those rebills land
      30-45 days after the first remit.
transforms:
  # The DIRECT branch is transformed FIRST so it, not the proxy branch,
  # supplies the primary findings. Share-of-total turns raw mismatch counts
  # into the concentration an analyst can act on; rank puts the worst payer
  # first. The proxy branch is transformed too, but only ever corroborates.
  - operator: share_of_total
    args: {measure: cob_mismatch_claims}
  - operator: rank
    args: {by: cob_mismatch_claims, descending: true}
  - operator: share_of_total
    args: {measure: denied_dollars}
  - operator: rank
    args: {by: denied_dollars, descending: true}
conclusion_policies: [cob_confirmed_claim, cob_suspected_claim]
ranking_policy: impact_first
