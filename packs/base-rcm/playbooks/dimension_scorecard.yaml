id: dimension_scorecard
description: >-
  Generic multi-metric assessment across ANY standard breakdown — one shape
  powers "assess each facility financially", payer scorecards, and
  service-line reviews alike. The breakdown is chosen when the question is
  asked and has to be one your data standardizes; there is no separate
  review per breakdown. Small cells are suppressed, and every measure
  carries its own evidence strength and reporting date in its column.
triggers:
  - assess the performance of each facility
  - payer scorecard
  - score each payer
  - how is each service line doing
  - scorecard
params:
  - dimension
probes:
  - id: scorecard_flow
    metric_ids: [charges, cash_posted, denial_rate, first_pass_yield, avg_days_to_pay]
    dimensions: ["$dimension"]
    window: {quantity: 3, unit: month, mode: full_periods}
    scope_note: >-
      Flow measures over the last three full months, one row per value;
      each keeps its own reporting date and the header says which.
  - id: scorecard_ar
    metric_ids: [ar_balance, ar_over_90_pct, days_in_ar]
    dimensions: ["$dimension"]
    scope_note: Point-in-time A/R health per value, aged to the newest data date.
  - id: scorecard_leakage
    metric_ids: [underpayment_variance, denial_write_off_dollars]
    dimensions: ["$dimension"]
    window: {quantity: 3, unit: month, mode: full_periods}
    scope_note: Leakage pair — never-netted variance and non-contractual write-offs.
transforms:
  - operator: pivot
    args: {rows: dimension_value, columns: metric}
  - operator: rank
    args: {by: impact_cents, descending: true}
conclusion_policies: [scorecard_claim]
ranking_policy: impact_first
