id: underpayment_review
description: >-
  Locate and size contract underpayment: trend the never-netted variance,
  rank payers by variance dollars, and corroborate with realization
  (net_collection_rate) by payer. Line-level allowed-versus-expected detail
  is claim-grain in this warehouse, so procedure-group attribution proceeds
  by drilling the affected payer cohort (the planted scenario pays 92
  percent of expected on one payer-times-ORTHO-SURG cell from May 2026).
triggers:
  - are we being underpaid
  - underpayment review
  - payment variance
  - payer paying below contract
params:
  - payer
probes:
  - id: underpayment_by_payer
    metric_ids: [underpayment_variance]
    dimensions: [payer]
    window: {quantity: 6, unit: month, mode: full_periods}
    top_n: 12
    scope_note: Variance dollars by payer; never nets overpayments.
  - id: underpayment_trend
    metric_ids: [underpayment_variance]
    window: {quantity: 6, unit: month, mode: full_periods}
    scope_note: Monthly trend — a step change dates the contract behavior shift.
  - id: realization_check
    metric_ids: [net_collection_rate]
    dimensions: [payer]
    window: {quantity: 6, unit: month, mode: full_periods}
    scope_note: >-
      Payer cash against contract-expected for the same cohorts; persistent
      sub-expected realization corroborates the variance signal.
  - id: variance_service_mix
    metric_ids: [underpayment_variance]
    dimensions: [payer, service_line]
    window: {quantity: 6, unit: month, mode: full_periods}
    top_n: 10
    scope_note: >-
      Concentration by payer and service line; drill the winning cell's
      cohort for line evidence.
transforms:
  - operator: compare
    args: {kind: prior_period}
  - operator: rank
    args: {by: underpayment_variance, descending: true}
conclusion_policies: [underpayment_claim]
ranking_policy: impact_first
