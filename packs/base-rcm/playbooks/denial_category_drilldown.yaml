id: denial_category_drilldown
description: >-
  Take one root-cause family of denials apart and route it to an owner.
  Where denial_spike asks "what changed", this asks "what IS this category,
  where does it live, and whose problem is it" — the standing structural
  view rather than the trend break. Rolls up by category, opens the category
  into its group-code + CARC pairs (the category is a rollup OF those pairs,
  so the owning stage follows from the pairs, never from the label), locates
  concentration, and reads the work state: how much never gets touched, how
  much wins on appeal, how much lands as a write-off.
triggers:
  - denial categories
  - what are we being denied for
  - denial reasons breakdown
  - authorization denials
  - eligibility denials
  - medical necessity denials
  - coding denials
  - denial root cause
  - break down denials by reason
  # Ranking phrasings route here too, on purpose. A free-form cut by carc
  # alone merges CO-50 (a contractual write-off) with PI-50 (a disputable
  # payer reduction) into one row and sends both to the same worklist; the
  # probe below keys the group code + CARC pair, which is the unit denial
  # analytics is defined on (see codes.yaml).
  - which denial reasons cost us the most
  - top denial codes
  - biggest denial reason codes
  - which carcs cost the most
  - rank denial reasons by dollars
  - denial codes by dollars
params:
  - payer
  - service_line
probes:
  - id: category_rollup
    metric_ids: [denied_dollars, denial_volume]
    dimensions: [denial_category]
    window: {quantity: 3, unit: month, mode: full_periods}
    scope_note: >-
      Root-cause category rollup in dollars and records, remittance basis.
      Records are additive across the code cuts below; denied claims are not.
  - id: category_code_detail
    metric_ids: [denied_dollars, denial_volume]
    dimensions: [denial_category, group_code, carc]
    window: {quantity: 3, unit: month, mode: full_periods}
    top_n: 20
    scope_note: >-
      The pairs behind each category. Denials are keyed on group code + CARC
      together and the pair is what identifies the mechanism — a bare CARC is
      ambiguous about who is liable, which is the whole point of the group
      code.
  - id: category_concentration
    metric_ids: [denied_dollars]
    dimensions: [denial_category, payer, service_line]
    window: {quantity: 3, unit: month, mode: full_periods}
    top_n: 20
    scope_note: >-
      Where each category concentrates. A category spread evenly across
      payers is a process defect on our side; one that lives in a single
      payer cell is a payer-policy or contract question.
  - id: category_work_state
    metric_ids: [denials_unworked_pct, denials_unworked_dollar_pct, appeal_overturn_rate]
    dimensions: [denial_category]
    window: {quantity: 3, unit: month, mode: full_periods}
    scope_note: >-
      Work state per category, counted and dollar-weighted. Both unworked
      forms remove patient-responsibility notices from both sides; a category
      with a high overturn rate and a high unworked share is recoverable
      money sitting still.
  - id: category_write_off_context
    metric_ids: [denial_write_off_dollars]
    dimensions: [payer]
    window: {quantity: 3, unit: month, mode: full_periods}
    top_n: 12
    scope_note: >-
      Where denied dollars end up as non-contractual write-offs. Transaction
      grain and no stored denial linkage, so this is scope-level attribution
      by payer and window — never a join to the category rows above, and any
      conclusion must say so.
  - id: category_prevention_context
    metric_ids: [clean_claim_rate, initial_denial_rate]
    dimensions: [service_line]
    window: {quantity: 3, unit: month, mode: full_periods}
    scope_note: >-
      First-pass quality by service line over the same months — the
      prevention side. A category that is large AND rising with a falling
      clean rate in the same service line points upstream, not at the appeals
      team.
transforms:
  - operator: share_of_total
    args: {measure: denied_dollars}
  - operator: compare
    args: {kind: prior_period}
  - operator: rank
    args: {by: denied_dollars, descending: true}
conclusion_policies: [denial_category_claim]
ranking_policy: impact_first
