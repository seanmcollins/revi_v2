# Governed display names for metric ids that overclaim what they measure.
#
# Pack-adjacent governed content, loaded by the API alongside
# `anomaly_actionability.yaml` and content-hashed the same way.
#
# WHY THIS FILE EXISTS. A metric id is a reference
# anchor: playbooks name it, the answer key asserts on it, web fixtures
# pin it, the review record cites it. So an id that turns out to promise
# more than its formula delivers cannot simply be renamed — but it also
# cannot be left wearing the name. This file is the third option: the id
# stays, and every surface that shows one also shows what the number
# ACTUALLY is, in the analyst's words, with the qualification that makes
# it honest.
#
# Entry rules, so this stays a correction and not a thesaurus:
#
#   * an entry is only justified when the id would MISLEAD a reader who
#     did not open the contract — not merely when a prettier label exists;
#   * `caveat` must state the specific thing the formula does not do, and
#     must match the contract's own `Population caveat:` sentence in
#     substance (the contract emits that on every answer; this carries it
#     to surfaces that have no answer, like a portfolio card);
#   * `rationale` records why the entry was added, so a later reader can
#     retire it when the underlying gap closes.
#
# Retiring an entry is the goal, and retiring the WORD is part of it: when
# `timely_filing_at_risk_dollars` grew its filing-rule join (2026-08-09) the
# "watch proxy" label came off, because the number is no longer standing in
# for a measurement nobody could make. What remains is a population statement,
# which is a different and permanent kind of caveat.
metrics:
  timely_filing_at_risk_dollars:
    display_name: Unbilled open inventory on a running filing clock
    caveat: >-
      Counts every unbilled open claim regardless of runway, so claims a
      year from their deadline and claims already past it are both in the
      total; cut by filing_runway_bucket to separate them.
    rationale: >-
      The formula filters on billed_flag = false AND status = OPEN and
      applies no deadline predicate. Until 2026-08-09 none could be
      expressed at all, and the id — served at $22.4M in a warehouse whose
      genuine timely-filing anomaly cards total roughly $62K — read as a
      claim about exposure. The claim -> plan -> filing rule join now exists
      (filing_runway_bucket), and it reports that 47% of that $22.4M is
      already EXPIRED and 33% has more than 90 days of runway. The total is
      still a population rather than an exposure, so the entry stays; it is
      no longer a proxy for something unmeasurable, so the label does not.
  dnfb_dollars:
    display_name: Discharged not final billed (unbilled discharges)
    caveat: >-
      Counts discharged accounts that have not been billed; it says
      nothing about whether the delay is a coding backlog, a
      documentation hold, or a payer-side gate.
    rationale: >-
      "DNFB" is unambiguous inside revenue cycle and opaque outside it,
      and this metric leads the portfolio's largest card. The expansion
      is the whole entry; the caveat only bounds what the number
      diagnoses, and no formula change is implied.
