# Never-worked denials share — the headline "money left on the table" metric.
# v2 repairs an inverted exclusion: v1 wrote `denial_category neq
# PATIENT_RESP`, which compiles to NOT(neq) — it kept only the
# patient-responsibility records it meant to drop. This is the only one of
# the pack's seven inverted exclusions whose dimension resolves, so it is the
# only one that executed and published numbers ("Exclusion polarity" in
# NOTES.md).
id: denials_unworked_pct
version: 2
kind: flow
entity_grain: denial
numerator:
  filtered:
    inner: {count_distinct: denial_id}
    where: {dimension: appeal_status, op: eq, value: NONE}
denominator: {count_distinct: denial_id}
exclusions: {dimension: denial_category, op: eq, value: PATIENT_RESP}
primary_date_basis: remit
allowed_date_bases: [remit, service]
scope_dimensions:
  [payer, payer_type, financial_class, plan, product_type, facility, region,
   service_line, claim_type, carc, group_code, denial_category]
sign: higher_is_bad
unit: ratio
description: >-
  Share of denial records with no appeal activity (appeal status NONE) among
  workable denials in the window, remittance-date basis. Exclusion:
  patient-responsibility category records (PR-group deductible, copay and
  coinsurance notices) are removed from both sides — they are billing
  instructions, not workable denials, and would inflate the unworked share.
  Population caveat: recent denials legitimately show NONE before an appeal
  is filed, so a window near the data edge overstates abandonment.
  Benchmark context: industry sweeps put never-worked denials near two-thirds of all
  denials.
