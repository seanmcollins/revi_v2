# A/R balance — SNAPSHOT of open receivable value, cuttable by the derived
# ar_age_bucket dimension for the aging profile.
id: ar_balance
version: 1
kind: snapshot
entity_grain: claim
numerator:
  filtered:
    inner: {sum: billed_amount_cents}
    where: {dimension: status, op: in, values: [OPEN, DENIED]}
primary_date_basis: service
allowed_date_bases: [service, submission]
scope_dimensions:
  [payer, payer_type, financial_class, plan, product_type, provider,
   provider_specialty, facility, region, service_line, claim_type,
   payer_sequence, ar_age_bucket]
sign: neutral
unit: money_cents
description: >-
  Open accounts receivable as of the snapshot: billed value of unresolved
  claims — still open, or standing denied, since denied inventory remains
  receivable until it is worked or written off. Valuation caveat: your data
  keeps no per-claim net open balance, so A/R is valued at gross billed
  charges, not net of partial payments — a gross-A/R view, stated in every
  answer. Cut by A/R age bucket (built when the check runs, from the newest
  data date against the service or submission date) for the aging profile;
  unsubmitted claims are included, so filtering to claims with no submission
  date yields the unbilled A/R view.
