# DNFB — SNAPSHOT of discharged-not-final-billed dollars (MAP PB-1 family).
id: dnfb_dollars
version: 1
kind: snapshot
entity_grain: claim
numerator:
  filtered:
    inner: {sum: billed_amount_cents}
    where:
      and:
        - {not: {dimension: discharge_date, op: is_null}}
        - {dimension: submission_date, op: is_null}
primary_date_basis: discharge
allowed_date_bases: [discharge]
scope_dimensions:
  [payer, payer_type, financial_class, plan, product_type, provider,
   provider_specialty, facility, region, service_line, claim_type]
sign: higher_is_bad
unit: money_cents
description: >-
  Gross billed dollars on discharged, never-submitted claims as of the
  snapshot (discharge date present, submission date null — the structural
  DNFB definition in this warehouse), aged on the discharge basis. The MAP
  PB-1 days form (DNFB over average daily gross revenue) is a transform
  over this contract and charges, computed at presentation time. Benchmark
  context: five to seven days of revenue is commonly cited as acceptable,
  with some guidance flagging sustained levels above three to five —
  treat as a range. Professional claims (no discharge date) are outside
  this population by construction.
