# DNFB — SNAPSHOT of discharged-not-final-billed dollars (MAP PB-1 family).
id: dnfb_dollars
version: 1
kind: snapshot
entity_grain: claim
numerator:
  filtered:
    inner: {sum: billed_amount_cents}
    where:
      and:
        - {dimension: discharged_flag, op: eq, value: true}
        - {dimension: billed_flag, op: eq, value: false}
primary_date_basis: discharge
allowed_date_bases: [discharge]
scope_dimensions:
  [payer, payer_type, financial_class, plan, product_type, provider,
   provider_specialty, facility, region, service_line, claim_type]
sign: higher_is_bad
unit: money_cents
description: >-
  Gross billed dollars on discharged, never-submitted claims as of the
  snapshot — a discharge date is present and no submission date is, which is
  how DNFB (discharged not final billed) is identified in your data — aged
  from the discharge date. The MAP PB-1 days form (DNFB over average daily
  gross revenue) is built on top of this figure and charges when the answer is
  presented. Benchmark context: five to seven days of revenue is commonly
  cited as acceptable, with some guidance flagging sustained levels above
  three to five — treat as a range. Population caveat: professional claims,
  which have no discharge date, are outside this population by construction,
  and this is inventory standing as of the snapshot rather than a flow
  accumulated over a window, so narrowing the window does not narrow the
  figure.
