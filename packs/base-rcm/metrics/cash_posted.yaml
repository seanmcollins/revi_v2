# Posted payer cash. TRANSACTION grain, POST primary basis (money movement on
# the ledger). Payer-source cash only; patient cash is its own contract and
# combined cash is a transform, never a hidden union.
id: cash_posted
version: 1
kind: flow
entity_grain: transaction
numerator: {sum: payment_cents}
primary_date_basis: post
allowed_date_bases: [post, remit, service, submission]
scope_dimensions:
  [payer, payer_type, financial_class, plan, product_type, facility, region,
   service_line, claim_type]
sign: higher_is_good
unit: money_cents
description: >-
  Payer payment dollars posted in the window, dated by the posting date — when
  the money movement hit the ledger. Excludes patient payments (those are
  patient cash posted), adjustments, and refunds; transaction type carries
  direction and amounts are always positive. The remittance date is a labeled
  alternate for adjudication-aligned views; dating by service or submission
  gives cash-to-date for the services or submissions in the window. "Payer
  payments" and "cash posted" both resolve here.
