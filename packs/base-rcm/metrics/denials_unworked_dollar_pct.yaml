# Dollar-weighted never-worked denial share. The money-left-on-the-table
# question in the unit the question is actually asked in. Deliberately a
# separate contract from the record-count denials_unworked_pct: the two
# diverge exactly when the denials nobody touched are the small ones (or the
# big ones), and that divergence is the finding.
id: denials_unworked_dollar_pct
version: 1
kind: flow
entity_grain: denial
numerator:
  filtered:
    inner: {sum: denied_amount_cents}
    where: {dimension: appeal_status, op: eq, value: NONE}
denominator: {sum: denied_amount_cents}
exclusions: {dimension: denial_category, op: eq, value: PATIENT_RESP}
primary_date_basis: remit
allowed_date_bases: [remit, service]
scope_dimensions:
  [payer, payer_type, financial_class, plan, product_type, facility, region,
   service_line, claim_type, carc, group_code, denial_category]
sign: higher_is_bad
unit: ratio
description: >-
  Denied dollars carrying no appeal activity as a share of workable denied
  dollars in the window, remittance-date basis. Exclusion: patient-
  responsibility category records are removed from both sides — they are
  billing instructions, not workable denials — exactly as in the record-count
  denials_unworked_pct, so the two contracts describe the same population in
  different units and are meant to be read side by side. Denied dollars are
  the payer's asserted amount, NOT a recovery estimate: appeal_overturn_rate
  is well under one, so the recoverable share of this figure is a fraction of
  it and any dollar claim built on it must say so. Watermark caveat: recent
  denials legitimately show no appeal yet, so trailing windows overstate
  abandonment near the data edge.
