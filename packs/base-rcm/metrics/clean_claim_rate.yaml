# Clean claim rate (HFMA MAP CL-1 shape). One honest caveat remains: this
# warehouse has no scrubber events, so the clean flag is outcome-derived.
#
# v2 (2026-08-08): the adjudicated-only population is restored alongside
# denial_rate v2. Both read the same outcome-derived clean_claim flag with
# opposite polarity, and their descriptions state that over an identical
# population the two sum to one — an invariant that only holds if both
# exclude the un-adjudicated tail. `status` is now certified, so the
# exclusion resolves; `exclusions:` names the population to REMOVE.
id: clean_claim_rate
version: 2
kind: flow
entity_grain: claim
numerator:
  filtered:
    inner: {count_distinct: claim_id}
    where: {dimension: clean_claim, op: eq, value: true}
denominator: {count_distinct: claim_id}
exclusions: {dimension: status, op: eq, value: OPEN}
primary_date_basis: submission
allowed_date_bases: [submission, service, remit]
scope_dimensions:
  [payer, payer_type, financial_class, plan, product_type, provider,
   provider_specialty, facility, region, service_line, claim_type,
   payer_sequence]
sign: higher_is_good
unit: ratio
description: >-
  Share of adjudicated claims flagged clean, on the chosen date. Population
  caveat: claims still awaiting their first remittance are excluded from both
  sides — the clean flag is derived from the outcome and stays false until a
  claim resolves paid with zero denials, so an un-adjudicated claim would
  otherwise count as not-clean for want of evidence rather than because
  anything went wrong. Point of clarification: MAP CL-1 measures clean claims
  at the pre-submission scrubber; here the clean flag is derived from the
  outcome (claim resolved with zero denials), so this is an outcome-based
  clean rate — closely related to first-pass yield and complementary to the
  denial rate, which reads the same flag with the opposite polarity, so over
  an identical population the two sum to one. Benchmark context: 95 percent is
  the commonly cited target, top performers near 98 (scrubber-based
  definitions).
