# Denied dollars at the DENIAL entity (one row per denial record from a
# remit; the physical grain is line-level). This is where code-level scope
# lives: group_code + CARC pair and category are legal cuts here, unlike on
# claim-grain denial_rate. v2 rebinds the contract from `line` to `denial`:
# denied_amount_cents and the carc/group_code/denial_category dimensions all
# bind on v_denial, so probes compile and claim cohorts semi-join through
# the certified denial → claim path (see NOTES.md).
id: denied_dollars
version: 2
kind: flow
entity_grain: denial
numerator: {sum: denied_amount_cents}
primary_date_basis: remit
allowed_date_bases: [remit, service, submission]
scope_dimensions:
  [payer, payer_type, financial_class, plan, product_type, facility, region,
   service_line, claim_type, carc, group_code, denial_category,
   appeal_status]
sign: higher_is_bad
unit: money_cents
description: >-
  Billed dollars attached to denial records in the window, counted on the
  remittance date. A claim-level denial carries the claim's whole billed
  total; a line-level denial carries only the denied line's billed amount.
  That is the zero-pay versus partial-pay split, and every denial record is
  marked one or the other. Read these dollars beside the denial volume —
  either one on its own misleads. Denials are keyed on the group code plus
  CARC pair throughout. Denials cannot be broken out by procedure: a
  claim-level denial names no single procedure, so that cut is not
  standardized here.
