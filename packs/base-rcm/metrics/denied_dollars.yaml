# Denied dollars at the DENIAL entity (one row per denial record from a
# remit; the physical grain is line-level). This is where code-level scope
# lives: group_code + CARC pair and category are legal cuts here, unlike on
# claim-grain denial_rate. v2 rebinds the contract from `line` to `denial`:
# denied_amount_cents and the carc/group_code/denial_category dimensions all
# bind on v_denial, so probes compile and claim cohorts semi-join through
# the certified denial → claim path (see NOTES.md).
id: denied_dollars
version: 2
kind: flow
entity_grain: denial
numerator: {sum: denied_amount_cents}
primary_date_basis: remit
allowed_date_bases: [remit, service, submission]
scope_dimensions:
  [payer, payer_type, financial_class, plan, product_type, facility, region,
   service_line, claim_type, carc, group_code, denial_category,
   appeal_status]
sign: higher_is_bad
unit: money_cents
description: >-
  Billed dollars attached to denial records in the window, on the remittance
  (denial) date basis. Claim-level denials carry the claim's billed total;
  line-level denials carry the denied line's billed amount — the denial_level
  column distinguishes them (zero-pay vs partial-pay split). Dollars pair
  with denial_rate volume views: each alone misleads, so present both.
  Denials are keyed on the group code + CARC pair throughout. proc_group is
  not a legal cut at the denial entity (it binds at claim_line only); the
  denial record's line linkage exists but is null for claim-level denials,
  so procedure-level denial cuts wait for a certified path.
