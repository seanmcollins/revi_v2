# Initial denial rate (HFMA Claim Integrity Task Force shape), implemented
# honestly against this warehouse: every recorded denial lands on a claim's
# FIRST remit (rebill/appeal remits never carry new denials), so the numerator
# is exactly first-pass denials with no dedup step needed, and no rebill
# exclusion flag is required because resubmissions are not separate claims
# here (documented in packs/base-rcm/NOTES.md). The submitted-only exclusion
# was removed because `submission_date` is not a catalog dimension; on the
# primary submission basis it was a no-op ("Exclusion polarity" in NOTES.md).
id: initial_denial_rate
version: 1
kind: flow
entity_grain: claim
numerator:
  filtered:
    inner: {count_distinct: claim_id}
    where:
      and:
        - {dimension: clean_claim, op: eq, value: false}
        - {dimension: status, op: neq, value: OPEN}
denominator: {count_distinct: claim_id}
primary_date_basis: submission
allowed_date_bases: [submission, service]
scope_dimensions:
  [payer, payer_type, financial_class, plan, product_type, provider,
   provider_specialty, facility, region, service_line, claim_type,
   payer_sequence]
sign: higher_is_bad
unit: ratio
description: >-
  Claims denied on first adjudication as a share of every claim in the window,
  dated by submission per the Task Force denominator convention — that
  population is exactly the claims submitted in the window, because an
  unsubmitted claim has no submission date to fall inside it; dated by service
  instead, the denominator also carries never-submitted claims. The published
  3-month-average smoothing is a comparison-window choice made when the check
  runs, not part of the definition. Differs from the denial rate in both
  denominator and date. Population caveat: submitted-but-not-yet-adjudicated
  claims sit in the denominator only, so a window read close to the data edge
  reads low until adjudication catches up, and a period-over-period change
  whose two windows differ in adjudication maturity can carry the wrong sign
  for that reason alone — the maturity is disclosed, the sign is not corrected
  for it. Benchmark context: Kodiak reports 11.4-11.6 percent averages
  (2024-2025); pair with the final-denial view, denial write-off dollars, and
  never conflate the two.
