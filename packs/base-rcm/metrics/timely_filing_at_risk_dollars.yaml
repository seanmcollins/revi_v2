# Unbilled open inventory — the population whose filing clocks are running.
#
# NAME WARNING (round-1 review F9). This contract's id says "timely filing
# at risk" and its formula applies NO DEADLINE PREDICATE. It sums billed
# charges on open, never-submitted claims: an upper bound on filing
# exposure, not a measure of it. The gap is three orders of magnitude —
# $22.4M served against ~$62K of genuine filing cards in this warehouse.
#
# The id is deliberately NOT renamed: it is a reference anchor across the
# playbooks, the answer key, the web fixtures and the review record, and
# renaming it would break more than it fixes. What changes instead is
# everything the reader sees — the description below, the mandatory
# population caveat it now carries (emitted as a warning on EVERY answer
# that reads this metric), and the governed display name in
# `../metric_display.yaml`. The formula, version, grain, bases and scope
# dimensions are untouched, so nothing that cites this contract moves.
#
# The real fix — joining each claim's payer/plan to the pack's
# filing_rules at probe time and aging from the snapshot's newest data
# date — is a named milestone in ../NOTES.md, not a promise made here.
id: timely_filing_at_risk_dollars
version: 1
kind: snapshot
entity_grain: claim
numerator:
  filtered:
    inner: {sum: billed_amount_cents}
    where:
      and:
        - {dimension: billed_flag, op: eq, value: false}
        - {dimension: status, op: eq, value: OPEN}
primary_date_basis: service
allowed_date_bases: [service]
scope_dimensions:
  [payer, payer_type, financial_class, plan, product_type, provider,
   provider_specialty, facility, region, service_line, claim_type]
sign: higher_is_bad
unit: money_cents
description: >-
  Billed value of open, never-submitted claims as of the snapshot — the
  unbilled inventory whose filing clocks are running. The contract defines
  the population (open AND not billed) and the valuation (gross billed
  charges) and nothing else: it is the denominator a timely-filing watch
  starts from, and the watch itself is not yet built.
  Population caveat: this figure applies NO deadline predicate. Deadline
  proximity from the pack's filing_rules (limit days, basis, authority,
  confirmation requirement) is NOT yet joined at probe time, so this is
  total unbilled open inventory — an UPPER BOUND on filing exposure, not a
  measure of it. Claims with a year of runway are counted identically to
  claims a week from their limit. Read it as "the population a filing
  watch would age", never as "dollars at risk of a timely-filing denial".
