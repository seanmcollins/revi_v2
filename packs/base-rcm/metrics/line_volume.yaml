# Procedure-line volume. The LINE grain exists so proc_group is reachable at
# all: it binds on claim_line only, so no claim-grain contract can be cut by
# procedure group.
id: line_volume
version: 1
kind: flow
entity_grain: line
numerator: {count_distinct: claim_line_id}
primary_date_basis: service
allowed_date_bases: [service, submission]
scope_dimensions:
  [payer, payer_type, financial_class, plan, product_type, facility, region,
   service_line, claim_type, payer_sequence, proc_group]
sign: neutral
unit: count
description: >-
  Distinct claim lines (procedures) in the window on the chosen basis,
  service by default. This is the procedure-level volume ruler and the only
  volume contract that can be cut by proc_group, since procedure group binds
  at claim_line and not at the claim. Lines per claim varies by service line,
  so line volume and claim_volume move differently on purpose — a rise here
  with flat claim_volume is intensity or charge-capture change, not new
  patients. At a given watermark a claim carries the lines entered so far.
