# Appeals filed — denial records with any appeal activity (pending or
# decided). The pipeline's size, which appeals_pending_pct and
# appeal_overturn_rate only ever express as shares.
id: appeal_volume
version: 1
kind: flow
entity_grain: denial
numerator:
  filtered:
    inner: {count_distinct: denial_id}
    where: {dimension: appeal_status, op: neq, value: NONE}
primary_date_basis: remit
allowed_date_bases: [remit, service, submission]
scope_dimensions:
  [payer, payer_type, financial_class, plan, product_type, facility, region,
   service_line, claim_type, carc, group_code, denial_category]
sign: neutral
unit: count
description: >-
  Denial records in the window carrying appeal activity of any kind —
  appealed-and-pending, overturned or upheld — on the remittance (denial)
  date basis. Counted at the denial record, not the claim: one claim denied
  under two codes and appealed on both is two appeals, which is how appeal
  work is actually staffed. Sign is neutral on purpose: more appeals is not
  better or worse on its own, it is capacity spent, and whether it was spent
  well is appeal_overturn_rate (did we win) read against denied_dollars (was
  it worth pursuing). Population caveat: appeals on recent denials have
  not been filed yet, so a window near the data edge understates the
  pipeline. This
  warehouse records no appeal filing date, so an appeal is dated by the
  denial it answers, never by when the work happened.
