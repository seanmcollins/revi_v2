# Contractual adjustment dollars — the charge-to-allowed haircut posted as
# CONTRACTUAL_ADJ transactions. Distinct from denial_write_off_dollars
# (OTHER_ADJ): contractuals are the contract working as designed, write-offs
# are failed collection. Keeping the two families in separate contracts is
# the point — an "adjustments" total that mixes them hides every leakage
# story inside a much larger, expected number.
id: contractual_adjustment_dollars
version: 1
kind: flow
entity_grain: transaction
numerator: {sum: contractual_adj_cents}
primary_date_basis: post
allowed_date_bases: [post, remit, service, submission]
scope_dimensions:
  [payer, payer_type, financial_class, plan, product_type, facility, region,
   service_line, claim_type]
sign: neutral
unit: money_cents
description: >-
  Contractual adjustment dollars posted in the window, dated by the posting
  date — the difference between gross charges and the contracted allowed
  amount, taken at adjudication. Sign is neutral on purpose: a contractual is
  the negotiated discount, not leakage, and a rising contractual total usually
  means charge growth or mix shift rather than a problem. Read it against
  charges and expected reimbursement, but never by subtraction across a
  window: charges minus contractuals equals the expected amount for a single
  adjudicated claim only. Contractuals are counted per transaction on the
  posting date while both of those are counted per claim on the service date,
  and a contractual posts only after adjudication, so the window totals do not
  close — over May 1 – Aug 2, 2026 the residual runs 7.8% above expected on
  those primary dates and 40.2% above it with both sides read on the service
  date. Never add it to denial write-off dollars either — that family is
  non-contractual write-off and answers a different question.
