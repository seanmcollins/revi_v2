# Bill lag days — service to claim submission, per claim in the window. The
# submitted-only exclusion was removed because `submission_date` is not a
# catalog dimension (see "Exclusion polarity" in NOTES.md); on the primary
# submission basis it was a no-op.
id: bill_lag_days
version: 1
kind: flow
entity_grain: claim
numerator: {sum: submission_lag_days}
denominator: {count_distinct: claim_id}
primary_date_basis: submission
allowed_date_bases: [submission, service]
scope_dimensions:
  [payer, payer_type, financial_class, plan, product_type, provider,
   provider_specialty, facility, region, service_line, claim_type,
   payer_sequence]
sign: higher_is_bad
unit: days
description: >-
  Mean days from service date to claim submission over every claim in the
  window (claim-weighted). Dated by submission, the primary reading, that
  population is exactly the claims submitted in the window, because an
  unsubmitted claim has no submission date to fall inside it. Dated by service
  instead, the denominator also counts claims that were never submitted, which
  have no lag at all and therefore pull the mean down — use DNFB (discharged
  not final billed) and the timely-filing-at-risk views for unresolved
  inventory rather than reading this on the service date. Submission lag is
  derived when the check runs: submission date minus service date, per claim.
  Institutional claims bill after discharge, so their floor is the length of
  stay — cut by claim type before comparing.
