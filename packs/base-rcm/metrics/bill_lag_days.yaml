# Bill lag days — service to claim submission, per submitted claim.
id: bill_lag_days
version: 1
kind: flow
entity_grain: claim
numerator: {sum: submission_lag_days}
denominator: {count_distinct: claim_id}
exclusions: {not: {dimension: submission_date, op: is_null}}
primary_date_basis: submission
allowed_date_bases: [submission, service]
scope_dimensions:
  [payer, payer_type, financial_class, plan, product_type, provider,
   provider_specialty, facility, region, service_line, claim_type,
   payer_sequence]
sign: higher_is_bad
unit: days
description: >-
  Mean days from service date to claim submission over claims submitted in
  the window (claim-weighted; unsubmitted claims are excluded from both
  sides — their lag is measured by DNFB and timely-filing-at-risk views
  instead, so this metric never averages in unresolved inventory).
  submission_lag_days is a documented probe-time derived measure
  (submission_date minus service_date per claim; see pack NOTES).
  Institutional claims bill after discharge, so their floor is the length of
  stay — cut by claim_type before comparing.
