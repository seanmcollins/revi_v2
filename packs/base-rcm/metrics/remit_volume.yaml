# Remittance advices received — adjudication throughput at REMIT grain. The
# only contract on the remit entity, and the only view of "is the payer
# answering us at all" that does not go through a denial or a payment.
id: remit_volume
version: 1
kind: flow
entity_grain: remit
numerator: {count_distinct: remit_id}
primary_date_basis: remit
allowed_date_bases: [remit, service, submission]
scope_dimensions:
  [payer, payer_type, financial_class, facility, region, service_line]
sign: neutral
unit: count
description: >-
  Distinct remittance advices (835 adjudication events) in the window, dated
  by the remittance — how many payer decisions landed. A drop with flat
  submission volume is a payer that has stopped answering, which shows up here
  weeks before it shows up in cash; a rise with flat volume is usually rebill
  and appeal traffic rather than new business. Scope is narrower than every
  other measure on purpose: a remittance carries payer, facility, region and
  service line, but NOT plan, product type or claim type, so those cuts are
  not available here — the remittance simply does not record them. First-pass
  remittances and second-pass rebill or appeal outcomes are marked on the
  remittance record, but that marking is not standardized here, so this counts
  all adjudication events together and cannot separate them.
