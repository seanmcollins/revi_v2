# Line-grain gross charges. Same money as `charges` at a different grain —
# authored so charge value is answerable by procedure group, which binds at
# claim_line only.
id: line_charges
version: 1
kind: flow
entity_grain: line
numerator: {sum: line_billed_amount_cents}
primary_date_basis: service
allowed_date_bases: [service, submission]
scope_dimensions:
  [payer, payer_type, financial_class, plan, product_type, facility, region,
   service_line, claim_type, payer_sequence, proc_group]
sign: neutral
unit: money_cents
description: >-
  Gross billed charges line by line for the window, dated by service — the
  same chargemaster value the claim-level charges figure reports, addressed
  one procedure at a time so it can be cut by procedure group. Use claim-level
  charges for claim and account questions, and this one only when the question
  is about procedures. The two reconcile exactly over the same set of claims,
  but they do NOT match window for window: a line carries its own service
  date, which for an institutional stay can fall on a different day from the
  claim's, so a line-dated window sweeps in a slightly different population —
  about one percent of charge value in your data. Charges are undiscounted
  list value: never compare them to net-revenue benchmarks, and pair with
  allowed dollars for the contracted side.
