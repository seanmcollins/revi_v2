# Average days to pay — submission to payment posting, per payment
# transaction. The payer-scorecard staple and the lag half of the
# cash-decline decomposition.
id: avg_days_to_pay
version: 1
kind: flow
entity_grain: transaction
numerator: {sum: payment_lag_days}
denominator: {count: {}}
exclusions: {dimension: txn_type, op: eq, value: PAYMENT}
primary_date_basis: post
allowed_date_bases: [post, remit]
scope_dimensions:
  [payer, payer_type, financial_class, plan, product_type, facility, region,
   service_line, claim_type]
sign: higher_is_bad
unit: days
description: >-
  Mean days from claim submission to payment posting, over payer payment
  transactions posted in the window (payment-transaction weighted; the
  exclusions restrict the population to PAYMENT transactions, applying to
  numerator and denominator alike). payment_lag_days is a documented
  probe-time derived measure (post date minus the parent claim's submission
  date per payment transaction; see pack NOTES). Cut by payer to build the
  scorecard; a stretch in this metric with flat volume is the timing
  signature the cash-decline playbook separates from mix/volume effects —
  the planted scenario stretches one payer's remit-to-post lag by four
  days.
