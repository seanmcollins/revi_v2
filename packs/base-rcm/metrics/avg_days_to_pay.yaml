# Average days to pay — submission to payment posting, per transaction. The
# payer-scorecard staple and the lag half of the cash-decline decomposition.
# The payments-only restriction was removed because `txn_type` is not a
# catalog dimension and the exclusion was inverted anyway (it removed exactly
# the payments it meant to keep) — see "Exclusion polarity" in NOTES.md. This
# is the one removal of the seven that costs declared meaning.
id: avg_days_to_pay
version: 1
kind: flow
entity_grain: transaction
numerator: {sum: payment_lag_days}
denominator: {count: {}}
primary_date_basis: post
allowed_date_bases: [post, remit]
scope_dimensions:
  [payer, payer_type, financial_class, plan, product_type, facility, region,
   service_line, claim_type]
sign: higher_is_bad
unit: days
description: >-
  Mean days from claim submission to payment posting, over every transaction
  posted in the window. This measure cannot narrow its population to payer
  payments alone: transaction type is not standardized here, so that
  restriction cannot be written into the definition today. The numerator
  carries part of it — payment lag is recorded only on payment transactions,
  and a sum skips what is missing, so only payment lag enters the numerator —
  but the denominator counts every transaction, so the mean is pulled downward
  in proportion to the non-payment share. Read the level only after scoping to
  a payment-dominated population, and prefer period-over-period movement to
  the absolute number until transaction type is standardized. Payment lag is
  derived when the check runs: posting date minus the parent claim's
  submission date, per payment transaction. Cut by payer to build the
  scorecard; a stretch here with flat volume is the timing signature a
  cash-decline review separates from mix and volume effects — in the reference
  data, one payer's remittance-to-posting lag is stretched by four days.
