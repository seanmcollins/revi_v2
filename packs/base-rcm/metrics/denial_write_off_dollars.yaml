# Non-contractual write-off dollars — the warehouse's write-off transaction
# family (final-denial realization plus other administrative write-offs).
id: denial_write_off_dollars
version: 1
kind: flow
entity_grain: transaction
numerator: {sum: other_adj_cents}
primary_date_basis: post
allowed_date_bases: [post, service, submission]
scope_dimensions:
  [payer, payer_type, financial_class, plan, product_type, facility, region,
   service_line, claim_type]
sign: higher_is_bad
unit: money_cents
description: >-
  Non-contractual (OTHER_ADJ) adjustment dollars posted in the window, on
  the write-off posting date basis — the MAP AR-6 numerator family. Honesty
  notes: (1) this warehouse's OTHER_ADJ transactions are generated by denial
  write-off events (upheld appeals and never-appealed denials), but the
  transaction rows carry no stored denial linkage, so attribution to a
  specific denial is by investigation scope (payer, window, drill-down), not
  a join; (2) the AR-6 "net of recoveries" refinement does not apply — no
  recovery-reversal events exist here; (3) the ratio-to-net-revenue form
  (target 2-5 percent) needs an NPSR series this warehouse lacks — pair the
  dollars with expected-basis cash views instead and label any proxy.
