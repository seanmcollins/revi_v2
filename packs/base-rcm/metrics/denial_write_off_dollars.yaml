# Non-contractual write-off dollars — the warehouse's write-off transaction
# family (final-denial realization plus other administrative write-offs).
id: denial_write_off_dollars
version: 1
kind: flow
entity_grain: transaction
numerator: {sum: other_adj_cents}
primary_date_basis: post
allowed_date_bases: [post, service, submission]
scope_dimensions:
  [payer, payer_type, financial_class, plan, product_type, facility, region,
   service_line, claim_type]
sign: higher_is_bad
unit: money_cents
description: >-
  Non-contractual adjustment dollars posted in the window, dated by when the
  write-off posted — the MAP AR-6 numerator family. Honesty notes: (1) in your
  data these adjustments come from denial write-offs, meaning upheld appeals
  and never-appealed denials, but the transaction records carry no stored link
  back to the denial, so attributing one to a specific denial is done by the
  scope of the investigation — payer, window, drill-down — and not by a direct
  link; (2) the AR-6 "net of recoveries" refinement does not apply, because no
  recovery reversals exist here; (3) the ratio-to-net-revenue form (target 2-5
  percent) needs an NPSR series your data does not have, so pair the dollars
  with expected-value cash views instead and label any estimate as one.
