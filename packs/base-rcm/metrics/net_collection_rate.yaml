# Net collection rate — payer cash realized against contract-expected
# reimbursement for the same service-date cohort. Cross-entity ratio: the
# numerator component resolves on the transaction entity, the denominator on
# the claim entity; the kernel computes ratio-of-sums per cell (slicing law).
id: net_collection_rate
version: 1
kind: flow
entity_grain: claim
numerator: {sum: payment_cents}
denominator: {sum: expected_amount_cents}
primary_date_basis: service
allowed_date_bases: [service, submission]
scope_dimensions:
  [payer, payer_type, financial_class, plan, product_type, facility, region,
   service_line, claim_type]
sign: higher_is_good
unit: ratio
description: >-
  Payer cash posted to date for services in the window, divided by
  contract-expected reimbursement for the same service-date population. Points
  of clarification: (1) the textbook denominator is charges minus contractual
  adjustments, and the contract-modeled expected amount in your data is that
  same net-collectible quantity stated directly — this definition says so
  rather than pretending to an NPSR it does not have; (2) patient cash is
  excluded, so this is payer realization only, patient cash posted covers the
  rest, and the number reads slightly below all-cash formulations; (3) recent
  service months read low until adjudication and posting catch up. Population
  caveat: a recent service-date population has not finished adjudicating or
  posting, so a window near the data edge understates realization and two
  windows of unequal maturity are not comparable as levels. Benchmark context:
  95-99 percent on all-cash definitions; below ~92 suggests leakage.
