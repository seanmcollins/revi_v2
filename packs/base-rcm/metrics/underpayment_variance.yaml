# Underpayment variance — expected minus allowed, floored at zero per claim.
# NEVER nets underpayments against overpayments.
id: underpayment_variance
# v2 (2026-08-09): SCOPE WIDENING ONLY — `primary_proc_group` added below.
# The formula is untouched: still max(0, expected - allowed) per claim,
# still never netted. Underpayment is negotiated BY procedure group, and a
# claim-grain contract had no legal procedure cut at all, so the three
# planted payer-times-procedure cards could be detected and not opened.
# Read the cut as an ATTRIBUTION, not a decomposition: a claim lands in the
# group carrying the largest share of its billed charges, so the cut
# reconciles to the ungrouped total, and it is NOT the line-grain
# `proc_group` cut.
version: 2
kind: flow
entity_grain: claim
numerator: {sum: underpayment_cents}
primary_date_basis: service
allowed_date_bases: [service, submission]
scope_dimensions:
  [payer, payer_type, financial_class, plan, product_type, provider,
   provider_specialty, facility, region, service_line, claim_type,
   payer_sequence, primary_proc_group]
sign: higher_is_bad
unit: money_cents
description: >-
  Dollars by which payers allowed less than contract-expected: per adjudicated
  claim, the expected amount minus the sum of the visible line allowed
  amounts, floored at zero, summed over the window. This never nets
  overpayments against underpayments — each claim's variance is floored at
  zero before summing, because netting hides recoverable dollars, and
  overpayments are a credit-balance problem tracked separately. The variance
  is derived when the check runs, over adjudicated claims only, since a line
  has no allowed amount before its first remittance. Attribution by
  adjudication month is an investigation cut, because a claim itself is dated
  by service or submission. Benchmark context: industry reviews repeatedly
  find payers underpaying a material share of claims; in the reference data,
  one payer-by-procedure-group cell pays 92 percent of expected.
