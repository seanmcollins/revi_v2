# Share of a claim cohort worked all the way to a resolved standing (paid or
# closed) as of the snapshot. The zero-balance question, asked of a cohort
# rather than of the whole ledger: ar_balance says how much is still open,
# this says what fraction of the business ever got finished.
id: claim_resolution_rate
version: 1
kind: flow
entity_grain: claim
numerator:
  filtered:
    inner: {count_distinct: claim_id}
    where: {dimension: status, op: in, values: [PAID, CLOSED]}
denominator: {count_distinct: claim_id}
primary_date_basis: service
allowed_date_bases: [service, submission, discharge]
scope_dimensions:
  [payer, payer_type, financial_class, plan, product_type, provider,
   provider_specialty, facility, region, service_line, claim_type,
   payer_sequence]
sign: higher_is_good
unit: ratio
description: >-
  Claims that have reached a resolved standing — paid or closed — as a share
  of all claims in the window, dated by service. Population caveat: it is the
  whole reading — membership is fixed by service date while each claim's
  standing is read from the latest data load, so the standing is "as of today"
  while the population is "as of service", and recent service months read low
  purely because they have not had time to resolve. The number is only
  interpretable as a curve across the age of the service month, or as a
  payer-versus-payer comparison at equal age — never as a single level. A
  claim closed on a write-off counts as resolved just as a paid one does, so a
  high rate is not by itself good news: read it against denial write-off
  dollars, and against the net-to-gross rate for what the resolutions were
  worth. What remains unresolved is exactly the A/R balance population: still
  open, plus standing denied.
