  - id: ops.appeal_economics
    title: "Appeal economics: cost per appeal, overturn odds, and when to appeal"
    domains: [workflow, appeals, denials]
    aliases:
      - when to appeal
      - appeal cost benefit
      - appeal roi
    summary: >-
      Premier's national hospital survey found fighting a denial costs an
      average of $43.84 per claim, yet 54.3% of private-payer denials are
      ultimately overturned and paid — typically after about three review
      rounds of 45-60 days each. HFMA-published practice is to appeal 85-88%
      of denials; materially higher suggests fighting unwinnable cases,
      materially lower suggests leaving recoverable revenue. The operational
      decision rule is expected-value based.
    key_points:
      - >-
        Average cost to fight a denied claim $43.84; overturned denials
        typically required ~3 rounds of review of 45-60 days each, so
        recovered cash routinely lags 6+ months (Premier).
      - >-
        Best-practice organizations appeal 85-88% of denials; appealing above
        ~92% indicates pursuing unwinnable denials, lower rates signal
        under-appealing that payers notice (HFMA).
      - >-
        Decision rule: appeal when p(overturn | payer, reason code, service
        line) times expected recovery exceeds cost per round times expected
        rounds; calibrate the overturn probability from the organization's
        own payer-by-reason history, not industry averages.
      - >-
        Skip-appeal candidates: low-balance technical denials better resolved
        by corrected claims, denials below the cost-to-appeal floor (route to
        write-off governance), and hard denials with no documentation basis.
    cautions:
      - >-
        Premier figures are survey-based, hospital-centric, private-payer
        only; the 85-88% target presumes an effective prevention program.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
    sources:
      - id: premier-denials-2024
        title: "Trend Alert: Private Payers Retain Profits by Refusing or Delaying Legitimate Medical Claims"
        publisher: Premier Inc.
        url: https://premierinc.com/newsroom/blog/trend-alert-private-payers-retain-profits-by-refusing-or-delaying-legitimate-medical-claims
