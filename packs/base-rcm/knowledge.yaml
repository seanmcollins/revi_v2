  - id: payer.commercial.silent_ppo
    title: Silent PPOs and rental network discounts
    domains: [payer_behavior, commercial]
    aliases:
      - silent ppo
      - rental network
      - rental network ppo
      - repricer discount
    summary: >-
      Rental network PPOs broker discounted physician rates and lease their
      panels to many downstream payers, TPAs, and repricers. A "silent PPO"
      takes that discount without a contractual right to it or without
      disclosing which network contract was applied. The tell on a remit is
      an unexplained contractual adjustment from an unfamiliar payer or
      repricer; the correct response is to demand the contractual basis for
      the discount before accepting the reduced payment.
    key_points:
      - >-
        Rental network PPOs lease physician panels and discount rates to
        assorted payers; silent-PPO behavior applies a network discount
        without prior approval from, and often without notice to, the
        physician (AMA).
      - >-
        AMA backs NCOIL model rental-network transparency legislation,
        adopted in several states.
      - >-
        Detection: reconcile every contractual adjustment to a known
        contract; flag remits from repricers or networks never contracted
        with, discounts deeper than the contracted rate, and "network
        access" language on EOBs.
      - >-
        Response: request the specific contract chain authorizing the
        discount, rebill at billed charges when none exists, and audit
        historical remits for the same repricer once one silent discount is
        confirmed.
    cautions: []
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
    sources:
      - id: ama-fair-contracting
        title: Fair contracting (silent PPOs / rental network PPOs)
        publisher: American Medical Association
        url: https://www.ama-assn.org/practice-management/claims-processing/fair-contracting
        authority: professional association
        last_verified_at: 2026-08-07

  - id: payer.commercial.timely_filing_variation
    title: "Commercial timely filing: 90-365 days, contract-controlled"
    domains: [payer_behavior, commercial, timely_filing]
    aliases:
      - commercial timely filing
      - payer filing limits
      - filing limit variation
    summary: >-
      There is no industry-standard commercial filing window. Published
      in-network defaults cluster at 90-180 days from date of service
      (UnitedHealthcare, Aetna, Cigna, Humana commonly 90 days), while BCBS
      affiliates range from 90 to 365 days by state — and the individual
      participation agreement overrides every published number.
      Corrected-claim and appeal clocks run separately, often from the
      remittance date, and appeal windows are usually shorter than filing
      windows.
    key_points:
      - >-
        Published in-network commercial defaults: UnitedHealthcare 90 days
        (up to 180 in some contracts), Aetna 90, Cigna 90, Humana 90 on
        legacy commercial agreements; BCBS affiliates range roughly 90-365
        days by state.
      - >-
        Corrected claims frequently run from the remittance-advice date
        rather than date of service (e.g. UHC 180 days from original
        remittance), which can extend effective filing time.
      - >-
        Appeal deadlines (commonly 60-180 days) are a separate, usually
        shorter clock than initial filing windows.
      - >-
        Timely-filing denials should always be checked against the actual
        contract plus proof of timely submission (clearinghouse acceptance
        reports).
    cautions:
      - >-
        Aggregator-sourced data; some secondary sources list Aetna at 120
        days for certain plans. Payer defaults change and contracts override
        them — always confirm in the participation agreement and current
        provider manual.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
