  - id: payer.commercial.em_downcoding
    title: "Commercial E/M downcoding programs: Cigna R49 and peer policies"
    domains: [payer_behavior, commercial, denials]
    aliases:
      - cigna r49
      - em downcoding
      - algorithmic downcoding
      - em coding accuracy policy
    summary: >-
      Effective October 1, 2025, Cigna's Evaluation and Management Coding
      Accuracy Policy (R49) unilaterally downcodes level 4/5 E/M claims by
      one level for professionals flagged as consistently coding above peers,
      paying the adjusted rate immediately. Providers can submit records for
      reconsideration and request a policy bypass after five or more
      adjustments if 80% of reviewed claims validate. Similar pattern-based
      programs have been reported at other national payers, making downcode
      detection on remits a standing commercial-payer workflow.
    key_points:
      - >-
        Cigna R49 (Oct 1, 2025): automatic one-level downcoding of 99204,
        99205, 99214, 99215, 99244, 99245 when submitted diagnoses do not
        appear to support visit complexity; ~97-99% of in-network providers
        unaffected at launch per Cigna.
      - >-
        Claims pay promptly at the reduced level with the adjustment flagged
        on the explanation of payment — a payment variance, not a denial, so
        denial dashboards can miss it.
      - >-
        Reconsideration: submit complete encounter records; if documentation
        supports the original level, payment is corrected. Bypass available
        after 5+ adjusted claims when at least 80% of reviewed claims were
        billed in line with AMA guidelines.
      - >-
        RCM playbook: reconcile paid vs billed CPT on every remit to catch
        silent downcodes, aggregate by payer and policy, and batch
        documentation rebuttals.
    cautions:
      - >-
        Reports of similar programs at other national payers circulated in
        2025 trade press but were not verified against payer bulletins;
        confirm per payer before citing.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
