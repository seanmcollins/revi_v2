        publisher: Kodiak Solutions (via PRWeb)
        url: https://www.prweb.com/releases/healthcare-providers-face-increasingly-long-waits-for-payments-worsening-financial-stress-302013958.html
        authority: vendor press release, primary data
        effective_from: 2023-09-30
