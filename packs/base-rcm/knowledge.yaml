  - id: ops.claim_edit_maintenance
    title: Claim-edit and scrubber maintenance as a prevention discipline
    domains: [workflow, prevention, measurement]
    aliases:
      - edit maintenance
      - scrubber maintenance
      - edit library
    summary: >-
      Clean claim rate — HFMA MAP Key CL-1, claims requiring no manual
      intervention — is the standard measure of edit effectiveness, with 90%+
      expected and 95% widely cited as the industry standard. Because payers
      change policies continuously (a majority of surveyed providers say
      clean claim submission is getting harder), edit libraries decay without
      maintenance: denial CARC/RARC patterns must feed back into scrubber
      rules on a scheduled cadence.
    key_points:
      - >-
        Experian 2025: nearly 70% of providers say submitting clean claims is
        harder than a year prior and 54% report claim errors increasing —
        static edit libraries lose ground to payer policy churn.
      - >-
        Maintenance loop: mine new denial CARC+RARC combinations monthly,
        convert recurring preventable patterns into pre-submission edits, and
        retire zero-hit edits to keep scrubber latency down.
      - >-
        Track paired metrics: pre-submission edit hit rate vs
        post-adjudication denial rate for the same defect class — a rising
        denial share for an editable defect means the edit library is stale.
      - >-
        Monitor payer bulletins and policy-change feeds as a standing input;
        frequent payer policy changes are a consistently cited denial driver.
    cautions:
      - >-
        HFMA does not publish the 90/95% numeric targets on its open MAP Keys
        page; the figures come via trade reporting on the MAP framework.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
