  - id: ops.appeals_ma
    title: "Medicare Advantage appeals: plan reconsideration and IRE auto-forward"
    domains: [workflow, appeals, medicare_advantage]
    aliases:
      - ma appeals
      - ma reconsideration
      - part c ire
      - ire auto-forward
    summary: >-
      MA appeals start with a reconsideration filed with the plan within 65
      calendar days of the organization determination notice. Plans must
      decide within 72 hours (expedited pre-service), 30 days (standard
      pre-service), or 60 days (payment requests). Any adverse plan
      reconsideration is automatically forwarded to the Part C Independent
      Review Entity — the provider does not have to request second-level
      review — after which the case follows the standard ALJ/Council/court
      ladder.
    key_points:
      - >-
        File reconsideration within 65 calendar days of the organization
        determination notice (CMS's current figure — not the older 60-day
        number); plans must expedite when a physician requests it.
      - >-
        Plan decision clocks: 72 hours expedited pre-service, 30 calendar
        days standard pre-service, 7 days standard Part B drug, 60 days for
        payment requests.
      - >-
        If the plan upholds its denial in whole or part, it must
        automatically submit the case to the Part C IRE — a structural
        difference from FFS where the appellant files each level.
      - >-
        IRE contractor transition: MAXIMUS Federal Services through April 30,
        2026; C2C Innovative Solutions effective May 1, 2026.
      - >-
        For MA payment denials, expect a ~60-day plan decision window before
        auto-forward; track IRE outcomes separately from plan-level
        decisions.
    cautions: []
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
