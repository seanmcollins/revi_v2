  - id: payer.prompt_pay_rfi_stalling
    title: Records-request stalling and the MA prompt-payment loophole
    domains: [payer_behavior, medicare_advantage, commercial]
    aliases:
      - prompt pay
      - records request stalling
      - clean claim disputes
      - payment delay tactics
    summary: >-
      There is no uniform federal prompt-payment standard for in-network MA
      claims, and the broad "clean claim" definition lets plans restart the
      payment clock by repeatedly requesting duplicative documentation or
      claiming records were lost. AHA reports 50% of surveyed hospitals carry
      more than $100M in claims unpaid for over six months. RCM teams should
      log every additional-documentation request with dates, track clock
      restarts per claim, and escalate repeat requests as a payer-behavior
      pattern rather than one-off events.
    key_points:
      - >-
        A "clean claim" is one without defect, impropriety, or missing
        required documentation — wording that gives plans unilateral
        discretion to declare claims not clean (AHA, May 2026).
      - >-
        Plans restart the prompt-payment timeline by requesting additional
        materials or asserting documentation was lost, sometimes multiple
        times per claim; one documented example demanded records the plan had
        already received during prior authorization.
      - >-
        In-network MA claims generally face no federal interest penalty for
        late payment; original Medicare and Part D have strong prompt-pay
        standards, and MA has one only for out-of-network claims.
      - >-
        772 surveyed hospitals reported $6.4B+ in delayed or denied claims;
        50% of hospitals report more than $100M unpaid past six months.
      - >-
        Pending federal fixes to watch: Medicare Advantage Prompt Pay Act
        (95% of clean claims paid in 14 days in-network) and Medicare
        Advantage Improvement Act (authorized services deemed clean, 30-day
        payment).
    cautions:
      - >-
        AHA is a hospital advocacy body; figures come from member surveys.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
    sources:
