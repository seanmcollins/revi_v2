  - id: reg.hipaa_attachments
    title: HIPAA claims-attachment standards adopted (March 2026, compliance May 2028)
    domains: [regulatory, edi]
    aliases:
      - claims attachments rule
      - 275 transaction
      - 277 rfai
      - subpart t
    summary: >-
      A final rule published March 24, 2026 (91 FR 14405) added Subpart T to
      45 CFR part 162, adopting for the first time national HIPAA standards
      for the claims-attachment transaction — provider-to-plan attachment
      information and plan-to-provider requests for additional information.
      The adopted standards (X12N 275/277 version 6020 plus HL7 C-CDA
      document formats and a digital-signature guide) apply on and after May
      26, 2028.
    key_points:
      - >-
        The transaction covers attachment information supporting a claim or
        encounter and a health plan's request to a provider for that
        information (162.2001).
      - >-
        Standards effective on/after May 26, 2028: X12N 275 (additional
        information to support a claim) and 277 (request for additional
        information), with HL7 C-CDA document payloads and CDA digital
        signatures.
      - >-
        RCM impact: standardizes the additional-documentation loop behind
        documentation-request denials and payer ADR requests, which today
        run through proprietary portals, fax, and mail — expect payer
        workflows to converge on 277 RFAI + 275 by mid-2028.
      - >-
        CAQH CORE already publishes (not yet federally mandated) attachments
        operating rules — likely candidates for future adoption.
    cautions:
      - >-
        The codified Subpart T addresses claims attachments — do not assume
        the same mandate covers prior-authorization attachments. Payer
        adoption before 2028 is voluntary and will be uneven.
