  - id: benchmark.patient_collections_bad_debt
    title: Patient-responsibility collection rates and the insured bad-debt shift
    domains: [benchmarks, patient_collections]
    aliases:
      - patient collection rate benchmark
      - insured bad debt
      - self-pay collection benchmark
    summary: >-
      Kodiak's data shows collections from insured patients' out-of-pocket
      balances deteriorating: providers collected 34.46% of
      self-pay-after-insurance balances in 2024, down from 37.58% in 2023,
      and a separate Kodiak analysis of fully resolved commercial claims
      found collection rates falling from 54.8% (2021) to 47.6% (2022-23).
      Insured patients now generate the majority of hospital bad debt — 53%
      of the estimated $17.4B written off in 2023.
    key_points:
      - >-
        Kodiak (2024): 34.46% of balances owed by insured patients collected,
        down from 37.58% in 2023.
      - >-
        Kodiak (Feb 2024, ~3M fully resolved commercial claims): patient
        collection rate fell from 54.8% (2021 dates of service) to 47.6%
        (2022-2023) — definitions differ by denominator.
      - >-
        53% of the estimated $17.4B in provider bad-debt write-offs in 2023
        came from insured patients; commercially insured patients carried
        ~23% of their medical bills as of Q3 2023.
      - >-
        Collections drop sharply with balance size: ~69 cents per dollar on
        bills under $100, with steep drop-off above $500 and again above
        $5,000.
      - >-
        Median bad-debt rate across 2,300+ Kodiak hospitals: 1.1% (2024)
        rising to 1.3% (2025).
