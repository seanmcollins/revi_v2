  - id: payer.ma.drg_downgrades
    title: "MA DRG downgrades: retrospective downcoding of inpatient claims"
    domains: [payer_behavior, medicare_advantage, denials]
    aliases:
      - DRG downgrade patterns
      - DRG validation audits
      - sepsis downgrade
      - clinical validation audit
    summary: >-
      MA plans increasingly run retrospective DRG validation / clinical
      validation audits that strip major complication or comorbidity
      diagnoses (sepsis, acute respiratory failure, acute kidney injury,
      severe malnutrition) and repay claims at a lower DRG — sometimes even
      on prior-authorized admissions. A single sepsis-to-simple-pneumonia
      downgrade cuts payment by roughly $5,316, and one health system
      reported downgrades touching up to 10% of inpatient discharges.
    key_points:
      - >-
        Mechanism: retrospective chart review disputes documentation for
        high-weight diagnoses and reassigns a lower-weight DRG; payment is
        reduced without a traditional denial, so it surfaces as a payment
        variance, not on denial dashboards.
      - >-
        Typical downgrades cost $3,000-$5,000+ per claim; Ballad Health
        reported downgrades affecting up to 10% of inpatient discharges.
      - >-
        Secondary damage: repeated downgrades depress Case Mix Index,
        dragging down future payment rates and distorting quality metrics.
      - >-
        Plans position DRG audits as coding reviews, not medical-necessity
        determinations, to sidestep CMS-4201-F utilization-management limits;
        appeals should challenge that framing.
    cautions:
      - >-
        Per-claim dollar figures are illustrative examples from one
        consultancy's analysis, not payer-published data.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
