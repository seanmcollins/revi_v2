  - id: ops.denial_prevention_front_end
    title: "Prevention loops: eligibility cadence, auth workqueues, COB capture"
    domains: [workflow, prevention, denials]
    aliases:
      - denial prevention
      - eligibility cadence
      - auth workqueue
      - prevention feedback loop
    summary: >-
      The highest-yield denial prevention lives at the front end: verifying
      eligibility at scheduling and again before service, working
      authorization workqueues to closure before the date of service, and
      capturing coordination-of-benefits/MSP data at registration. MGMA
      polling shows practices that reduced denials credited front-desk
      training, dedicated denials task forces, and tightened eligibility and
      authorization processes.
    key_points:
      - >-
        Verify eligibility at scheduling and re-verify close to the date of
        service — single-point verification misses mid-cycle coverage changes
        that surface as eligibility and COB denials.
      - >-
        Run authorization workqueues that force resolution before service;
        authorization denials are rarely recoverable after the fact.
      - >-
        Capture COB/MSP data at registration (for Medicare, a completed MSP
        questionnaire) and verify payer ordering before submission.
      - >-
        MGMA (Mar 2024): 60% of groups reported rising denials and only 11%
        achieved reductions — reducers credited front-desk training, denials
        task forces, clinical documentation improvement, and refined
        authorization processes.
      - >-
        Close the loop: route every preventable denial back to the owning
        upstream department with reason-code-based root-cause tagging, and
        track recurrence by root cause after each fix.
    cautions: []
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
