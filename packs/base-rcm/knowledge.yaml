  - id: reg.nsa_idr_operations
    title: "No Surprises Act: Federal IDR Operations final rule (2026)"
    domains: [regulatory, no_surprises_act]
    aliases:
      - idr ops rule
      - federal idr rule
      - nsa arbitration rule
    summary: >-
      On May 28, 2026 HHS, DOL, Treasury, and OPM finalized the Federal IDR
      Operations rule (published June 4, 2026; effective August 3, 2026),
      overhauling No Surprises Act arbitration. It cuts the per-party
      administrative fee to $15, forces open negotiation through the federal
      IDR portal, tightens batching and eligibility timelines, creates a
      payer IDR Registry, and requires payers to flag NSA-subject claims on
      remittances using designated CARCs/RARCs.
    key_points:
      - >-
        Administrative fee cut to $15 per party per dispute (from $115);
        unpaid fees mean a party's offer is not considered received.
      - >-
        Payers must use specified CARCs/RARCs on remittance advice to
        non-contracted providers to indicate whether a claim is subject to
        NSA surprise-billing/IDR provisions, plus disclose plan legal
        business name and IDR registration number — a new regulatory meaning
        layered onto 835 data.
      - >-
        Open negotiation must start through the federal IDR portal (30
        business-day clock); response notice due by the 15th business day.
      - >-
        Batching allowed for same patient encounter, same service code across
        patients, and same-CPT-section ancillary codes — capped at 50 line
        items per dispute.
      - >-
        Certified IDR entities must determine eligibility within 5 business
        days of final selection; a new payer IDR Registry supports
        eligibility checks and enforcement jurisdiction.
    cautions:
      - >-
        The specific CARC/RARC values for NSA claim flagging will be set in
        future guidance; several applicability dates are staggered off the
        August 3, 2026 effective date.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
