        authority: federal regulator guidance

  - id: reg.medicare_corrections_rebilling
    title: "Medicare corrections and rebilling: XX7 adjustments, XXQ reopenings, W2, A-to-B"
    domains: [regulatory, medicare, workflow]
    aliases:
      - xx7
      - xxq
      - condition code w2
      - a to b rebilling
      - medicare reopening
    summary: >-
      Corrections within Medicare's 12-month filing window use adjustment
      bill type XX7; corrections beyond it require the XXQ reopening process
      with condition code W2 attesting the claim duplicates the original bill
      with no appeal in process. Hospitals that self-audit and determine an
      inpatient admission was not reasonable and necessary may rebill Part B
      inpatient services after submitting a provider-liable no-pay Part A
      claim — but the rebilled claim is still bound by the same 12-month
      limit.
    key_points:
      - >-
        Within timely filing: submit adjustment claims as bill type XX7.
        Beyond it, an XX7 is returned to provider; use the XXQ reopening
        request instead — but only for clerical errors and omissions, not
        medical-record-based denials, which require appeals.
      - >-
        Condition code W2 attests the provider is reopening a previously
        submitted bill and no appeal is in process (a bill cannot be
        simultaneously reopened and appealed).
      - >-
        Part A-to-B rebilling after self-audit (CMS-1599-F, admissions on or
        after Oct 1, 2013): first a no-pay bill-type 110 inpatient claim
        accepting provider liability, then the inpatient Part B claim (12x)
        with condition code W2 referencing the denied claim.
      - >-
        Rebilled 12x claims get no timely-filing exception — recovery is lost
        when audits find issues more than a year after service, making
        inpatient-status accuracy at admission financially decisive.
    cautions: []
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
