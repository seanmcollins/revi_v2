  - id: benchmark.initial_denial_rates
    title: "Initial claim denial rates: national hospital benchmarks"
    domains: [benchmarks, denials]
    aliases:
      - initial denial rate benchmark
      - national denial rate
      - denial rate benchmark
      - average denial rate
    summary: >-
      Two large proprietary datasets converge on an initial denial rate of
      roughly 11.8-12% of hospital claims in 2023-2024, up from about 9-10%
      before 2020. Provider survey data (Premier) puts private-payer initial
      denials higher, near 15%. The rate has risen nearly every year since
      2016, with payers increasingly using denials and information requests
      to slow payment even though most denied claims are eventually paid.
    key_points:
      - >-
        Kodiak Solutions (2,100+ hospitals, 300,000+ physicians): initial
        denial rate hit 11.81% of claims in 2024, up 2.4% year over year;
        earlier Kodiak data showed 10.15% in 2020 rising to 11.99% by Q3 2023.
      - >-
        Optum 2024 Revenue Cycle Denials Index (~124M hospital claim remits,
        1,400+ hospitals, Jan-Dec 2023): average denial rate ~12% in 2023,
        vs 10% in 2020 and 9% in 2016.
      - >-
        Regional spread is wide: Optum found 2023 denial rates from 9.16%
        (Mountain) to 16.48% (Pacific).
      - >-
        Premier survey (516 hospitals, fielded Oct-Dec 2023): nearly 15% of
        claims submitted to private payers are initially denied, including
        ~3.2% that had already received prior authorization.
      - >-
        Clearinghouse/remit platform data (Kodiak, Optum) runs lower than
        provider self-report surveys (Premier); the spread is methodological,
        and some Kodiak series measure share of claim value, not claim count.
    cautions:
      - >-
        Kodiak reports payers ultimately pay roughly 90% of initially denied
        claims — initial denial rates measure friction, not final loss.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
    sources:
      - id: techtarget-kodiak-2024
        title: Initial claim denial rates put revenue cycle in tough spot
        publisher: TechTarget (Kodiak Solutions data)
        url: https://www.techtarget.com/revcyclemanagement/news/366625109/Initial-claim-denial-rates-put-revenue-cycle-in-tough-spot
