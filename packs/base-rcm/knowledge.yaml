  - id: ops.rebill_vs_appeal
    title: "Rebill (corrected claim) vs appeal: decision rules"
    domains: [workflow, denials, appeals]
    aliases:
      - rebill or appeal
      - corrected claim vs appeal
      - resubmit vs appeal
    summary: >-
      A corrected claim and an appeal are different instruments with
      different clocks: rebill when the original claim itself was wrong
      (units, modifiers, diagnosis sequencing, missing data); appeal or
      request reconsideration when the claim was accurate but the payer's
      adjudication is disputed. Payers maintain distinct filing windows for
      each path, and using the wrong instrument wastes a limited window.
    key_points:
      - >-
        Corrected claim: the original submission contained billing errors or
        missing data — a replacement or void resubmission, not a dispute of
        the payer's decision.
      - >-
        Appeal/reconsideration: disagreement with a denial or payment
        reduction, disputes over policy application, or post-service
        authorization denials — the claim data itself was correct.
      - >-
        Example payer windows (Centene affiliate): Medicaid appeals 365 days
        from service or 120 days from the EOP (whichever is later), MA 180
        days from the EOP, commercial 120 days from the EOP — with separate
        corrected-claim windows.
      - >-
        Timely-filing denials are appealed with proof of original timely
        submission, not rebilled — resubmitting restarts nothing and can
        generate duplicate denials.
      - >-
        Soft denials with correctable defects resolve fastest as corrected
        claims; escalate to formal appeal only when reconsideration fails or
        the dispute is substantive.
    cautions:
      - >-
        The filing windows cited are one payer's example — encode
        per-payer/per-product timeframes as data, not constants.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
    sources:
      - id: meridian-appeals-vs-corrected
        title: "Reference Guide: Appeals/Reconsiderations vs. Corrected Claims"
        publisher: Meridian (Centene) provider bulletin
        url: https://www.mimeridian.com/providers/bulletins/052025-appeals-reconsiderations-corrected-claims.html
        authority: payer bulletin (primary example)
