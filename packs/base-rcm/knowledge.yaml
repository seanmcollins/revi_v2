  - id: benchmark.denials_never_worked
    title: Denials never appealed or reworked
    domains: [benchmarks, denials, appeals, workflow]
    aliases:
      - unworked denial share
      - never appealed denials
      - denial appeal rates
      # deliberate concept overlap: the concept defines, this card elaborates
      - unworked denials
    summary: >-
      The best-documented figures on unworked denials come from payer-side
      data: fewer than 1% of denied marketplace claims are appealed by
      consumers, and only 11.5% of denied MA prior-auth requests are appealed
      — despite 80%+ overturn rates when appeals happen. The widely quoted
      claim that 50-65% of provider-side denials are never reworked is
      attributed to MGMA but has no publicly accessible primary source and
      should be treated as directional only.
    key_points:
      - >-
        KFF marketplace data: consumers appealed fewer than 1% of denied
        in-network claims in both 2023 (376,508 appeals out of ~86M denials)
        and 2024.
      - >-
        KFF MA data: only 11.5% of denied prior-auth requests were appealed
        in 2024, meaning ~88% of denials — most of which would likely be
        overturned — go unchallenged.
      - >-
        Premier: providers spend ~$19.7B/year adjudicating denials, and
        $10.6B of that is spent arguing claims that should have been paid at
        submission.
      - >-
        Change Healthcare/MGMA-published figure: 24% of denials are not
        recoverable at all, which bounds the theoretical maximum recovery
        from working every denial.
    cautions:
      - >-
        The "50-65% of denials never reworked (MGMA)" attribution could not
        be traced to a citable primary MGMA publication; do not present it as
        a hard benchmark.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
