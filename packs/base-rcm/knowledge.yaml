  - id: ops.group_code_liability
    title: Group codes and financial liability in denial analytics
    domains: [workflow, denials, measurement]
    aliases:
      - group code liability
      - co vs pr
      - adjustment liability
    summary: >-
      Group codes assign financial responsibility for each adjustment amount
      and therefore determine whether a balance becomes a write-off, a
      patient transfer, or neither. CO amounts are provider liability and
      cannot be billed to the patient; PR amounts may be billed to the
      beneficiary; OA amounts can be billed to neither party. Analytics that
      ignore group codes conflate contractual adjustments with true denials.
    key_points:
      - >-
        CO (contractual obligation): provider is financially liable —
        participation-agreement adjustments, late filing penalties, certain
        medical-necessity denials; the beneficiary may not be billed.
      - >-
        PR (patient responsibility): billable to the beneficiary —
        deductibles, coinsurance, and denials where a valid liability
        agreement (e.g. ABN) exists. OA (other adjustment): neither party can
        be held responsible. PI (payer-initiated reduction): payer-driven,
        not contractual.
      - >-
        The same CARC flips meaning by group — e.g. a non-covered-charge code
        under PR may transfer to the patient while the same code under CO is
        a provider write-off.
      - >-
        Denial-rate metrics should exclude routine CO contractual amounts to
        avoid overstating denials; denial write-offs at posting time should
        be forced to a denial-specific reason code, never a generic
        contractual code.
    cautions: []
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
    sources:
      - id: noridian-group-codes
        title: Claim Adjustment Group Codes
        publisher: Noridian Healthcare Solutions (Medicare Administrative Contractor)
        url: https://med.noridianmedicare.com/web/jddme/topics/ra/claim-adjustment-group-codes
        authority: medicare contractor guidance
