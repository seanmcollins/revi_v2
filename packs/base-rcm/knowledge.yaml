      Federal IDR volume runs far above original projections: 6.34 million
      disputes were initiated between April 2022 and May 2026, with roughly
      250k-314k new disputes per month in 2026. Certified IDR entities have
      largely cleared the backlog, and independent analysis of the public use
      files shows providers winning the large majority of payment
      determinations at multiples of the qualifying payment amount.
    key_points:
      - >-
        Cumulative Apr 15, 2022 - May 31, 2026 (CMS): 6,336,032 disputes
        initiated; 5,862,819 closed; 4,588,154 closed by payment
        determination; ~18% of closures found ineligible.
      - >-
        Georgetown CHIR analysis of 2025 public use files: providers won 88%
        of determinations in H1 2025 (up from 85% in 2024), with median
        awards commonly 3-9x the QPA for high-volume initiators.
      - >-
        Initiation is highly concentrated: four organizations (HaloMD, Team
        Health, Radiology Partners, SCP Health) initiated over 56% of H1 2025
        disputes.
      - >-
        Disputes are not claims — a batched dispute can contain many line
        items (capped at 50 under the 2026 ops rule); public use files lag
        about six months.
    cautions:
      - >-
        Win-rate and QPA-multiple figures are CHIR's analysis of CMS files,
