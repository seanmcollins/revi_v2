  - id: reg.cms_0057f
    title: "CMS-0057-F: prior authorization deadlines, denial reasons, and FHIR APIs"
    domains: [regulatory, prior_authorization, medicare_advantage, medicaid]
    aliases:
      - cms-0057-f
      - interoperability and prior authorization rule
      - prior authorization api
      - pa decision timeframes
    summary: >-
      The Interoperability and Prior Authorization final rule (CMS-0057-F, 89
      FR 8758, published Feb 8, 2024) binds MA organizations, Medicaid and
      CHIP FFS and managed care, and QHP issuers on federally facilitated
      exchanges. From January 1, 2026 impacted payers must decide expedited
      PA requests within 72 hours and standard requests within 7 calendar
      days, give a specific reason for every denial, and publicly report PA
      metrics; four FHIR API mandates (including the Prior Authorization API)
      generally take effect January 1, 2027. Drug prior authorizations are
      excluded throughout.
    key_points:
      - >-
        Decision timeframes from Jan 1, 2026: 72 hours expedited, 7 calendar
        days standard (medical items/services; QHP issuers exempt from the
        timeframe provisions).
      - >-
        Specific denial reasons required regardless of submission channel —
        a direct input to denial-prevention analytics and a hook for
        challenging vague determinations.
      - >-
        Public PA metrics (approvals, denials, appeal outcomes, timeframes)
        due initially by March 31, 2026 — a new benchmarking data source for
        payer-performance scoring.
      - >-
        By Jan 1, 2027: Prior Authorization API (covered-item list,
        documentation requirements, request/response with specific denial
        reasons), Provider Access API, and Payer-to-Payer API on FHIR R4.
      - >-
        HHS announced enforcement discretion for the X12 278 standard when
        payers implement FHIR-based Prior Authorization APIs.
    cautions:
      - >-
        Compliance dates vary slightly by payer type (some Medicaid managed
        care dates follow rating periods); the CMS fact-sheet URL blocks
        automated fetch — rule content verified via the Federal Register API
        and secondary analysis.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
