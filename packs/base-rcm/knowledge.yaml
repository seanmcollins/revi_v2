  - id: reg.ma_denial_oversight
    title: "MA denial oversight 2024-2026: OIG, GAO, and CMS actions"
    domains: [regulatory, medicare_advantage, denials]
    aliases:
      - ma denial audits
      - oig ma reports
      - gao ma oversight
    summary: >-
      Federal watchdogs escalated scrutiny of Medicare Advantage denials
      through mid-2026: OIG's June 2026 post-acute reports documented
      near-total reversal of appealed SNF denials, GAO pushed CMS to target
      behavioral health in program audits (implemented in 2025-2026 cycles),
      and CMS itself suspended enforcement of some CY2025
      utilization-management transparency requirements in June 2025. The
      CY2024 rule (CMS-4201-F) remains the substantive standard MA denials
      are audited against.
    key_points:
      - >-
        OIG OEI-09-24-00331 (June 2026) and companion reports: high
        post-acute denial rates, 95-97% overturn of appealed SNF denials,
        and delegated-vendor concentration (naviHealth ~50% of SNF requests).
      - >-
        GAO-25-107342 (May 2025): most large MAOs applied internal coverage
        criteria to inpatient behavioral health prior authorizations; GAO's
        recommendation that CMS target behavioral health in program-audit
        denial reviews was implemented.
      - >-
        June 16, 2025: CMS announced non-enforcement of CY2025 provisions
        requiring health-equity expertise on UM committees and public
        plan-level analyses of PA approvals and denials — reducing planned
        denial-transparency data.
      - >-
        The substantive standards remain CMS-4201-F (traditional-Medicare
        coverage criteria, 90-day continuity for approved PAs, annual UM
        committee review) plus CMS-0057-F's 2026 timeframe/denial-reason and
        2027 API requirements.
    cautions:
      - >-
        High overturn rates argue for aggressive first-level appeals on MA
        post-acute denials, but the OIG samples are narrow — do not project
        them as plan-wide rates.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
