  - id: ops.appeals_medicare_ffs
    title: "Medicare FFS appeals: five levels and deadlines"
    domains: [workflow, appeals, medicare]
    aliases:
      - medicare appeal levels
      - redetermination deadline
      - qic reconsideration
      - alj hearing
    summary: >-
      Original Medicare has a five-level appeal ladder: MAC redetermination,
      QIC reconsideration, OMHA ALJ hearing, Medicare Appeals Council review,
      and federal district court. The redetermination must be filed within
      120 days of the initial determination with no minimum dollar threshold;
      later levels carry 60-180 day windows and annually adjusted
      amount-in-controversy thresholds at levels 3 and 5.
    key_points:
      - >-
        Level 1 — MAC redetermination: file in writing within 120 days of
        receipt (notice presumed received 5 calendar days after its date);
        no minimum amount in controversy.
      - >-
        Level 2 — QIC reconsideration: file within 180 days of the
        redetermination decision; independent review of the record.
      - >-
        Level 3 — OMHA ALJ hearing: amount-in-controversy threshold applies,
        recalculated annually ($200 for CY2026). Level 5 — federal district
        court within 60 days of the Council decision ($1,900 threshold for
        CY2025).
      - >-
        Model appeal-deadline clocks per level with the 5-day receipt
        presumption, and gate level-3+ escalation on the current-year
        threshold.
      - >-
        Minor clerical errors go through reopenings rather than burning the
        formal redetermination level.
    cautions:
      - >-
        Amount-in-controversy thresholds change every calendar year; refresh
        annually from the Federal Register notice.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
    sources:
      - id: cms-ffs-appeals
        title: Original Medicare (Fee-for-service) Appeals
        publisher: CMS
        url: https://www.cms.gov/medicare/appeals-grievances/fee-for-service
