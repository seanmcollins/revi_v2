  - id: ops.credentialing_enrollment
    title: Credentialing and enrollment-lag denials
    domains: [workflow, credentialing, denials]
    aliases:
      - credentialing denials
      - enrollment lag
      - retro effective date
      - provider not credentialed
    summary: >-
      Claims billed before a payer loads a provider's effective date deny as
      "provider not enrolled/credentialed," and MGMA polling found 54% of
      practices saw such denials rise. Payers can take up to 100 days just to
      issue an effective date, sometimes with no retroactive billing allowed;
      Medicare permits retrospective billing only up to 30 days before the
      enrollment application filing date (90 in a declared disaster), while
      many commercial payers refuse retro billing entirely.
    key_points:
      - >-
        MGMA Stat (Aug 2021, 425 responses): 54% of practices reported
        credentialing-related denials increased.
      - >-
        Root causes: slow payer application processing (up to 100 days), no
        correspondence on stalled files, closed networks, and payer-side
        errors (dropped providers, wrong taxonomy).
      - >-
        Medicare: retrospective billing limited to 30 days before the
        application filing date (90 days for declared disasters) under 42 CFR
        424.521 — file enrollment before the provider's start date.
      - >-
        Many commercial payers do not honor retroactive effective dates —
        hold claims rather than release them to certain denial.
      - >-
        Controls: start enrollment 120-180 days pre-start, hold claims by
        payer-specific effective-date logic, calendar recredentialing dates,
        and appeal enrollment denials where the payer caused the delay. A
        dated (2019) estimate puts onboarding delay near $10,122 lost per
        physician per day.
    cautions:
      - >-
        The eCFR page for 424.521 blocked automated fetch; confirm the 30/90
        day rule against current regulation text. The $10,122/day figure is a
        2019 single-survey estimate.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
    sources:
      - id: mgma-credentialing-denials
        title: More than half of practices report credentialing-related denials on the rise in 2021
        publisher: MGMA
        url: https://www.mgma.com/mgma-stat/more-than-half-of-practices-report-credentialing-related-denials-on-the-rise-in-2021
        authority: professional association poll (primary)
        last_verified_at: 2026-08-07
