  - id: benchmark.final_denial_rate
    title: Final (net) denial rates and denial-driven revenue leakage
    domains: [benchmarks, denials, write_offs]
    aliases:
      - final denial rate benchmark
      - net denial rate
      - denial revenue leakage
    summary: >-
      While most initial denials are eventually paid, the share written off
      as final denials is rising fast. Kodiak reports the median final denial
      rate rose from 2.5% of net revenue in 2024 to 2.7% in 2025, and
      combined losses from final denials plus patient bad debt grew 25% to
      over $48 billion across 2,300+ hospitals in 2025. Clinical denial
      categories (prior authorization and medical necessity) drove virtually
      all of the increase.
    key_points:
      - >-
        Kodiak (Mar 2026): median final denial rate 2.5% (2024) to 2.7%
        (2025); median bad debt rate 1.1% to 1.3%; combined net revenue
        losses $38.6B (2024) to $48B+ (2025) across 2,300+ hospitals.
      - >-
        Kodiak (May 2024): final denial rate for inpatient claims rose 51%
        from 2021 to 2023, draining an estimated $1.2B in revenue.
      - >-
        Crowe (Q1 2023): 8 cents of every dollar billed to commercial payers
        is never received or is taken back (bad debt + final denials +
        takebacks combined).
      - >-
        Final denial rate (net %) runs roughly one-quarter of the initial
        denial rate (~2.5-2.7% vs ~11.8-12%), quantifying how much of the
        denial burden is recoverable rework vs true loss.
    cautions:
      - >-
        The March 2026 Kodiak release was verified via a syndicated copy
        (businesswire.com itself timed out); figures match Healthcare Finance
        News coverage.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
    sources:
