      - denial trend surveys
      - experian state of claims
      - mgma denial polls
      - denials increasing
    summary: >-
      Survey data consistently shows providers experiencing denial
      escalation: roughly three in four providers told Experian in 2024 that
      denials are increasing, the share of providers with denial rates of
      10%+ grew from 30% (2022) to 41% (2025), and MGMA's 2024 polling found
      60% of medical groups reporting rising denials. These are perception
      and share-of-provider measures — useful context alongside, never in
      place of, claims-based rates.
    key_points:
      - >-
        Experian State of Claims 2024 (n=210 revenue-cycle staff): ~3 in 4
        say denials are increasing (+31% vs 2022); 77% say payer policy
        changes are more frequent; 67% say time to reimbursement is
        increasing.
      - >-
        Experian 2025 (3rd annual wave): 41% of providers face denial rates
        of 10%+ — an all-time high for the series; intake data errors are now
        the third most common denial cause.
      - >-
        MGMA Stat (Mar 2024): 60% of medical group leaders reported rising
        denial rates; only 11% achieved reductions, crediting front-desk
        training, denials task forces, and tightened eligibility and
        authorization processes.
      - >-
        Top provider-reported causes (Experian): missing or inaccurate data,
        authorizations, incomplete patient information — consistent with
        Optum's front-end root-cause data.
    cautions:
      - >-
        Survey percentages measure the share of providers reporting a trend,
        not claim-level rates; do not blend with Kodiak/Optum denial-rate
        benchmarks.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
