        title: "Fact Sheet: Prompt Payment Standards in Medicare Advantage (May 2026)"
        publisher: American Hospital Association
        url: https://www.aha.org/system/files/media/file/2026/05/fact-sheet-prompt-payment-standards-in-medicare-advantage.pdf
        authority: national trade association fact sheet
