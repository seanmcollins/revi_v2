  - id: ops.root_cause_carc_mapping
    title: "Root-cause mapping: CARC codes to upstream process failures"
    domains: [workflow, denials, prevention]
    aliases:
      - carc root cause map
      - denial root cause mapping
      - carc to process map
    summary: >-
      Claim adjustment reason codes, read together with group codes and
      remark codes, map denials to the upstream process that failed. The
      canonical mappings: 197 to the authorization workflow, 22 to COB/MSP
      data capture, 29 to billing timeliness, 16 to claim data quality, and
      96/50 to benefit verification and medical-necessity alignment. A CARC
      alone is often ambiguous — codes 16 and 96 require companion remark
      codes to identify the specific defect.
    key_points:
      - >-
        CARC 197 (authorization or precertification missing) maps to patient
        access — an authorization was never obtained or notification was
        missed — distinct from a data-quality denial where an obtained auth
        number was merely omitted from the claim.
      - >-
        CARC 22 (another payer may be responsible under coordination of
        benefits) maps to registration-time COB capture; Medicare contractors
        advise prevention via a completed MSP questionnaire and payer-status
        verification before submission.
      - >-
        CARC 29 (filing deadline passed) maps to billing/follow-up
        timeliness; it is a hard denial generally only overturnable with
        proof of timely original submission.
      - >-
        CARC 16 (claim missing information or containing submission errors)
        maps to claim data quality and edit coverage; remark-code parsing is
        mandatory to identify the missing field.
      - >-
        CARC 96 (charges not covered) maps to benefit verification; CARC 50
        (payer deems the service not medically necessary) maps to
        coverage-criteria alignment and clinical documentation.
      - >-
        Root-cause attribution needs the CARC + group code + RARC triplet
        plus payer context; the same CARC under different group codes implies
        different liability and different corrective owners.
    cautions: []
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
