  - id: ops.denial_staffing
    title: "Denial operations staffing: investigation model, not processing model"
    domains: [workflow, denials]
    aliases:
      - denial staffing
      - denials task force
      - denial processing vs management
    summary: >-
      AAPC's guidance draws a hard line between denial management (root-cause
      investigation requiring coding, documentation, and billing expertise
      with cross-functional coordination) and denial processing (mechanically
      resubmitting, attaching records, and hoping for reversal). Assigning
      denials to undertrained entry-level staff loses revenue and raises
      audit risk; work should be routed by required skill level, with
      clinical and coding-intensive denials handled by credentialed staff.
    key_points:
      - >-
        Denial management is investigative: verify whether coding,
        documentation, and diagnosis actually support payment before
        resubmitting or appealing — blind resubmission and reflexive records
        release are processing, not management.
      - >-
        Anti-patterns: changing modifiers without evaluating applicability,
        resubmitting claims unreviewed, fulfilling payer record requests
        without evaluating the documentation, treating appeals as
        administrative busywork.
      - >-
        Organizational patterns credited with reductions include dedicated
        denials task forces spanning front desk, clinical documentation,
        eligibility, and authorization functions (MGMA).
      - >-
        Public accounts-per-FTE productivity benchmarks are not available
        from open association content (MGMA DataDive and HFMA benchmarking
        are paywalled); skill-based routing and outcome KPIs (overturn rate,
        touches per resolved denial) are the citable alternatives.
    cautions: []
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
