  - id: reg.carc_rarc_licensing
    title: "CARC/RARC stewardship: X12 maintenance, CORE code combinations, licensing"
    domains: [regulatory, edi, denials]
    aliases:
      - carc licensing
      - x12 licensing
      - core code combinations
      - core 360
    summary: >-
      X12 maintains the claim adjustment reason codes and remittance advice
      remark codes used in every 835; group codes assign financial liability.
      The lists are freely viewable on x12.org, but X12 asserts exclusive
      copyright and runs a multi-tier licensing program for products that
      embed or redistribute the code lists. The federally mandated CORE rule
      constrains which CARC/RARC combinations payers may use, organized into
      four business scenarios, with the combinations document updated three
      times a year.
    key_points:
      - >-
        X12 updates the CARC/RARC lists roughly three times per year via a
        public maintenance process; codes carry start/modified/stop dates
        that matter for historical claim data.
      - >-
        Licensing: public viewability is not a redistribution license —
        embedding the lists in commercial software or distributing them to
        third parties requires an X12 Commercial Use license (Internal
        Use and Developer tiers cover other cases).
      - >-
        The CAQH CORE uniform-use rule (835) is federally mandated under ACA
        section 1104: payer CARC/RARC pairs must fit CORE-defined business
        scenarios; current combinations version is February 2026 v3.10.0.
      - >-
        The 2026 IDR Operations rule will additionally require designated
        CARCs/RARCs to flag NSA-subject out-of-network claims — new
        regulatory semantics layered onto 835 parsing.
      - >-
        Revi practice: this pack paraphrases code meanings in its own words
        and never reproduces licensed X12 text; an RCM product shipping code
        descriptions should confirm its licensing posture.
    cautions:
      - >-
        CORE code-combination conformance is a floor for payers, not a
        guarantee — nonstandard local codes still appear in the wild.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
