  - id: benchmark.denial_avoidability
    title: Denial root causes, avoidability, and recoverability
    domains: [benchmarks, denials, prevention]
    aliases:
      - avoidable denial share
      - preventable denial share
      - denial root cause benchmark
    summary: >-
      Both major clearinghouse analyses agree that most denials originate in
      the front end of the revenue cycle and the great majority are
      preventable. Optum's 2024 index attributes 44% of 2023 denials to
      front-end issues, with registration/eligibility the single largest
      cause (24.3%), and finds 84% of denials potentially avoidable — though
      22% of avoidable denials cannot be recovered once they occur.
    key_points:
      - >-
        Optum 2024 Denials Index (2023 data): registration/eligibility
        24.33%, missing or invalid claim data 15.89%,
        authorization/precertification 12.80%, medical documentation
        requested 12.08%, service not covered 9.67%, medical necessity 6.76%.
      - >-
        By revenue-cycle stage (2023): front end 44%, back end 32%, mid-cycle
        16%, unknown 8% — the front-end share has been 41-46% in every period
        since 2019.
      - >-
        84% of denials are potentially avoidable, but 22% of those avoidable
        denials are not recoverable once denied (Optum, 2023); an earlier
        Change Healthcare analysis put avoidability at 86%.
      - >-
        HFMA-published guidance holds roughly 90% of denials preventable and
        about two-thirds of preventable denials successfully appealable.
      - >-
        Kodiak (2024): authorization-related denials fell 7.7% while
        medical-necessity (+5%) and records-request (+5.4%) denials rose —
        the avoidability mix is shifting toward harder clinical categories.
    cautions: []
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
    sources:
      - id: optum-denials-index-2024
        title: The Optum 2024 Revenue Cycle Denials Index
        publisher: Optum (formerly Change Healthcare)
        url: https://marketplace.optum.com/content/dam/change-healthcare/marketplace-assets/outcomes-and-insights/2024-denials-index.pdf
        authority: clearinghouse claims analysis (primary)
        effective_from: 2023-01-01
