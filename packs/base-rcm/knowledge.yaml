  - id: payer.ma.post_acute_denials
    title: "MA post-acute care: the highest denial rates and near-total reversal on appeal"
    domains: [payer_behavior, medicare_advantage, prior_authorization]
    aliases:
      - post-acute denials
      - SNF denials
      - navihealth denials
      - IRF LTCH denials
    summary: >-
      Post-acute care is the sharpest MA denial hotspot. KFF found 2024 PA
      denial rates of 65% for long-term care hospitals, 54% for inpatient
      rehabilitation, and 12% for skilled nursing versus an overall rate
      under 8%. A June 2026 OIG data brief found MA organizations overturned
      95% of appealed SNF admission denials, strongly suggesting
      inappropriate initial denials. Delegated utilization-management vendors
      and nursing-home-resident populations show distinctly worse patterns.
    key_points:
      - >-
        2024 MA prior authorization denial rates by setting: LTCH 65%, IRF
        54%, SNF 12%, vs under 8% overall (KFF, July 2026); appealed denials
        were overturned at 95% (SNF), 43% (IRF), and 36% (LTCH).
      - >-
        OIG (OEI-09-24-00331, June 2026): across 19 MAOs in June 2024, 12% of
        SNF admission requests were denied (range 0.4%-23%); 18% of denials
        were appealed and 95% of appeals were overturned.
      - >-
        naviHealth (UnitedHealth-owned delegated UM vendor) processed roughly
        half of SNF requests, denied 14% (vs 11% for internal MAO review),
        and had 97% of its appealed denials overturned.
      - >-
        Nursing home residents were denied SNF admission at 40% vs 11% for
        other enrollees.
      - >-
        RCM implication: aggressively appeal post-acute denials and track
        denials by delegated UM vendor, not just by plan.
    cautions:
      - >-
        OIG denial/overturn statistics are single-month (June 2024) and
        post-acute-specific; they are not plan-wide denial rates.
