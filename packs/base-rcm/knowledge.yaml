  - id: reg.cms_4201f
    title: "CMS-4201-F: MA plans must follow traditional Medicare coverage criteria"
    domains: [regulatory, medicare_advantage, prior_authorization]
    aliases:
      - cms-4201-f
      - cy2024 ma rule
      - two-midnight rule MA
      - ma coverage criteria rule
    summary: >-
      The CY2024 MA final rule (CMS-4201-F, 88 FR 22120), with
      utilization-management provisions applicable to coverage beginning
      January 1, 2024, requires MA plans to make medical-necessity
      determinations per traditional Medicare coverage criteria (statutes,
      NCDs, LCDs), which brings the two-midnight inpatient benchmark into MA.
      Internal coverage criteria are allowed only where Medicare criteria are
      not fully established, must be evidence-based and publicly accessible,
      and algorithms or AI cannot substitute for individual patient review.
      This is the strongest regulatory hook for appealing MA
      medical-necessity denials and observation downgrades.
    key_points:
      - >-
        42 CFR 422.101(c): determinations must consider individual
        circumstances, physician recommendation, and clinical notes, applying
        fully established traditional Medicare coverage criteria.
      - >-
        Internal coverage criteria are permitted only when Medicare criteria
        are not fully established, must rest on widely used treatment
        guidelines or clinical literature, and must be publicly accessible
        (no paywall) per the CMS FAQ memo of Feb 6, 2024.
      - >-
        Algorithms and AI may assist but cannot be the basis to deny
        inpatient admission, downgrade to observation, or terminate
        post-acute services; individual reassessment is required.
      - >-
        If a patient meets coverage criteria for a physician-ordered
        post-acute setting, the MA plan cannot deny admission or redirect to
        a different setting; screening tools like MCG/InterQual cannot
        override the regulation for status determinations.
      - >-
        RCM lever: cite 422.101(b)/(c), the two-midnight benchmark, and the
        Feb 2024 FAQ in inpatient-status and post-acute appeals.
    cautions: []
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
