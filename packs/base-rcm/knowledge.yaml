  # ==================================================================
  # ops.* — denial and appeal operations
  # ==================================================================
  - id: ops.denial_taxonomy
    title: "Denial taxonomy in practice: recoverability, cause type, preventability"
    domains: [workflow, denials, measurement]
    aliases:
      - denial classification
      - denial types elaborated
      - hard vs soft denials
      # deliberate concept overlap: the concept defines, this card elaborates
      - soft denial
      - hard denial
    summary: >-
      Denials should be classified on three axes that drive different
      workflows: recoverability (soft denials are correctable and
      resubmittable; hard denials require formal appeal or become
      write-offs), cause type (clinical vs administrative/technical), and
      preventability. HFMA-published guidance holds that roughly 90% of
      denials are preventable and about two-thirds of those are recoverable
      on appeal, so classification is the entry point for both recovery
      routing and prevention analytics.
    key_points:
      - >-
        Soft denial: payer contests specific data points and payment is
        recoverable via correction or resubmission, often within short
        windows. Hard denial: firm refusal (medical necessity, non-covered
        service, expired filing) requiring formal appeal, frequently
        abandoned as lost revenue.
      - >-
        Distinguish front-end rejections (never adjudicated) from true
        denials (adjudicated and deemed unpayable) — they need separate
        metrics and queues (HBMA).
      - >-
        Cause-type split: administrative/technical (coding errors,
        duplicates, late filing, wrong identifiers, missing authorization)
        vs clinical (medical necessity, insufficient documentation).
      - >-
        HFMA figures imply roughly 60% of all denials are recoverable and
        ~30% are permanently lost prevention failures.
      - >-
        Analytics use: tag every denial with recoverability class, cause
        type, and a preventable flag so recovery queues, appeal triage, and
        prevention feedback loops can each be measured separately.
    cautions:
      - >-
