  - id: payer.ma.prior_auth_appeal_gap
    title: "MA prior authorization: volume, denial rates, and the appeal-overturn gap"
    domains: [payer_behavior, medicare_advantage, prior_authorization, appeals]
    aliases:
      - MA prior auth denials
      - MA PA appeal gap
      - prior auth overturn gap
    summary: >-
      MA insurers made nearly 53 million prior authorization determinations
      in 2024 (about 1.7 per enrollee) and denied 7.7% in full or in part, up
      from 6.4% in 2023. Only 11.5% of denials were appealed, yet 80.7% of
      appeals were partially or fully overturned. Most MA PA denials die
      unchallenged even though appeals succeed at very high rates, so
      systematic appeal workflows are among the highest-yield denial
      interventions.
    key_points:
      - >-
        52.9M prior authorization determinations in 2024, up from 49.8M in
        2023; 7.7% (4.1M) fully or partially denied vs 6.4% in 2023 and 7.4%
        in 2022 (KFF analysis of CMS data).
      - >-
        Only 11.5% of denied requests were appealed in 2024 (up from 7.5% in
        2019); 80.7% of appealed denials were partially or fully overturned.
      - >-
        Traditional Medicare required prior authorization for far fewer
        services (~625,000 requests in FY2024) but denied 22.9% of them —
        a much narrower base, not comparable to overall claim denial rates.
      - >-
        A 2018 HHS OIG audit estimated 75% of MA care denials from 2014-2016
        were eventually overturned on appeal.
      - >-
        Operational takeaway: the low appeal rate combined with the 80%+
        overturn rate means unappealed MA denials are largely recoverable
        revenue left on the table.
    cautions: []
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
