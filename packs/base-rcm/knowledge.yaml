  - id: payer.ma.oig_inappropriate_denials
    title: "OIG findings: MA plans deny care and payment that meet Medicare coverage rules"
    domains: [payer_behavior, medicare_advantage, regulatory]
    aliases:
      - OIG MA denials report
      - inappropriate MA denials
      - OEI-09-18-00260
    summary: >-
      HHS OIG's April 2022 report (OEI-09-18-00260) reviewed denials by 15
      large MA organizations and found 13% of denied prior authorization
      requests and 18% of denied payment requests actually met Medicare
      coverage and billing rules. Denials stemmed from plans layering
      clinical criteria beyond Medicare rules, demanding documentation that
      was already sufficient, and manual or system errors. This is the
      canonical citation when appealing MA denials that would have paid under
      original Medicare.
    key_points:
      - >-
        13% of prior authorization denials in the OIG sample met Medicare
        coverage rules and would likely have been approved under traditional
        Medicare.
      - >-
        18% of payment denials met both Medicare coverage rules and MA
        billing rules; many were caused by manual review and claims-system
        processing errors.
      - >-
        Plans applied clinical criteria not found in Medicare coverage rules
        (e.g. requiring an x-ray before approving advanced imaging) and
        denied for "insufficient documentation" when OIG physician reviewers
        found the records adequate.
      - >-
        Most commonly affected: advanced imaging (MRI) and post-acute
        facility stays (e.g. inpatient rehabilitation).
      - >-
        OIG's recommendations were implemented by CMS and fed into the CY2024
        rule (CMS-4201-F).
    cautions:
      - >-
        Figures come from a stratified random sample of 500 cases — treat as
        directional, not a population rate.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
