  - id: reg.medicaid_unwinding
    title: Medicaid unwinding aftermath and the coming six-month redetermination regime
    domains: [regulatory, medicaid, eligibility]
    aliases:
      - medicaid unwinding
      - redetermination churn
      - procedural disenrollment
      - continuous enrollment unwind
    summary: >-
      The post-pandemic unwinding (April 2023 through late 2024) disenrolled
      over 25 million people from Medicaid — about 31% of completed
      redeterminations — mostly for paperwork/procedural reasons rather than
      confirmed ineligibility. Many disenrolled patients remained eligible
      and later re-enrolled, often retroactively. The 2025 reconciliation law
      (H.R. 1) makes churn structural: expansion adults face six-month
      redeterminations and 80-hour/month work requirements from around
      December 31, 2026.
    key_points:
      - >-
        KFF final tally (Sept 2024): 25M+ disenrolled, 56M+ renewed; 31% of
        completed redeterminations ended in disenrollment, ranging from under
        20% in five states to over 50% in five states; roughly 69% of losses
        were procedural.
      - >-
        GAO-25-107413 (June 2025): about 27 million disenrolled in the first
        18 months; enrollment stood near 79 million in Oct 2024, ~10% above
        pre-pandemic.
      - >-
        RCM playbook: real-time eligibility checks at scheduling and service,
        monitor for retroactive reinstatement before writing off eligibility
        denials, delay self-pay conversion until retro eligibility is ruled
        out, and use retroactive-eligibility exceptions to timely filing
        where available.
      - >-
        H.R. 1: six-month redeterminations for expansion adults (renewals
        scheduled on/after Dec 31, 2026) and 80-hour/month community
        engagement requirements — model eligibility-denial rates as a
        persistent policy-driven baseline, not a one-time unwinding artifact.
    cautions:
      - >-
        State-level variation is extreme — national averages mislead for
        state-specific payer-mix models.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
    sources:
