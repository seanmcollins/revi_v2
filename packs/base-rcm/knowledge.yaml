    summary: >-
      KFF's analysis of CMS transparency-in-coverage data shows
      HealthCare.gov insurers denied about 20% of in-network claims in 2023
      and 19% in 2024, with enormous insurer-level variation (1% to 54% in
      2023). Consumers appealed fewer than 1% of denials, and insurers upheld
      most appeals they received — making the marketplace the
      best-documented example of denials that are never contested.
    key_points:
      - >-
        2023: 20% of 436M in-network claims denied; 36% of out-of-network
        claims denied; insurer-level rates ranged 1-54%; state averages 6%
        (SD) to 34% (AL).
      - >-
        2024: 19% of 451M in-network claims denied; 37% out-of-network; 157
        reporting insurers.
      - >-
        Consumers appealed fewer than 1% of denied in-network claims in both
        years; insurers upheld 56% of internal appeals in 2023 and 66% in
        2024.
      - >-
        Most common denial reasons (2024): "other" 36%, administrative 25%,
        excluded service 13%, lack of prior auth or referral 9%, medical
        necessity 5% — public data gives limited insight into true root
        causes.
      - >-
        This plan-reported federal data covers HealthCare.gov issuers only;
        it is the closest thing to a public regulator-collected denial-rate
        dataset for any commercial segment.
