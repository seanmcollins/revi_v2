  - id: reg.medicare_timely_filing_coverage
    title: "Traditional Medicare: 12-month filing limit and LCD/NCD coverage denials"
    domains: [regulatory, medicare, timely_filing, denials]
    aliases:
      - medicare timely filing
      - lcd
      - ncd
      - abn
      - local coverage determination
    summary: >-
      Medicare FFS claims must reach the MAC within one calendar year of the
      date of service or they are denied outright, with only narrow
      CMS-defined exceptions. Coverage denials are driven by national
      coverage determinations (NCDs) and MAC-specific local coverage
      determinations (LCDs) — the same code and diagnosis can pay in one
      jurisdiction and deny in another. Diagnosis-driven medical-necessity
      edits deny automatically, and patient liability turns on whether a
      valid Advance Beneficiary Notice was obtained.
    key_points:
      - >-
        All claims for services on or after Jan 1, 2010 must be filed within
        12 months of the date of service (ACA sec. 6404); there is no grace
        period, and late claims deny under the timely-filing reason code
        (CARC 29 — filing deadline passed).
      - >-
        Exceptions are limited to CMS-defined circumstances: administrative
        or government error, retroactive Medicare entitlement (including with
        Medicaid recoupment), and retroactive disenrollment from an MA plan.
      - >-
        NCDs bind all MACs nationally; where no NCD is on point, each MAC's
        LCDs control — creating jurisdiction-level variation in what
        diagnoses support medical necessity. Scrubbing charge entry against
        LCD diagnosis lists is the primary prevention.
      - >-
        Patient liability requires a properly executed ABN before service
        (billed with the GA modifier); without it the provider absorbs the
        denial.
    cautions:
      - >-
        The CMS coverage-determination page blocked automated fetch; LCD/NCD
        mechanics corroborated via the verified MAC page and CMS-4201-F FAQ.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
    sources:
