  - id: benchmark.cost_to_collect_admin_burden
    title: Cost to collect, denial rework cost, and administrative burden
    domains: [benchmarks, cost_to_collect]
    aliases:
      - cost to collect benchmark
      - cost to rework a denial
      - administrative cost benchmark
      - caqh index
    summary: >-
      Publicly citable cost figures anchor at the transaction and program
      level rather than a cost-to-collect percentage: reworking a denied
      claim costs about $25 (MGMA-published) to $44 (Premier), providers
      spend roughly $19.7B a year adjudicating denials, and the CAQH Index
      sizes remaining administrative automation savings at $20B annually.
      AHA reports administrative activities now consume over 40% of hospital
      expense.
    key_points:
      - >-
        Premier (2023 survey): average cost to fight a denied claim is
        $43.84 ($47.77 for MA claims); ~$19.7B/year spent on denial
        adjudication, $10.6B of it on claims that should have been paid
        initially.
      - >-
        MGMA-published figure: average cost to rework a single denied claim
        is $25.20.
      - >-
        AHA (Sept 2024): administrative costs exceed 40% of total hospital
        expense; a cited McKinsey estimate puts hospital billing-and-
        collections spend near $40B/year.
      - >-
        CAQH Index 2024 (600+ provider organizations plus plans covering 63%
        of insured lives): $20B/year further savings available from
        converting manual transactions to electronic; automation already
        avoided $222B; full automation saves ~70 minutes per patient visit.
      - >-
        The often-quoted "cost to collect = 2-4% of net patient revenue"
        traces to trade reporting; HFMA MAP Keys defines Cost to Collect
        (FM-6/FM-7) but published medians are members-only.
    cautions:
      - >-
        CAQH's blog URL on caqh.org now redirects to dataspring.com; the
        full 2024 Index PDF exists on caqh.org but was not load-verified.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
