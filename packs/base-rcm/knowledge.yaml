  - id: reg.irs_501r
    title: "IRC 501(r): charity care, AGB limits, and collection restrictions"
    domains: [regulatory, patient_collections]
    aliases:
      - 501r
      - 501(r)
      - financial assistance policy
      - extraordinary collection actions
      - charity care rules
    summary: >-
      Section 501(r) conditions hospital tax exemption on maintaining a
      written financial assistance policy (FAP), limiting charges to
      FAP-eligible patients to amounts generally billed (AGB), and making
      reasonable efforts to determine FAP eligibility before any
      extraordinary collection action (ECA). The regulations define a 120-day
      notification period and a 240-day application period from the first
      post-discharge billing statement, and hold hospitals accountable for
      the conduct of collection agencies and debt buyers.
    key_points:
      - >-
        ECAs include credit bureau reporting, debt sales, liens, lawsuits,
        wage garnishment, and deferring or denying care over prior unpaid
        bills.
      - >-
        No ECAs during the first 120 days after the first post-discharge
        billing statement, and at least 30 days' written notice before
        initiating ECAs; FAP applications must be accepted for at least 240
        days, with incomplete applications suspending ECAs.
      - >-
        Debt sales are generally ECAs unless a binding agreement bars the
        purchaser from ECAs and makes debt returnable on FAP-eligibility
        determination; hospitals are responsible for ECAs by their debt
        collectors and buyers.
      - >-
        For denial and A/R analytics: 501(r) status shapes how self-pay and
        patient-responsibility balances can be pursued and when accounts may
        lawfully move to collections — a compliance overlay on patient-
        balance aging.
    cautions: []
