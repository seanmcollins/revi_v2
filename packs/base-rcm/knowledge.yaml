  - id: benchmark.days_in_ar
    title: "Days in A/R: published direction and definitional authority"
    domains: [benchmarks, accounts_receivable, measurement]
    aliases:
      - days in ar benchmark
      - ar days benchmark
      - days in ar trend
    summary: >-
      No authoritative source publishes a stable national median for net days
      in A/R — HFMA MAP Keys (FM-1) defines the metric but its benchmark
      values are member data. What is publicly citable is direction (Kodiak
      reports true A/R days grew 5.2% year over year in 2024) plus broad
      trade-press guidance ranges (30-40 days preferable, below 50 minimum
      acceptable) that carry lower evidentiary weight.
    key_points:
      - >-
        Kodiak (2024 full year, 2,100+ hospitals): true A/R days grew 5.2%
        year over year; as of October 2024 they were up 2.2% YoY and 5.4%
        year to date.
      - >-
        HFMA MAP Keys is the definitional standard (Net Days in A/R is FM-1);
        published MAP medians are members-only.
      - >-
        Trade reporting (TechTarget, citing AAFP guidance) quotes 30-40 days
        as preferable and under 50 as the minimum acceptable — guidance-tier
        figures, not measured medians.
      - >-
        For Revi: benchmark direction (rising) and aged-over-90 shares are
        citable; treat absolute day-count "industry medians" circulating in
        vendor blogs as folklore.
    cautions:
      - >-
        Revi's days_in_ar contract is a billed-weighted aging variant, not
        MAP FM-1's net-revenue form; compare against external figures with
        that label attached.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
