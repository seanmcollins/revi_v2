  - id: ops.appeals_commercial
    title: "Commercial appeals under the ACA: internal appeal then external review"
    domains: [workflow, appeals, commercial]
    aliases:
      - aca appeals
      - internal appeal
      - external review
    summary: >-
      ACA-governed plans must offer an internal appeal, filed within 180 days
      of the denial notice, followed by an independent external review
      requested within four months of the final internal denial. External
      review covers denials involving medical judgment,
      experimental/investigational determinations, and rescissions, and its
      decision is binding on the insurer. Reviews run through state
      processes, HHS-administered federal review, or contracted independent
      review organizations.
    key_points:
      - >-
        Internal appeal: within 180 days of the denial notice; insurers must
        issue denial notices within 15 days (prior authorization), 30 days
        (services received), or 72 hours (urgent).
      - >-
        External review: written request due within four months of the final
        adverse determination; the reviewer's decision is binding by law.
        Urgent situations allow concurrent internal and external review.
      - >-
        External-review scope: medical judgment, experimental or
        investigational determinations, and rescissions — pure contractual or
        administrative denials generally do not qualify.
      - >-
        These are member-appeal protections; provider-initiated dispute
        rights on commercial claims are contractual (provider-manual
        reconsideration and appeal tiers) and typically shorter, e.g. 120-180
        days from the explanation of payment.
      - >-
        The HHS-administered federal external review process was flagged
        temporarily unavailable as of July 1, 2026.
    cautions: []
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
