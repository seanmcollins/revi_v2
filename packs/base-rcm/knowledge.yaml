  - id: ops.map_keys_measurement
    title: "Measurement framework: MAP Keys for denial and A/R analytics"
    domains: [workflow, measurement]
    aliases:
      - map keys for denials
      - denial kpis
      - kpi framework
      # deliberate concept overlap: the concept defines, this card elaborates
      - map keys
    summary: >-
      HFMA's MAP Keys are the industry-standard revenue-cycle KPI
      definitions: 29 metrics across Patient Access, Pre-Billing, Claims,
      Account Resolution, and Financial Management. For denial analytics the
      load-bearing keys are CL-1 (clean claim rate), AR-5 (remittance denial
      rate), AR-6 (denial write-offs), and the aged A/R keys; using MAP
      definitions makes internal metrics benchmarkable against industry
      norms. Benchmark values, however, are member data and not freely
      published.
    key_points:
      - >-
        CL-1 clean claim rate: claims requiring no manual intervention — the
        standard numerator/denominator for edit effectiveness.
      - >-
        AR-5 remittance denial rate (claims denied over claims remitted) is
        the standard initial-denial outcome measure; AR-6 denial write-offs
        (net dollars written off as denials relative to revenue) is the
        standard failed-recovery measure.
      - >-
        Aged A/R keys (AR-1..AR-4) standardize aging-bucket analysis by payer
        group; MGMA better performers hold over 70% of A/R under 30 days and
        only 8.1% over 120 days (dated 2021 report, 2020 data).
      - >-
        Recommended usage for Revi: align metric formulas to MAP Key
        definitions, then benchmark values against the citable
        Kodiak/Crowe/Optum/KFF figures in the benchmark cards.
    cautions:
      - >-
        HFMA MAP medians and quartiles are members-only; public articles cite
        directional changes, not stable absolute medians.
