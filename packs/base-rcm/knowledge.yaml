  - id: payer.medicaid.denials_oversight
    title: "Medicaid behavior: high MCO denial rates, weak oversight, short filing windows"
    domains: [payer_behavior, medicaid, denials, timely_filing]
    aliases:
      - medicaid denial rate
      - medicaid mco denials
      - medicaid timely filing
    summary: >-
      The federal OIG found Medicaid MCOs denied one in eight (12.5%) prior
      authorization requests in 2019 — about double the MA rate that year —
      with a dozen plans denying over 25% and limited state oversight of
      denials. On the claims side, Premier's survey found Medicaid the
      highest-denying payer category (16.7% FFS, 15.1% managed). Layered on
      top, Medicaid timely filing is a trap: state FFS windows range from
      90-95 days to 12 months, and MCOs impose their own, often shorter,
      contractual deadlines.
    key_points:
      - >-
        HHS OIG (OEI-09-19-00350, July 2023): the 115 MCOs studied (7 parent
        companies, 37 states, 29.8M enrollees) denied 12.5% of prior
        authorization requests in 2019; 12 MCOs exceeded 25%.
      - >-
        Unlike Medicare Advantage, most states do not routinely review the
        appropriateness of MCO denials, and enrollees have limited access to
        external medical review.
      - >-
        Premier survey (2023): Medicaid FFS 16.7% and managed Medicaid 15.1%
        initial claim denial rates — both above the ~15% private-payer
        average; Medicaid denials skew administrative/eligibility-driven,
        high-volume but lower dollar value.
      - >-
        Timely filing varies sharply by state (e.g. Texas 95 days, New York
        90, many states 12 months); MCO contractual deadlines (commonly
        90-180 days) are separate and the shorter deadline controls.
    cautions:
      - >-
        State filing windows come from an industry aggregator and change;
        verify against the state Medicaid manual and MCO contract before
        relying on a specific deadline.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
