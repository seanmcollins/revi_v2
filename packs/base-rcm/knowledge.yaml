  - id: reg.erisa_claims_appeals
    title: ERISA claims and appeals deadlines for group health plans (29 CFR 2560.503-1)
    domains: [regulatory, commercial, appeals]
    aliases:
      - erisa claims procedure
      - erisa appeal deadlines
      - dol claims regulation
    summary: >-
      The DOL claims-procedure regulation sets the minimum adjudication and
      appeal timelines for ERISA plans, which govern most employer-sponsored
      commercial coverage. Group health plans must decide urgent claims in 72
      hours, pre-service claims in 15 days, and post-service claims in 30
      days (each with limited extensions), and must give claimants at least
      180 days to appeal an adverse benefit determination. Appeal reviews
      must be independent and de novo; procedural failures let claimants deem
      remedies exhausted.
    key_points:
      - >-
        Initial determinations: urgent 72 hours; pre-service 15 days (+15-day
        extension); post-service 30 days (+15-day extension);
        missing-information notices give claimants at least 45 days, tolling
        the clock.
      - >-
        Appeals: at least 180 days after an adverse determination for group
        health plans; appeal decisions due in 72 hours (urgent), 30 days
        (pre-service), 60 days (post-service), halved per level for two-level
        plans.
      - >-
        Review must not defer to the initial determination and must be
        conducted by a different named fiduciary; medical-judgment denials
        require consultation with an appropriately trained health
        professional.
      - >-
        Denial notices must state specific reasons, cite plan provisions, and
        disclose any internal rule or medical-necessity criteria relied upon.
      - >-
        For provider-side RCM: deadlines run for the claimant (providers
        typically appeal under assignment/authorized-representative status),
        and self-funded plan appeal SLAs are governed by this regulation
        rather than state prompt-pay laws.
    cautions: []
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
    sources:
      - id: ecfr-2560-503-1
        title: 29 CFR 2560.503-1 - Claims procedure (current eCFR)
        publisher: eCFR (U.S. Department of Labor)
        url: https://www.ecfr.gov/current/title-29/subtitle-B/chapter-XXV/subchapter-G/part-2560/section-2560.503-1
        authority: federal regulation (primary)
