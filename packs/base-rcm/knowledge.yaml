  - id: ops.write_off_governance
    title: "Write-off governance: categories, small-balance thresholds, approval tiers"
    domains: [workflow, write_offs]
    aliases:
      - write-off policy
      - small balance threshold
      - write-off approval
      # deliberate concept overlap: the concept defines, this card elaborates
      - denial write-off
    summary: >-
      Sound write-off governance separates write-offs into reason-coded
      categories (contractual, bad debt, charity, administrative, small
      balance, timely filing, uncredentialed provider), sets a small-balance
      threshold below which collection is not cost-effective, and requires
      tiered documented approval with segregation of duties and periodic
      audit. The essential analytics split is avoidable vs unavoidable
      write-offs: HFMA MAP Key AR-6 tracks denial write-offs specifically so
      preventable leakage is not buried inside contractual adjustments.
    key_points:
      - >-
        Maintain distinct write-off reason codes — each category carries
        different compliance and prevention implications.
      - >-
        Small-balance thresholds sit where pursuit costs exceed recovery,
        commonly cited in the $10-$20 range for auto-adjustment — an
        organizational policy decision, not an industry mandate.
      - >-
        Approval governance: documented rationale, tiered approval escalating
        with dollar amount, manager or compliance sign-off, and periodic
        appropriateness reviews with segregation of duties; a cited operating
        KPI keeps total write-offs under 5% of collections.
      - >-
        Never let denial-driven write-offs post under generic contractual
        adjustment codes; a CO group code plus a denial CARC at posting time
        should force a denial-write-off reason code.
    cautions:
      - >-
        Specific dollar thresholds and approval tiers are vendor-published
        guidance, not association-set standards.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
