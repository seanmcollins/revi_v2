  - id: ops.appeals_medicaid
    title: Medicaid managed care appeals and state fair hearings (42 CFR 438)
    domains: [workflow, appeals, medicaid]
    aliases:
      - medicaid appeals
      - state fair hearing
      - 42 cfr 438
    summary: >-
      Under 42 CFR part 438, a Medicaid managed care enrollee has 60 calendar
      days from an adverse benefit determination notice to file a plan-level
      appeal, which the plan must resolve within 30 calendar days (72 hours
      expedited, extendable by up to 14 days). The plan appeal must be
      exhausted before a state fair hearing, and states must allow 90-120
      calendar days from the plan's resolution notice to request the hearing.
      Procedures and provider standing vary meaningfully by state.
    key_points:
      - >-
        Filing: 60 calendar days from the adverse benefit determination
        notice, orally or in writing (438.402).
      - >-
        Resolution: standard appeals within 30 calendar days; expedited
        within 72 hours; both extendable up to 14 days (438.408).
      - >-
        Exhaustion: a fair hearing is available only after the plan upholds
        the determination — except that plan failure to meet notice and
        timing requirements deems the appeal exhausted.
      - >-
        Fair-hearing window: no less than 90 and no more than 120 calendar
        days from the plan's notice of resolution (438.408).
      - >-
        Medicaid appeal analytics must be state- and plan-parameterized:
        the federal floor sets ranges, but states set exact deadlines,
        provider standing, and claim-dispute channels.
    cautions:
      - >-
        These are beneficiary-appeal rules; provider claim-dispute processes
        for Medicaid MCOs are governed by state contracts and vary widely.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
