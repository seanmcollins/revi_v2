  - id: benchmark.denial_rate_by_payer_type
    title: Initial denial rates by payer type (MA vs commercial vs Medicaid vs Medicare)
    domains: [benchmarks, denials, payer_behavior]
    aliases:
      - denial rate by payer
      - denial rates by payer type
      - payer type denial rates
    summary: >-
      Payer type is one of the strongest predictors of denial exposure.
      Premier's 2023 survey found Medicaid FFS (16.7%) and Medicare Advantage
      (15.7%) with the highest initial denial rates and traditional Medicare
      the lowest (8.4%). Crowe platform data shows an even starker gap:
      commercial payers initially denied 15.1% of hospital claims in Q1 2023
      versus 3.9% for traditional Medicare.
    key_points:
      - >-
        Premier survey (2023): Medicaid 16.7%, Medicare Advantage 15.7%,
        managed Medicaid 15.1%, commercial 13.9%, traditional Medicare 8.4%
        of claims initially denied.
      - >-
        Crowe RCA (1,800+ hospitals, Q1 2023): commercial payers initially
        denied 15.1% of inpatient+outpatient claims vs 3.9% for traditional
        Medicare; authorization-related inpatient denials were 3.2%
        (commercial) vs 0.2% (Medicare).
      - >-
        The Medicare spread (3.9% Crowe vs 8.4% Premier) reflects methodology
        differences — platform remit data vs self-reported survey — not payer
        behavior.
      - >-
        KFF consumer polling (2023) is directionally consistent: ~21% of
        employer-sponsored enrollees and 20% of marketplace enrollees
        reported claim denials vs 10% in traditional Medicare and 12% in
        Medicaid.
    cautions: []
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
    sources:
      - id: techtarget-payer-breakdown
        title: Breaking down claim denial rates by healthcare payer
        publisher: TechTarget (Premier, KFF, CMS data)
        url: https://www.techtarget.com/revcyclemanagement/feature/Breaking-down-claim-denial-rates-by-healthcare-payer
        authority: trade press synthesis of primary sources
        effective_from: 2023-01-01
