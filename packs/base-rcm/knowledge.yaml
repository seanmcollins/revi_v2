  - id: benchmark.aged_ar_over_90
    title: Aged A/R greater than 90 days as a share of total receivables
    domains: [benchmarks, accounts_receivable]
    aliases:
      - ar over 90 benchmark
      - aged ar benchmark
      - receivables aging benchmark
    summary: >-
      Kodiak's platform data documents a structural deterioration in
      receivables aging: commercial A/R over 90 days climbed from about 27%
      of receivables in 2020 to 36% by Q3 2023, and Medicare Advantage from
      19% to 27%. AHA survey data corroborates the scale — half of hospitals
      reported over $100 million in receivables older than six months in
      2022.
    key_points:
      - >-
        Kodiak (Dec 2023): commercial-payer A/R aged over 90 days reached 36%
        in Q3 2023, up from ~27% in 2020; Medicare Advantage 27%, up from 19%.
      - >-
        Crowe (Q1 2023): 31% of commercial inpatient claims went unpaid for
        more than 90 days vs 12% of Medicare claims — aging is payer-driven,
        not process-driven.
      - >-
        AHA survey: 50% of hospitals/health systems reported more than $100M
        in A/R for claims older than six months in 2022.
      - >-
        Aged A/R over 90 days corresponds to HFMA MAP Keys AR-1 through AR-4;
        the figures above are the only large-sample published values for the
        metric.
    cautions: []
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
    sources:
