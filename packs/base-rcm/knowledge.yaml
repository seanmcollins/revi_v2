  - id: ops.cob_ordering_msp
    title: "COB ordering rules: NAIC order of benefits and Medicare Secondary Payer"
    domains: [workflow, cob, medicare]
    aliases:
      - birthday rule
      - cob ordering
      - msp rules
      # deliberate concept overlap: the concept defines, this card elaborates
      - coordination of benefits
      - working aged
    summary: >-
      COB denials arise when claims go to the wrong payer first. Commercial
      ordering follows NAIC-derived rules: the plan covering someone as
      subscriber pays before a plan covering them as dependent; for dependent
      children, the parent whose birthday falls earlier in the calendar year
      is primary; active-employee coverage beats retiree coverage. Medicare
      Secondary Payer rules override for Medicare patients: employer group
      plans pay primary for the working aged when the employer has 20+
      employees, large group plans (100+) pay primary for the disabled, and
      ESRD has a 30-month coordination period.
    key_points:
      - >-
        Non-dependent/dependent rule: the plan covering the patient as
        enrollee/subscriber is primary over one covering them as a dependent.
      - >-
        Birthday rule (dependent children): the parent whose birthday
        (month/day only, not age) falls first in the calendar year is
        primary; identical birthdays fall back to the longer-in-effect plan;
        divorce decrees and court orders can supersede.
      - >-
        MSP working aged: for beneficiaries 65+ with group coverage through
        current employment, the group plan is primary if the employer has 20+
        employees. Disability: large group plans (100+ employees) pay
        primary. ESRD: the group plan pays primary during a 30-month
        coordination period regardless of employer size.
      - >-
        Operational musts: administer the MSP questionnaire at registration,
        submit MSP codes and primary-payer information on claims, and treat
        COB denials as a routing problem — rebill the true primary within its
        filing window, then bill secondary with the primary's remittance.
    cautions:
      - >-
        State COB regulations can vary from the NAIC model.
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
    sources:
      - id: cgs-msp-chapter11
