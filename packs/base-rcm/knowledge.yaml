  - id: reg.hospital_price_transparency
    title: "Hospital price transparency: CY2026 allowed-amount and attestation requirements"
    domains: [regulatory, price_transparency]
    aliases:
      - hospital price transparency
      - machine-readable file
      - mrf allowed amounts
      - 45 cfr 180
    summary: >-
      In the CY2026 OPPS/ASC final rule (CMS-1834-FC, Nov 21, 2025), CMS
      requires hospitals to publish actual dollar figures in their
      machine-readable files: the median, 10th, and 90th percentile allowed
      amounts (plus the count used), calculated from 835 remittance data.
      Percentage or algorithm-based negotiated charges must be converted to
      dollars, attestations are strengthened, and Type 2 NPIs must be
      encoded. New requirements took effect January 1, 2026 with enforcement
      from April 1, 2026.
    key_points:
      - >-
        The "estimated allowed amount" is replaced by median, 10th, and 90th
        percentile allowed amounts plus a count element, derived from EDI 835
        remittance data over a 12-15 month lookback — hospital MRF economics
        now run on the same 835 data RCM analytics consume.
      - >-
        Strengthened attestation at 45 CFR 180.50: data is true, accurate,
        and complete, and the MRF must name the accountable senior official.
      - >-
        Hospitals must encode organizational (Type 2) NPIs with hospital
        taxonomy codes in the MRF.
      - >-
        Civil monetary penalties are reduced 35% when a hospital waives its
        ALJ hearing — except for core violations (no MRF at all, or no
        shoppable-services display or price estimator).
    cautions: []
