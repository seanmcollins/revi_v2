  - id: reg.transparency_in_coverage
    title: "Payer price transparency: Transparency in Coverage MRFs and the 2025 proposed overhaul"
    domains: [regulatory, price_transparency]
    aliases:
      - tic
      - transparency in coverage
      - payer mrf
    summary: >-
      Non-grandfathered group health plans and issuers must publicly post
      monthly machine-readable files of in-network negotiated rates and
      out-of-network allowed amounts (enforced since July 1, 2022), plus
      consumer cost-sharing tools. Compliance is assessed against MRF schema
      version 2.0 beginning February 2, 2026. A December 23, 2025 proposed
      rule would restructure the files around provider networks, add
      contextual files, and remove "ghost rates."
    key_points:
      - >-
        Baseline obligations: monthly public in-network rate and
        out-of-network allowed-amount files plus an internet price-comparison
        tool covering all items and services.
      - >-
        The Dec 2025 proposed rule would organize in-network files at the
        provider-network level, add plan identifiers and enrollment counts,
        and drop unlikely provider-to-service rate mappings to shrink files.
      - >-
        TiC files are the standard external reference for benchmarking
        negotiated rates against payer-reported data, but are payer-attested
        and notoriously noisy (ghost rates, stale mappings) — defects the
        proposed rule itself acknowledges.
      - >-
        The proposal would also require cost information by phone, satisfying
        No Surprises Act section 114 obligations.
    cautions:
      - >-
        The December 2025 rule is proposed, not final — track before building
        ingest pipelines against it. DOL's FAQ page could not be loaded
