  - id: payer.ma.denial_patterns
    title: Medicare Advantage claim denial patterns
    domains: [payer_behavior, medicare_advantage, denials]
    aliases:
      - MA denial rate
      - medicare advantage denials
      - MA claim denials
    summary: >-
      MA plans deny substantially more initial claims than traditional
      Medicare and their denial volume is growing fastest of any payer class.
      A peer-reviewed Health Affairs study of 270 million MA claims found a
      17% initial denial rate with 57% of denials eventually overturned, but
      the unrecovered remainder still cut provider MA revenue by 7%. AHA data
      shows MA denials grew 55.7% for the median hospital between January
      2022 and July 2023.
    key_points:
      - >-
        Health Affairs (June 2025, 2019 claims covering ~30% of the MA
        market): MA denied 17% of initial claim submissions — 21.1% of
        noninpatient, 17.3% of inpatient, and 14.6% of physician claims.
      - >-
        57% of MA claim denials were ultimately overturned, yet denials still
        produced a 7% net reduction in provider MA revenue (dollar-weighted
        share not overturned).
      - >-
        AHA (Sept 2024): MA denial-related revenue reductions rose 55.7% for
        the median hospital from Jan 2022 to July 2023, vs 20.2% for
        commercial plans.
      - >-
        Premier survey (2023): 15.7% of MA claims initially denied — highest
        among private payer types; over a quarter of MA claims are subject to
        prior authorization.
      - >-
        Kodiak: MA accounts receivable aged over 90 days grew from 19% (2020)
        to 27% (Q3 2023), signaling slower MA payment.
    cautions:
      - >-
        Health Affairs full text is paywalled; figures verified against the
        journal's abstract and secondary coverage. The study uses 2019 claims
        — pre-dating the post-2022 MA denial surge, so current MA denial
        rates are likely higher.
