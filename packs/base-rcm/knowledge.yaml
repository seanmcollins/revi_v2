  - id: benchmark.appeal_overturn_rates
    title: Appeal and overturn rates across payers
    domains: [benchmarks, appeals, payer_behavior]
    aliases:
      - overturn rate benchmark
      - appeal success rates
      - denial overturn benchmark
    summary: >-
      Overturn rates on provider-initiated appeals are consistently high —
      54-57% of claim denials are ultimately paid, and over 80% of appealed
      MA prior-authorization denials are reversed — the core evidence that
      initial denials function largely as payment friction rather than final
      coverage decisions. Consumer-initiated appeals fare far worse: insurers
      upheld 56-66% of marketplace internal appeals.
    key_points:
      - >-
        Premier survey (2023): 54.3% of private-payer claim denials were
        ultimately overturned and paid; MA-specific overturns near 53%.
      - >-
        Health Affairs (2019 MA claims): 57% of MA claim denials ultimately
        overturned; the unrecovered remainder still cut provider MA revenue
        7%.
      - >-
        KFF (2024): 80.7% of appealed MA prior-auth denials partially or
        fully overturned (81.7% in 2023); more than 8 in 10 in every year
        studied.
      - >-
        Kodiak reports payers ultimately pay approximately 90% of initially
        denied claims.
      - >-
        Contrast — KFF marketplace consumer appeals: insurers upheld 56%
        (2023) and 66% (2024) of internal appeals, i.e. consumer overturn
        rates of only ~34-44%.
    cautions: []
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
    sources:
      - id: premier-denials-2024
        title: "Trend Alert: Private Payers Retain Profits by Refusing or Delaying Legitimate Medical Claims"
        publisher: Premier Inc.
        url: https://premierinc.com/newsroom/blog/trend-alert-private-payers-retain-profits-by-refusing-or-delaying-legitimate-medical-claims
        authority: national provider survey (primary)
        effective_from: 2023-12-31
        last_verified_at: 2026-08-07
      - id: kff-ma-prior-auth-2024
        title: Medicare Advantage Insurers Made Nearly 53 Million Prior Authorization Determinations in 2024
        publisher: KFF
        url: https://www.kff.org/medicare/medicare-advantage-insurers-made-nearly-53-million-prior-authorization-determinations-in-2024/
