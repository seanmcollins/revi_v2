  - id: payer.overpayment_clawbacks
    title: "Clawbacks and takebacks: overpayment lookback windows vary by state and program"
    domains: [payer_behavior, commercial, write_offs]
    aliases:
      - clawback lookback
      - overpayment recovery
      - recoupment lookback
      - takeback windows
    summary: >-
      Payers recover claimed overpayments through demand letters and
      unilateral offsets against future remittances, and the permissible
      lookback window depends on state law and line of business.
      EmblemHealth's published policy illustrates the spread: 2 years for
      commercial, 1 year for Medicare Advantage (5 with new material
      evidence), 3 years for FEHB, 6 years for Medicaid reclamation. Validate
      every takeback against the applicable lookback limit before repaying or
      allowing offset.
    key_points:
      - >-
        NY Insurance Law 3224-b caps most commercial recoveries at 24 months
        after original payment with required notice, but exempts fraud or
        abusive billing, self-funded plans, and government programs; other
        states set 12-30 month limits and some restrict unilateral offset.
      - >-
        Fraud allegations remove time limits almost everywhere — payers
        sometimes invoke "abusive billing" language to reach past the cap,
        which is contestable.
      - >-
        Coordination-of-benefits-driven takebacks (payer later claims it was
        secondary) are a major clawback category; pair recoupment defense
        with corrected billing to the true primary within its filing window.
      - >-
        Operational control: route all recoupment demands and offsets through
        a single queue that checks state lookback law, contract terms, notice
        adequacy, and appeal deadlines before funds move.
    cautions:
      - >-
        EmblemHealth is one payer's published policy used as a concrete
        example; state-by-state lookback statutes were not individually
        verified.
