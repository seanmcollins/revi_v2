  - id: reg.hipaa_transaction_standards
    title: "HIPAA transaction standards: 837/835, operating rules, recent Part 162 changes"
    domains: [regulatory, edi]
    aliases:
      - hipaa transactions
      - 45 cfr 162
      - x12 5010
      - operating rules
    summary: >-
      45 CFR part 162 adopts the X12N version 005010 standards — the 837
      institutional/professional/dental for claims and the 835 for payment
      and remittance advice — that all covered entities must use, together
      with federally mandated CAQH CORE operating rules for eligibility,
      claim status, and EFT/ERA. The part has been actively amended: NCPDP
      pharmacy standard updates phase in through 2027-2028, and a March 24,
      2026 rule adopted the first claims-attachment standards.
    key_points:
      - >-
        Claims: X12N 837 professional/institutional/dental are the adopted
        standards (162.1102); remittance: 835 (162.1602); eligibility
        270/271, claim status 276/277, enrollment 834 round out the set.
      - >-
        Operating rules under ACA section 1104 are mandatory for eligibility,
        claim status, and EFT/ERA — including the CORE rule constraining
        uniform CARC/RARC use (compliance since Jan 1, 2014); CAQH CORE is
        the HHS-designated authoring entity.
      - >-
        CMS-0057-F introduced enforcement discretion for the X12 278 prior
        authorization transaction when payers implement FHIR-based Prior
        Authorization APIs — an explicit crack in the X12-only regime.
      - >-
        For analytics: 835 CARC/RARC/group-code semantics are the regulatory
        backbone of denial categorization, and CY2026 hospital price
        transparency allowed amounts must now also be computed from 835 data.
    cautions: []
    authored_by: machine-researched (KB wave 1, 2026-08-07)
    review_status: machine_researched
