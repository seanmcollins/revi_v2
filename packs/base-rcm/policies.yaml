# Governed policies: what evidence supports which claims (conclusion
# policies), how findings are ordered (ranking policies), and detector
# thresholds with the [min, max] ranges overlays may tune within.
conclusion_policies:
  - id: denial_spike_claim
    claim: >-
      A denial spike is attributable to a specific payer, code pair, or
      service-line cell.
    required_grade: derived
    required_evidence: [denial_trend, denial_code_mix, denial_concentration]
    estimate_label_required: false
  - id: cash_driver_claim
    claim: >-
      A posted-cash decline is attributable to named payer-level volume
      and/or timing drivers.
    required_grade: derived
    required_evidence: [weekly_cash_trend, cash_by_payer]
    estimate_label_required: false
  - id: cob_confirmed_claim
    claim: >-
      A coordination-of-benefits problem exists for the scoped payer
      population (claims billed primary while other coverage exists).
    required_grade: direct
    required_evidence: [cob_mismatch_by_payer]
    estimate_label_required: false
  - id: cob_suspected_claim
    claim: >-
      Elevated COB-typed denial codes suggest a possible coordination-of-
      benefits problem; code concentration alone does not prove one, so this
      claim is always voiced in qualified language.
    required_grade: proxy
    required_evidence: [cob_code_proxy]
    estimate_label_required: false
  - id: underpayment_claim
    claim: >-
      A payer is paying below contract-expected amounts for an identified
      cohort; variance is reported without netting overpayments.
    required_grade: derived
    required_evidence: [underpayment_by_payer, realization_check]
    estimate_label_required: false
  - id: timely_filing_risk_claim
    claim: >-
      Unsubmitted OPEN inventory of a stated size stands against named
      plans, and a stated share of it is inside — or already past — the
      filing limit its plan configures. This is the risk claim the policy
      was written for and could not license until the claim -> plan ->
      filing-rule join landed (NOTES.md, 2026-08-09). Two conditions hold
      it honest. The claim must rest on the runway CUT, not the total: the
      ungrouped figure is the population a filing watch would age, never an
      exposure, and an answer citing it without the runway breakdown is
      still making the upper-bound claim. And any runway stated for a plan
      whose rule carries requires_confirmation must be labeled a planning
      default to confirm against the payer contract — only 7 of the 30
      plans in this warehouse match a rule that needs no confirmation, so
      most rows are defaults and saying otherwise would assert a deadline
      the pack does not know.
    required_grade: derived
    required_evidence: [at_risk_by_plan, filing_runway_profile]
    estimate_label_required: false
  - id: scorecard_claim
    claim: >-
      A dimension value materially under- or over-performs peers across the
      scorecard's governed metrics.
    required_grade: derived
    required_evidence: [scorecard_flow, scorecard_ar]
    estimate_label_required: false
  - id: cash_outlook_estimate
    claim: >-
      Projected posted cash for the horizon, as a qualified range with named
      drivers. This is an estimate derived from inventory, realization, and
      lag history — never a certified forecast, and it must always be
      labeled as an estimate.
    required_grade: derived
    required_evidence: [open_inventory, realization_rates, payment_lags]
    estimate_label_required: true
  - id: portfolio_item_claim
    claim: >-
      An issue belongs in today's ranked portfolio with a stated dollar
      impact and evidence grade.
    required_grade: derived
    required_evidence: [portfolio_cash_trend, portfolio_denial_trend]
    estimate_label_required: false
  # --- coverage wave 2 (2026-08-08): policies for the widened playbook set --
  - id: ar_aging_claim
    claim: >-
      Movement in the receivable is attributable to named aging bands,
      payers, or the standing-denied slice — rather than to inflow.
      Requires the aging profile AND both inflow and outflow context: A/R
      that grows with charges is business, not a collection failure, and a
      claim that skips the inflow evidence cannot tell the two apart.
    required_grade: derived
    required_evidence: [ar_profile, ar_aging_by_payer, ar_inflow, ar_outflow]
    estimate_label_required: false
  - id: appeal_effectiveness_claim
    claim: >-
      The appeal function's win rate, pipeline state and never-appealed
      share are established for the scoped population, and the recommended
      shift in appeal effort follows from them. Both overturn forms are
      required evidence: a count rate alone cannot support a
      where-to-spend-effort claim when the dollar rate disagrees.
    required_grade: derived
    required_evidence: [overturn_by_payer, overturn_by_category, appeal_pipeline]
    estimate_label_required: false
  - id: credit_balance_claim
    claim: >-
      Unrefunded credit balances of a stated size are standing against named
      payers, and the refund pace is or is not clearing them. Compliance-
      mandatory work: the claim is made regardless of dollar size.
    required_grade: derived
    required_evidence: [credit_standing, refund_activity]
    estimate_label_required: false
  - id: clean_claim_claim
    claim: >-
      A change in first-pass quality is attributable to named payers,
      root-cause categories, or billing timing. Always voiced with the
      outcome-derived caveat — this warehouse has no scrubber events, so
      "clean" means "landed cleanly", not "passed our edits".
    required_grade: derived
    required_evidence: [clean_trend, clean_by_payer, failure_reasons]
    estimate_label_required: false
  - id: patient_responsibility_claim
    claim: >-
      The size, mix and collection state of the patient book are established
      for the scoped population. The billed-out and collected sides are
      reported as separate series; a cell-by-cell patient collection rate is
      never asserted from them.
    required_grade: derived
    required_evidence: [pr_dollars, pr_share, patient_cash_trend]
    estimate_label_required: false
  - id: charge_capture_claim
    claim: >-
      Procedure-level charge capture moved materially and the movement is
      localized to named facilities or procedure groups. Claim volume context
      is required evidence: lines per claim vary by service line, so a
      line-count move is only a capture finding once claim volume is read
      beside it. Deliberately narrower than "we are missing charges" —
      attributing a movement to missed or late capture needs the unbilled
      inventory and charge-entry-timing evidence, which is why those probes
      are in the playbook but the claim above does not assert them.
    required_grade: derived
    required_evidence: [procedure_volume, claim_volume_context]
    estimate_label_required: false
  - id: payer_scorecard_claim
    claim: >-
      A named payer's behavior differs materially from its peers across the
      governed payer-performance metrics, on a shared-mix comparison.
      Requires both the flow view and the receivable view — a payer that
      denies little but pays late is a finding the flow view alone misses.
    required_grade: derived
    required_evidence: [payer_flow, payer_receivable, payer_denial_profile]
    estimate_label_required: false
  - id: denial_category_claim
    claim: >-
      Denials in a named root-cause category are concentrated in identified
      cells and route to a named owning stage (front end, coding, billing,
      contracting). Requires the category rollup AND the code detail: a
      category is a rollup of group-code + CARC pairs, and the owning stage
      follows from the pairs, not from the category label.
    required_grade: derived
    required_evidence: [category_rollup, category_code_detail, category_concentration]
    estimate_label_required: false
  - id: volume_mix_claim
    claim: >-
      A movement in volume or charge value is attributable to a shift in
      payer, service-line or procedure mix rather than to rate or process
      change. Requires volume, charge value and the mix share together —
      any two of the three cannot separate mix from price.
    required_grade: derived
    required_evidence: [volume_trend, mix_by_payer, mix_by_service_line]
    estimate_label_required: false
  - id: write_off_claim
    claim: >-
      Non-contractual write-off dollars of a stated size are concentrated in
      named cells, and are distinguished from contractual allowance. The
      contractual series is required evidence precisely so the claim can
      say what it is NOT: a contractual adjustment is the negotiated
      discount, never leakage.
    required_grade: derived
    required_evidence: [write_off_trend, write_off_by_payer, contractual_context]
    estimate_label_required: false

ranking_policies:
  - id: impact_first
    description: >-
      Order findings by financial impact in cents, then recency, then
      evidence grade — certified dollar impact outranks noise.
    weights: {impact_cents: 0.6, recency: 0.25, evidence_grade: 0.15}
  - id: urgency_first
    description: >-
      Order findings by how little time is left, not by how much money is
      in them. For a cut whose dimension is an ordinal bucket the catalog
      declares an order for — filing runway, aging — that declared order IS
      the ranking, and dollars only break ties inside a band. Impact-first
      on a deadline question headlines the SAFEST band: "is anything about
      to miss a filing deadline?" answered with the 90+ runway bucket, the
      one furthest from the deadline it asked about, while `expired` came
      third.
    weights: {urgency_position: 0.8, impact_cents: 0.2}
  - id: residual_last
    description: >-
      A catch-all bucket is never the answer. `OTHER` is the largest cell in
      several of this pack's cuts by construction — it is where everything
      that did not classify goes — and impact-first therefore made it the
      #1 answer to "what are we getting denied for most?". It is still
      published, with its figure, after every classified cell: the size is
      real and the label carries no information a reader can act on.
    weights: {impact_cents: 0.6, recency: 0.25, evidence_grade: 0.15}
  - id: portfolio_impact_rank
    description: >-
      Portfolio ordering: impact-cents-weighted with recency, evidence
      grade, and deadline proximity (timely-filing items surface before
      their limits pass, not after).
    weights:
      impact_cents: 0.55
      recency: 0.2
      evidence_grade: 0.15
      deadline_proximity: 0.1

detector_policies:
  - id: denial_rate_spike
    description: >-
      Flag when the weekly denial rate rises by more than this relative
      share over the trailing four-full-week baseline (0.25 = a 25 percent
      relative increase, e.g. 8% -> 10%).
    threshold: 0.25
    threshold_min: 0.10
    threshold_max: 0.60
  - id: cash_decline_detector
    description: >-
      Flag when weekly posted cash falls by more than this share versus the
      prior full week (0.10 = a 10 percent decline).
    threshold: 0.10
    threshold_min: 0.05
    threshold_max: 0.30
  - id: posting_lag_stretch
    description: >-
      Flag when a payer's average days-to-pay stretches by more than this
      many days over its trailing six-week baseline.
    threshold: 3
    threshold_min: 1
    threshold_max: 7
  - id: underpayment_detector
    description: >-
      Flag when a payer cohort's never-netted underpayment variance exceeds
      this share of contract-expected reimbursement (0.03 = 3 percent of
      expected).
    threshold: 0.03
    threshold_min: 0.01
    threshold_max: 0.10
  # --- anomaly portfolio prioritization (governed parameters) --------------
  # The priority formula itself is versioned platform code
  # (revi_api.portfolio, anomaly_priority@3); these bounded parameters are
  # the tunable pack content it combines. Weights are relative shares of
  # the three components (normalized in code); the half-life drives the
  # recency decay 0.5^(age_days / half_life); the compliance floor below is
  # now the FALLBACK floor (since @2 the floor applied is the median score
  # of the non-floored population, and the response says which basis was
  # used).
  #
  # What the formula normalizes changed in @3: the impact and recoverable
  # terms are computed from the figure the platform is prepared to defend —
  # its own re-derivation where that DIVERGES from the detector's, the
  # detector's otherwise — and every card publishes which one ranked it
  # (`ranked_on`), the figure itself, and the population's normalizer. The
  # weights below are unchanged and still mean the same thing.
  - id: anomaly_priority_impact_weight
    description: >-
      Weight of the dollar-weighted component (raw impact_cents) in the
      anomaly priority score. Deliberately below the actionability weight:
      un-fixable dollars must not outrank fixable ones.
    threshold: 0.25
    threshold_min: 0.10
    threshold_max: 0.70
  - id: anomaly_priority_recency_weight
    description: >-
      Weight of the recency component (half-life decay over the anomaly's
      age at the pinned watermark) in the anomaly priority score.
    threshold: 0.15
    threshold_min: 0.05
    threshold_max: 0.50
  - id: anomaly_priority_actionability_weight
    description: >-
      Weight of the actionability component (the recoverable-dollar
      estimate from the governed actionability rules) in the anomaly
      priority score. The dominant component: "can this actually be
      fixed?" is the primary discriminator.
    threshold: 0.60
    threshold_min: 0.10
    threshold_max: 0.80
  - id: anomaly_recency_half_life_days
    description: >-
      Half-life, in days, of the recency decay: an anomaly this old
      contributes half the recency score of one detected today.
    threshold: 14
    threshold_min: 3
    threshold_max: 60
  - id: anomaly_compliance_floor
    description: >-
      Minimum priority score for compliance-mandatory categories (credit
      balances must be worked regardless of dollar size).
    threshold: 0.60
    threshold_min: 0.30
    threshold_max: 0.90
