# Governed anomaly-actionability rules: "can this actually be fixed?"
#
# Deterministic recoverable-fraction assessments applied to each detected
# anomaly's EVIDENCE FACTS (counts, deadline stats, flags) by the portfolio
# service — never hardcoded per anomaly. Each category rule declares:
#
#   mode: fraction        -> recoverable = impact x fraction
#         open_share      -> recoverable = impact x open / (open + expired)
#                            (facts named by open_fact / expired_fact;
#                            missing facts fall back to `fraction`)
#         flag_share      -> recoverable = impact x numerator / denominator
#                            (facts named by numerator_fact / denominator_fact)
#   compliance_floor: true -> the priority score is floored at the governed
#                             anomaly_compliance_floor policy value —
#                             compliance work does not sink below noise.
#   rationale: plain-language justification the narrative and UI may cite.
#
# This file is pack-adjacent governed content: the strict pack loader is
# mid-flight in a concurrent workflow, so these rules ride in their own
# file (read and content-hashed by the API composition root) until the
# loader gains an anomaly_actionability artifact type.
version: 1

# --- Drill repoints: when a detector record's metric id cannot express the
# number the record published -------------------------------------------
#
# A card asserts a LEVEL over one cell and publishes `impact_cents`. The
# drill re-derives that assertion from the platform's own contracts, so the
# drilled metric has to be able to produce the figure on the card. The
# `denial_rate` detector records fail that test twice over: the metric is a
# ratio (it cannot produce dollars at all) and it is claim-grain with a
# REMIT primary basis that the catalog does not bind at the claim entity,
# so the drill refuses outright with DATE_BASIS_INVALID. Nine of the
# portfolio's cards — four of the top eleven — were un-investigable for
# that reason alone.
#
# What those records actually measured is denied dollars: over the whole
# population the repointed drill reproduces each card's own impact figure
# to within a few percent (ANM-005/007/008/029 to the cent). So the drill
# handle points at `denied_dollars`, which is DENIAL-grain with REMIT
# bound, carries the same payer / plan / service_line scope, and is a money
# contract.
#
# This is a repoint, not a repair. The right long-term fix is upstream, in
# the detection feed that filed a dollar measurement under a rate metric
# id; every repointed card says so on the wire
# (`drill_repointed_from`), so a reader is never told the drill confirms a
# number it did not compute.
drill_repoints:
  denial_rate:
    metric_id: denied_dollars
    rationale: >-
      The detector published a dollar impact under a ratio metric that is
      also unprobeable at its own grain (REMIT is not bound for the claim
      entity). denied_dollars measures the same population in the unit the
      card actually reports.

# --- Drill dimension repoints: when the detector's CUT is not a legal
# scope dimension of the contract that must answer it --------------------
#
# The detection feed cuts procedures at `proc_group`, which binds on
# claim_line. Four cards — ANM-013 ($493,266, the largest card on the
# worklist and the anchor of impact normalisation) plus ANM-011/012/030 —
# name a claim-grain contract (gross_collection_rate,
# underpayment_variance) alongside a `proc_group` value, and the platform
# refused them with GRAIN_INCOMPATIBLE: a claim-grain contract had no legal
# procedure cut at all.
#
# The catalog now certifies `primary_proc_group` at the claim AND
# transaction grains — the claim's DOMINANT procedure group, the one
# carrying the largest share of its billed charges, ties broken by name —
# and both contracts were widened to accept it (v2, scope only). So the
# drill can be pointed at the cut that exists.
#
# This is a SUBSTITUTION, not a translation, and the difference is
# published on every card that uses it (`drill_dimension_repoints`):
#
#   * the detector measured LINES in procedure group X;
#   * the drill measures CLAIMS whose dominant procedure group is X.
#
# For a single-procedure claim those are the same population. For a
# multi-procedure claim they are not: the non-dominant lines are attributed
# to the dominant group along with everything else on that claim. That is
# exactly why the card's figure and the drill's may differ, and the
# card/answer reconciliation states the gap rather than hiding it.
#
# Applied only where it is BOTH needed and legal: the platform substitutes
# nothing when the drilled contract already accepts the detector's own
# dimension (denial-grain and line-grain contracts keep `proc_group`), and
# nothing when the contract does not accept the replacement either.
drill_dimension_repoints:
  proc_group:
    dimension_id: primary_proc_group
    rationale: >-
      Procedures bind at claim_line, so a claim-grain contract cannot be
      cut by `proc_group` at all. `primary_proc_group` is the claim's
      dominant procedure group (largest share of billed charges, ties
      broken by name), certified at the claim and transaction grains. Read
      the drill as an attribution of whole claims, not a decomposition of
      lines: the detector counted lines in this group, and the drill counts
      claims whose largest procedure group is this one.

default:
  mode: fraction
  fraction: 0.50
  rationale: >-
    No category-specific assessment exists; assume half the impact is
    workable until the category gains governed rules.
categories:
  TIMELY_FILING:
    mode: open_share
    open_fact: open_claims
    expired_fact: expired_claims
    fraction: 0.0
    rationale: >-
      Only claims still inside their filing limit can be recovered; dollars
      on claims past the deadline are gone (0 when everything has expired,
      the full share of still-open claims otherwise). The open/expired split
      comes from the DETECTOR's own evidence facts, which is the only place
      deadline state exists today: the platform's own
      timely_filing_at_risk_dollars contract applies no deadline predicate
      and cannot supply it (see ../metric_display.yaml and NOTES.md). So
      this rule prices a deadline the detector observed, never one this
      platform derived.
  UNDERPAYMENT:
    mode: fraction
    fraction: 0.85
    rationale: >-
      Contract-variance disputes recover most of the shortfall through the
      payer dispute path; expected-vs-allowed evidence is already on file.
  CREDIT_BALANCE:
    mode: fraction
    fraction: 1.0
    compliance_floor: true
    rationale: >-
      Credit balances are compliance-mandatory work: refunds are owed
      regardless of dollar size, so priority is floored — small balances
      never sink below discretionary work.
  DUPLICATE:
    mode: fraction
    fraction: 0.90
    rationale: >-
      Duplicate denials resolve through the rebill/void path with high
      certainty; the dollars are almost always recoverable.
  DENIAL_SPIKE:
    mode: flag_share
    numerator_fact: appealable_claims
    denominator_fact: denied_claims
    fraction: 0.40
    rationale: >-
      Recoverability follows the appealable share of the denied claims;
      non-appealable denials route to prevention, not recovery.
  COB:
    mode: fraction
    fraction: 0.70
    rationale: >-
      Coordination-of-benefits rebills recover most affected dollars once
      the correct payer order is established.
  CASH_DECLINE:
    mode: fraction
    fraction: 0.30
    rationale: >-
      A posted-cash decline mixes timing (self-correcting) with volume
      (not recoverable after the fact); only the workable slice counts.
  CONTRACTUAL:
    mode: fraction
    fraction: 0.02
    rationale: >-
      Working-as-designed contractual adjustments are not an error; the
      dollars are not recoverable and the anomaly is informational.

  # --- coverage wave 2 (2026-08-08) ---------------------------------------
  #
  # Seven categories the detection feed actually emits had no governed rule
  # and fell to the blanket 50% default: DNFB, UNWORKED_DENIALS,
  # SUBMISSION_GAP, ELIGIBILITY_CLUSTER, POSTING_LAG, CHARGE_ENTRY_LAG and
  # CHARGE_HOLD. Between them they are roughly half of every snapshot's
  # portfolio, so "assume half is workable" was setting the priority order
  # for half the worklist. Each rule below names the evidence facts the
  # detector already publishes for that category (verified against
  # data/answer_key.json), and each fraction is argued rather than picked.
  DNFB:
    mode: fraction
    fraction: 0.95
    rationale: >-
      Discharged-not-final-billed dollars are not lost, only unbilled: the
      account exists, the charges exist, and finishing the bill recovers
      them. The small unrecoverable residue is the coding or documentation
      gap that never closes. Deliberately below DUPLICATE's certainty and
      above every recovery category — DNFB is the cheapest money in the
      portfolio, which is exactly why it should outrank larger, harder items.
  SUBMISSION_GAP:
    mode: fraction
    fraction: 0.90
    rationale: >-
      An unsubmitted claim is recovered by submitting it, so nearly all of
      the billed value is in play. Lower than DNFB because a submission gap
      is a claim already past its intended drop date and closer to its
      filing limit; where the deadline evidence exists the detector files
      the record under TIMELY_FILING instead, and that category prices the
      deadline directly. Deadline pricing is therefore not duplicated here:
      neither DNFB nor SUBMISSION_GAP carries days_to_deadline facts, so
      neither can use the open_share mode.
  UNWORKED_DENIALS:
    mode: flag_share
    numerator_fact: appealable_claims
    denominator_fact: denied_claims
    fraction: 0.45
    rationale: >-
      Recovery on a never-worked denial is gated first on whether an appeal
      is still possible at all, so the assessment reads the record's own
      appealable share — the same fact pair and mode DENIAL_SPIKE uses on
      the same evidence. The 0.45 above is now only the fallback for a
      record that publishes neither fact. Why the flat fraction it replaces
      was rejected: it could not see zero. ANM-004 (14 denials, every one
      past its 60-day appeal window, appealable_claims = 0) was priced at
      45% of $62,035 — $27,916 of "partially recoverable" money that no
      appeal can reach, on a card that also reports the expiry. Under
      flag_share it assesses at 0 and is labeled not recoverable, while
      ANM-027 (17 of 29 still appealable) prices at 58.6% and ANM-028 (17
      of 17) at the ceiling. Read the result as an UPPER BOUND, not an
      expectation: an appealable share gates recovery, it does not predict
      it, and a record whose denials are all still in window prices at 100%
      even though this pack's own appeal_overturn_rate puts a win near half.
      Composing the gate with the win probability needs a `product` mode
      the rule language does not have (recorded as deferred in NOTES.md).
      Until it exists, a gate that is exactly right at the zero end beats a
      flat fraction that is indefensibly wrong there.
  ELIGIBILITY_CLUSTER:
    mode: fraction
    fraction: 0.75
    rationale: >-
      Eligibility denials resolve mostly through coverage correction and
      rebill rather than appeal, which is a far higher-yield path than
      arguing the merits. The unrecoverable quarter is the patients who
      genuinely had no active coverage on the date of service — those
      balances move to patient responsibility or bad debt, they do not come
      back from the payer.
  POSTING_LAG:
    mode: fraction
    fraction: 0.15
    rationale: >-
      Remitted-but-unpaid cash mostly arrives without anyone doing anything;
      the impact figure is timing, not loss. The workable slice is the
      residue where the remit never converts — unpostables, offsets and
      takebacks — so this scores low on purpose. A payment-lag anomaly
      belongs on the worklist for what it predicts about the payer, not for
      dollars to go chase.
  CHARGE_ENTRY_LAG:
    mode: fraction
    fraction: 0.10
    rationale: >-
      The charge value in a late-entry anomaly is already captured — the
      lines are on the account, just late. What is at risk is filing runway
      and cash timing, not the charge itself, so only a thin slice
      represents dollars that would otherwise have been lost. Contrast
      CHARGE_HOLD, where the charges are not on the account at all.
  CHARGE_HOLD:
    mode: fraction
    fraction: 0.60
    rationale: >-
      Accounts sitting without charges are missing revenue, not delayed
      revenue, so more is genuinely at stake than in CHARGE_ENTRY_LAG. The
      fraction is middling rather than high because the detector cannot
      value what was never entered — it publishes claims_without_charges and
      a zero billed_cents_known, so any dollar estimate on this category is
      the weakest in the portfolio and the priority it earns should reflect
      that.
