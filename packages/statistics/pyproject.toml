[project]
name = "revi-statistics"
version = "0.1.0"
description = "Deterministic statistical estimators over caller-supplied rows: censoring-honest rates, intervals, contrasts, composition."
requires-python = ">=3.12"
dependencies = [
    "revi-kernel",
    "revi-statistics-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revi_statistics"]

[tool.uv.sources]
revi-kernel = { workspace = true }
revi-statistics-contracts = { workspace = true }
