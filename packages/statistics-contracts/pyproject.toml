[project]
name = "revi-statistics-contracts"
version = "0.1.0"
description = "Public DTOs for the statistics capability."
requires-python = ">=3.12"
dependencies = [
    "revi-kernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revi_statistics_contracts"]

[tool.uv.sources]
revi-kernel = { workspace = true }
