[project]
name = "revi-store-postgres"
version = "0.1.0"
description = "Postgres adapters for application-state ports (sessions, traces, referents, cohort metadata, packs, evidence cache)."
requires-python = ">=3.12"
dependencies = [
    "revi-kernel",
    "revi-investigation-contracts",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revi_store_postgres"]

[tool.uv.sources]
revi-kernel = { workspace = true }
revi-investigation-contracts = { workspace = true }
