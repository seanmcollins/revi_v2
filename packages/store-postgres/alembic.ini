# Alembic configuration for the Revi application-state Postgres.
# Run from anywhere: `uv run alembic -c packages/store-postgres/alembic.ini upgrade head`
# (the Makefile `migrate` target). The URL comes from REVI_DATABASE_URL
# (fallback: the docker-compose default) — see migrations/env.py.

[alembic]
script_location = %(here)s/src/revi_store_postgres/migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
