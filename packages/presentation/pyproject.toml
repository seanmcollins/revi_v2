[project]
name = "revi-presentation"
version = "0.1.0"
description = "Presentation: chart specs, effective-context headers, referent assignment, gesture compilation, narrative grounding validation."
requires-python = ">=3.12"
dependencies = [
    "revi-kernel",
    "revi-investigation-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revi_presentation"]

[tool.uv.sources]
revi-kernel = { workspace = true }
revi-investigation-contracts = { workspace = true }
