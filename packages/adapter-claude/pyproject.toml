[project]
name = "revi-adapter-claude"
version = "0.1.0"
description = "Claude Agent SDK adapter implementing the LanguageModelPort."
requires-python = ">=3.12"
dependencies = [
    "revi-kernel",
    "revi-investigation",
    "claude-agent-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revi_adapter_claude"]

[tool.uv.sources]
revi-kernel = { workspace = true }
revi-investigation = { workspace = true }
