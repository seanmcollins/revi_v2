[project]
name = "revi-connector-duckdb"
version = "0.1.0"
description = "DuckDB AnalyticalRepository adapter: probe compilation, as-of snapshot resolution, cohort materialization."
requires-python = ">=3.12"
dependencies = [
    "revi-kernel",
    "revi-catalog-contracts",
    "duckdb>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revi_connector_duckdb"]

[tool.uv.sources]
revi-kernel = { workspace = true }
revi-catalog-contracts = { workspace = true }
