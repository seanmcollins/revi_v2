[project]
name = "revi-catalog"
version = "0.1.0"
description = "Semantic catalog: YAML loading, resolution, synonyms, profiles, PHI classification, suppression."
requires-python = ">=3.12"
dependencies = [
    "revi-kernel",
    "revi-catalog-contracts",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revi_catalog"]

[tool.uv.sources]
revi-kernel = { workspace = true }
revi-catalog-contracts = { workspace = true }
