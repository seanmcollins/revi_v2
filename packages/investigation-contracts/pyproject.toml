[project]
name = "revi-investigation-contracts"
version = "0.1.0"
description = "Public DTOs and the InvestigationApi protocol for the investigation capability."
requires-python = ">=3.12"
dependencies = [
    "revi-kernel",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revi_investigation_contracts"]

[tool.uv.sources]
revi-kernel = { workspace = true }
