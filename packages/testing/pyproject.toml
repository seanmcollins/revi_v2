[project]
name = "revi-testing"
version = "0.1.0"
description = "Test harness: in-memory fakes, MockLanguageModel, contract suites, golden-conversation runner, fixtures."
requires-python = ">=3.12"
dependencies = [
    "revi-kernel",
    "revi-investigation",
    "revi-investigation-contracts",
    "revi-catalog",
    "revi-calculation",
    "revi-pack",
    "revi-presentation",
    "revi-connector-duckdb",
    "revi-api",
    "httpx>=0.27",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revi_testing"]

[tool.uv.sources]
revi-kernel = { workspace = true }
revi-investigation = { workspace = true }
revi-investigation-contracts = { workspace = true }
revi-catalog = { workspace = true }
revi-calculation = { workspace = true }
revi-pack = { workspace = true }
revi-presentation = { workspace = true }
revi-connector-duckdb = { workspace = true }
revi-api = { workspace = true }
